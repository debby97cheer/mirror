name: Build Eden-CMD ARM64

on:
  workflow_dispatch:

jobs:
  build-aarch64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Configure Multiarch & Install ARM64 Dependencies
        run: |
          # 1. 拦截所有默认的 x86 源，强制标记为仅限 amd64
          # 处理 Ubuntu 24.04 的新版 ubuntu.sources 格式
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Architectures:/d' /etc/apt/sources.list.d/ubuntu.sources
            sudo sed -i 's/^Types: deb/Types: deb\nArchitectures: amd64/g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          # 处理所有旧版 .list 格式 (彻底干掉 security.ubuntu.com 和云厂商镜像的 404 报错)
          sudo find /etc/apt -type f -name "*.list" -exec sed -i -E 's/^deb (http|https)/deb [arch=amd64] \1/g' {} +

          # 2. 注入 ARM64 专属的 ports 源
          sudo tee /etc/apt/sources.list.d/arm64-ports.sources << 'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-security noble-backports
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          # 3. 启用架构并更新安装
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libdrm-dev:arm64 \
            libgbm-dev:arm64 \
            libasound2-dev:arm64 \
            libudev-dev:arm64 \
            libssl-dev:arm64 \
            libzstd-dev:arm64 \
            liblz4-dev:arm64 \
            libx11-dev:arm64 \
            libxext-dev:arm64 \
            libwayland-dev:arm64 \
            glslang-tools
            
      - name: Configure CMake
        env:
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: |
          cmake -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DOPENSSL_ROOT_DIR=/usr/lib/aarch64-linux-gnu \
            -DOPENSSL_CRYPTO_LIBRARY=/usr/lib/aarch64-linux-gnu/libcrypto.so \
            -DOPENSSL_SSL_LIBRARY=/usr/lib/aarch64-linux-gnu/libssl.so \
            -DOPENSSL_INCLUDE_DIR=/usr/include \
            -DGLSLANGVALIDATOR=/usr/bin/glslangValidator \
            -DENABLE_QT=OFF \
            -DENABLE_SDL2=ON \
            -DSDL_UNIX_CONSOLE_BUILD=ON \
            -DSDL_KMSDRM=ON \
            -DSDL_ALSA=ON \
            -DYUZU_USE_QT_MULTIMEDIA=OFF \
            -DYUZU_USE_EXTERNAL_SDL2=OFF \
            -DYUZU_USE_X11=OFF \
            -DYUZU_USE_WAYLAND=OFF \
            -DENABLE_COMPATIBILITY_LIST_DOWNLOAD=OFF \
            -DYUZU_ENABLE_COMPATIBILITY_REPORTING=OFF \
            -DENABLE_FFMPEG=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DYUZU_TESTS=OFF > cmake_log.txt 2>&1 || {
              echo "======================================"
              echo "❌ CMAKE 编译失败！自动提取真实报错... ❌"
              echo "======================================"
              grep -i -B 5 -A 15 "CMake Error" cmake_log.txt || tail -n 30 cmake_log.txt
              exit 1
            }

      - name: Compile CLI Target
        run: |
          # 限制并发线程为 2，防止内存溢出 (OOM) 导致编译器被系统杀掉
          ninja -C build -j 2 eden-cmd || ninja -C build -j 2 yuzu-cmd

      - name: Package & Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eden-cmd-aarch64
          path: |
            build/bin/eden-cmd
            build/bin/yuzu-cmd
