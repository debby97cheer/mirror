name: Build Eden Bionic Native CLI ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-eden-bionic-arm64:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. 清理 Runner 磁盘空间
      # ============================================================
      - name: Free Disk Space
        shell: bash
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf "/usr/local/share/boost" || true
          df -h

      # ============================================================
      # 2. 拉取源码与子模块
      # ============================================================
      - name: Checkout Eden Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # 3. 安装构建主机基础依赖
      # ============================================================
      - name: Install Host Dependencies
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            ccache \
            glslang-tools \
            nasm \
            libtool \
            python3 \
            pkg-config

      # ============================================================
      # 4. 配置 Android NDK r27c
      # ============================================================
      - name: Setup Android NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Export Global NDK Environment
        shell: bash
        run: |
          echo "NDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      # ============================================================
      # 5. 精准补丁构建图 (注入 NativeWindow 桩，彻底斩断 Android Framework)
      # ============================================================
      - name: Patch Eden For Pure Native Runtime
        shell: bash
        run: |
          set -eux
          echo "=== 1. 解除 YUZU_CMD 的 Android 限制 ==="
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("CMakeLists.txt")
          text = path.read_text()

          pattern = re.compile(
              r'cmake_dependent_option\(\s*YUZU_CMD\s+"[^"]*"\s+[^)]*?"NOT ANDROID"\s+OFF\s*\)',
              re.MULTILINE
          )

          if pattern.search(text):
              text = pattern.sub('option(YUZU_CMD "Compile the eden-cli executable" ON)', text, count=1)
          if 'option(YUZU_BIONIC_CLI' not in text:
              marker = 'option(YUZU_CMD "Compile the eden-cli executable" ON)'
              if marker in text:
                  text = text.replace(marker, marker + '\noption(YUZU_BIONIC_CLI "Build standalone Android/Bionic CLI" ON)', 1)

          path.write_text(text)
          PY

          echo "=== 2. 排除 yuzu-android JNI 模块 ==="
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/CMakeLists.txt")
          text = path.read_text()

          pattern = re.compile(
              r'if\s*\(\s*ANDROID\s*\)\s*add_subdirectory\(\s*android/app/src/main/jni\s*\)\s*target_include_directories\(\s*yuzu-android\s+PRIVATE\s+android/app/src/main\s*\)\s*endif\s*\(\s*\)',
              re.MULTILINE
          )

          replacement = """if (ANDROID AND NOT YUZU_BIONIC_CLI)
              add_subdirectory(android/app/src/main/jni)
              target_include_directories(yuzu-android PRIVATE android/app/src/main)
          endif()"""

          if pattern.search(text):
              text = pattern.sub(replacement, text, count=1)
          path.write_text(text)
          PY

          echo "=== 3. 从 CMake 依赖中剥离 android 与 mediandk 目标 ==="
          python3 <<'PY'
          from pathlib import Path

          # 遍历清理所有 CMakeLists.txt 中对 android 和 mediandk 的直接强链接
          for cmake_file in Path("src").rglob("CMakeLists.txt"):
              text = cmake_file.read_text()
              modified = False
              if "target_link_libraries" in text:
                  lines = text.splitlines()
                  new_lines = []
                  for line in lines:
                      # 剔除行内的 android 与 mediandk
                      if "android" in line and "yuzu-android" not in line and "NOT ANDROID" not in line and "ANDROID" not in line:
                          line = line.replace(" android", " ").replace("\tandroid", " ")
                          modified = True
                      if "mediandk" in line:
                          line = line.replace(" mediandk", " ").replace("\tmediandk", " ")
                          modified = True
                      new_lines.append(line)
                  if modified:
                      cmake_file.write_text("\n".join(new_lines))
          PY

          echo "=== 4. 补齐 <stop_token> 头文件 ==="
          for f in src/common/thread_worker.h src/common/polyfill_thread.h src/common/thread.h; do
            if [ -f "$f" ] && ! grep -q '#include <stop_token>' "$f"; then
              sed -i '1i #include <stop_token>' "$f"
            fi
          done

          echo "=== 5. 注入包含 OpenSLES 与 ANativeWindow 完整独立桩的入口 ==="
          cat > src/yuzu_cmd/eden_bionic_entry.cpp <<'EOF'
          // SPDX-License-Identifier: GPL-3.0-or-later
          #define SDL_MAIN_HANDLED 1

          #include <SDL3/SDL.h>
          #include <SDL3/SDL_main.h>
          #include <atomic>
          #include <cstdint>

          #include "common/settings.h"

          #ifdef __ANDROID__
          namespace AndroidSettings {
          Settings::Values values{};
          }

          std::atomic<int> g_battery_percentage{100};
          std::atomic<bool> g_is_charging{false};
          std::atomic<bool> g_has_battery{true};

          // ====================================================================
          // 1. OpenSLES 独立闭环桩 (消除 libOpenSLES.so)
          // ====================================================================
          extern "C" {
          struct SLInterfaceID_ {
              uint32_t time_low;
              uint16_t time_mid;
              uint16_t time_hi_and_version;
              uint16_t clock_seq;
              uint8_t  node[6];
          };

          static const struct SLInterfaceID_ s_dummy_iid = {0, 0, 0, 0, {0}};

          extern const struct SLInterfaceID_* const SL_IID_ENGINE = &s_dummy_iid;
          extern const struct SLInterfaceID_* const SL_IID_VOLUME = &s_dummy_iid;
          extern const struct SLInterfaceID_* const SL_IID_ANDROIDSIMPLEBUFFERQUEUE = &s_dummy_iid;
          extern const struct SLInterfaceID_* const SL_IID_RECORD = &s_dummy_iid;
          extern const struct SLInterfaceID_* const SL_IID_PLAY = &s_dummy_iid;

          int slCreateEngine(void*, uint32_t, const void*, uint32_t, const void*, const void*) {
              return 1;
          }

          // ====================================================================
          // 2. ANativeWindow 独立闭环桩 (消除 libandroid.so -> libgui.so)
          // ====================================================================
          int32_t ANativeWindow_setBuffersGeometry(void*, int32_t, int32_t, int32_t) { return 0; }
          int32_t ANativeWindow_getWidth(void*) { return 1800; }
          int32_t ANativeWindow_getHeight(void*) { return 2880; }
          void* ANativeWindow_fromSurface(void*, void*) { return nullptr; }
          void ANativeWindow_acquire(void*) {}
          void ANativeWindow_release(void*) {}
          int32_t ANativeWindow_lock(void*, void*, void*) { return -1; }
          int32_t ANativeWindow_unlockAndPost(void*) { return 0; }
          }
          #endif

          extern "C" SDL_AppResult SDLCALL SDL_AppInit(void** appstate, int argc, char** argv);
          extern "C" SDL_AppResult SDLCALL SDL_AppIterate(void* appstate);
          extern "C" SDL_AppResult SDLCALL SDL_AppEvent(void* appstate, SDL_Event* event);
          extern "C" void SDLCALL SDL_AppQuit(void* appstate, SDL_AppResult result);

          int main(int argc, char** argv) {
              return SDL_EnterAppMainCallbacks(
                  argc,
                  argv,
                  SDL_AppInit,
                  SDL_AppIterate,
                  SDL_AppEvent,
                  SDL_AppQuit
              );
          }
          EOF

          python3 <<'PY'
          from pathlib import Path

          p = Path("src/yuzu_cmd/CMakeLists.txt")
          if p.exists():
              content = p.read_text()
              if "eden_bionic_entry.cpp" not in content:
                  content = content.replace("yuzu.cpp", "yuzu.cpp\n    eden_bionic_entry.cpp", 1)
              # 仅链接必要的系统基础日志库
              if "target_link_libraries(yuzu-cmd PRIVATE log)" not in content:
                  content += "\ntarget_link_libraries(yuzu-cmd PRIVATE log)\n"
              p.write_text(content)
          PY

      # ============================================================
      # 6. 配置 CMake
      # ============================================================
      - name: Configure CMake
        shell: bash
        run: |
          set -eux
          rm -rf build

          cmake -S . -B build \
            -GNinja \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_BIONIC_CLI=ON \
            -DENABLE_QT=OFF \
            -DENABLE_QT_TRANSLATION=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DSDL_AUDIO=OFF \
            -DSDL_OPENSLES=OFF \
            -DSDL_AAUDIO=OFF \
            -DENABLE_OPENGL=OFF \
            -DENABLE_CUBEB=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DENABLE_LIBUSB=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_DOWNLOAD_ANDROID_VVL=OFF \
            -DYUZU_DOWNLOAD_TIME_ZONE_DATA=ON \
            -DYUZU_LEGACY=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -llog" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_CXX_FLAGS="-fexperimental-library" \
            -DCMAKE_C_FLAGS="-fexperimental-library"

      # ============================================================
      # 7. 清洗 Ninja 构建图中的外部残留链接项
      # ============================================================
      - name: Strip Framework Libraries From Ninja Rules
        shell: bash
        run: |
          set -eux
          echo "=== 清除 build.ninja 中多余的框架库引用 ==="
          sed -i -E 's|[^ ]*libmediandk\.so||g' build/build.ninja
          sed -i -E 's|-lmediandk||g' build/build.ninja
          sed -i -E 's|-landroid||g' build/build.ninja
          sed -i -E 's|-lOpenSLES||g' build/build.ninja

      # ============================================================
      # 8. 编译目标
      # ============================================================
      - name: Build Eden CLI Target
        shell: bash
        run: |
          set -eux
          TARGET=""
          if ninja -C build -t targets all | grep -q 'bin/eden-cli:'; then
              TARGET="eden-cli"
          elif ninja -C build -t targets all | grep -q 'bin/yuzu-cmd:'; then
              TARGET="yuzu-cmd"
          elif ninja -C build -t targets all | grep -q 'eden-cli'; then
              TARGET="eden-cli"
          elif ninja -C build -t targets all | grep -q 'yuzu-cmd'; then
              TARGET="yuzu-cmd"
          fi

          if [ -n "$TARGET" ]; then
              ninja -C build -j"$(nproc)" "$TARGET"
          else
              ninja -C build -j"$(nproc)"
          fi

      # ============================================================
      # 9. 严格依赖断言 (确保 ELF 达到真正的裸机纯净态)
      # ============================================================
      - name: Verify Clean Bionic ELF
        shell: bash
        run: |
          set -eux
          BIN=$(find build/bin -maxdepth 1 -type f \( -name "eden-cli" -o -name "yuzu-cmd" \) | head -n 1)

          echo "============================================================"
          echo "最终 ELF 动态依赖项 (DT_NEEDED)"
          echo "============================================================"
          readelf -d "$BIN"

          # 熔断断言：绝对不能存在任何 Android Framework 库
          for BANNED in OpenSLES mediandk android.so gui.so binder.so; do
            if readelf -d "$BIN" | grep -i "$BANNED"; then
              echo "CRITICAL ERROR: Banned library $BANNED detected!"
              exit 1
            fi
          done

          echo "PASS: Binary is 100% PURE Native Bionic ELF!"

      # ============================================================
      # 10. 提取交付物并归档
      # ============================================================
      - name: Package Runtime Artifacts
        shell: bash
        run: |
          set -eux
          rm -rf output_bin && mkdir -p output_bin

          BIN=$(find build/bin -maxdepth 1 -type f \( -name "eden-cli" -o -name "yuzu-cmd" \) | head -n 1)
          cp "$BIN" output_bin/eden-cli
          cp "$BIN" output_bin/yuzu-cmd

          LIBCXX="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          cp "$LIBCXX" output_bin/libc++_shared.so

          tar -czf eden-bionic-arm64.tar.gz -C output_bin .

      # ============================================================
      # 11. 上传构建产物
      # ============================================================
      - name: Upload Eden Bionic ARM64
        uses: actions/upload-artifact@v4
        with:
          name: eden-bionic-arm64
          path: |
            output_bin/
            eden-bionic-arm64.tar.gz
          if-no-files-found: error
