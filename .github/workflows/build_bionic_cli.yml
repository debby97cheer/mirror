              )

          if "[BIONIC] Step 4:" not in text:
              text = text.replace(
                  "const Core::SystemResultStatus load_result = state->system.Load(",
                  'std::cout << "[BIONIC] Step 4: Loading ROM..." << std::endl;\n'
                  "    const Core::SystemResultStatus load_result = state->system.Load(",
                  1,
              )

          # --------------------------------------------------------
          # Native main
          # --------------------------------------------------------

          if "int main(int argc, char** argv)" not in text:

              native_main = r'''
