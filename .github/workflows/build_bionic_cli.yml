            -DYUZU_LEGACY=ON \
            -DYUZU_ENABLE_LTO=OFF \
            -DSDL_BIONIC_NO_ANDROID_VIDEO=ON \
            -DCMAKE_CXX_FLAGS="-fexperimental-library" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -Wl,--as-needed" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld -Wl,--as-needed"

      # ============================================================
      # 24. SDL Configure Result Audit
      #
      # 这里是本次最重要的检查。
      # ============================================================
      - name: Audit SDL3 Configure
        shell: bash
        run: |
          set -eux

          echo "============================================================"
          echo "SDL configure result"
          echo "============================================================"

          grep -R \
            -n \
            -E \
            "SDL_BIONIC_NO_ANDROID_VIDEO|SDL_VIDEO_DRIVER_ANDROID|android_video" \
            build/eden_sdl3 \
            2>/dev/null || true

          echo
          echo "============================================================"
          echo "Search generated files for Android video backend"
          echo "============================================================"

          if grep -R \
              -n \
              "src/video/android" \
              build/eden_sdl3 \
              2>/dev/null; then

            echo
            echo "ERROR: SDL Android Video backend entered generated build."
            exit 1
          fi

          echo "PASS: SDL Android Video source is absent."

          echo
          echo "============================================================"
          echo "Search generated files for -landroid"
          echo "============================================================"

          if grep -R \
              -n \
              -E \
              '(^|[[:space:]])-landroid([[:space:]]|$)|libandroid\.so' \
              build/eden_sdl3 \
              2>/dev/null; then

            echo
            echo "ERROR: SDL3 generated build still references libandroid.so."
            exit 1
          fi

          echo "PASS: no libandroid.so in SDL3 generated build."

      # ============================================================
      # 25. AdrenoTools / LinkerNSBypass dependency audit
      # ============================================================
      - name: Audit Android GPU Hook Dependencies
        shell: bash
        run: |
          set -eux

          echo "============================================================"
          echo "1. libadrenotools must NOT be configured"
          echo "============================================================"

          if grep -R \
              -n \
              --include='*.ninja' \
              --include='build.ninja' \
              "libadrenotools" \
              build \
              2>/dev/null; then

            echo
            echo "ERROR: libadrenotools is still present in generated build."
            exit 1
          fi

          echo "PASS: no libadrenotools."

          echo
          echo "============================================================"
          echo "2. linkernsbypass must NOT be configured"
          echo "============================================================"

          if grep -R \
              -n \
              --include='*.ninja' \
              --include='build.ninja' \
              "linkernsbypass" \
              build \
              2>/dev/null; then

            echo
            echo "ERROR: linkernsbypass is still present."
            exit 1
          fi

          echo "PASS: no linkernsbypass."

          echo
          echo "============================================================"
          echo "3. no -landroid"
          echo "============================================================"

          if grep -R \
              -n \
              -E \
              --include='*.ninja' \
              --include='build.ninja' \
              '(^|[[:space:]])-landroid([[:space:]]|$)|libandroid\.so' \
              build \
              2>/dev/null; then

            echo
            echo "ERROR: -landroid/libandroid.so is present."
            exit 1
          fi

          echo "PASS: no -landroid."

          echo
          echo "============================================================"
          echo "4. video_core must NOT reference adrenotools"
          echo "============================================================"

          if grep -R \
              -n \
              --include='*.ninja' \
              --include='build.ninja' \
              "adrenotools" \
              build/src/video_core \
              2>/dev/null; then

            echo
            echo "ERROR: video_core still references adrenotools."
            exit 1
          fi

          echo "PASS: video_core is clean."

          echo
          echo "============================================================"
          echo "Android GPU hook dependency audit PASSED"
          echo "============================================================"

      # ============================================================
      # 26. Generated Build Graph Audit
      #
      # 注意：
      # CMakeCache.txt 中出现 MEDIANDK_LIBRARY 并不代表最终链接。
      # 因此这里绝对不能直接 grep 整个 build/。
      #
      # 我们只检查：
      #   1. build.ninja
      #   2. *.ninja
      #   3. *.rsp
      #   4. SDL generated build
      #
      # 最终是否真正进入 ELF，则由后面的 readelf -d 再做一次最终确认。
      # ============================================================
      - name: Audit Generated Build Graph
        shell: bash
        run: |
          set -eux

          echo "============================================================"
          echo "1. No CPM SDL3 cache"
          echo "============================================================"

          if [ -d ".cache/cpm/sdl3" ] || \
             [ -d ".cache/cpm/sdl3-ci" ]; then

            echo "ERROR: CPM SDL3 detected."
            exit 1
          fi

          echo "PASS: No CPM SDL3 cache."

          echo
          echo "============================================================"
          echo "2. No OpenSLES in actual generated build rules"
          echo "============================================================"

          if grep -R \
              -n \
              -E \
              --include='build.ninja' \
              --include='*.ninja' \
              --include='*.rsp' \
              'OpenSLES|libOpenSLES\.so|SDL_openslES\.c\.o' \
              build \
              2>/dev/null; then

            echo
            echo "ERROR: OpenSLES entered generated linker/build rules."
            exit 1
          fi

          echo "PASS: No OpenSLES in actual build rules."

          echo
          echo "============================================================"
          echo "3. No forced JNI_OnLoad in actual generated build rules"
          echo "============================================================"

          if grep -R \
              -n \
              -E \
              --include='build.ninja' \
              --include='*.ninja' \
              --include='*.rsp' \
              -- \
              '-Wl,-u,JNI_OnLoad' \
              build \
              2>/dev/null; then

            echo
            echo "ERROR: Forced JNI_OnLoad remains."
            exit 1
          fi

          echo "PASS: No forced JNI_OnLoad."

          echo
          echo "============================================================"
          echo "4. No MediaNDK in actual generated build rules"
          echo "============================================================"

          if grep -R \
              -n \
              -E \
              --include='build.ninja' \
              --include='*.ninja' \
              --include='*.rsp' \
              '(^|[[:space:]])-lmediandk([[:space:]]|$)|libmediandk\.so' \
              build \
              2>/dev/null; then

            echo
            echo "ERROR: MediaNDK appears in actual generated build/link rules."
            exit 1
          fi

          echo "PASS: No MediaNDK in actual build rules."

          echo
          echo "============================================================"
          echo "5. No SDL Android Video backend"
          echo "============================================================"

          if grep -R \
              -n \
              --include='build.ninja' \
              --include='*.ninja' \
              --include='*.rsp' \
              'src/video/android' \
              build \
              2>/dev/null; then

            echo
            echo "ERROR: SDL Android Video backend detected."
            exit 1
          fi

          echo "PASS: No SDL Android Video backend."

          echo
          echo "============================================================"
          echo "6. No libandroid.so in actual generated build rules"
          echo "============================================================"

          if grep -R \
              -n \
              -E \
              --include='build.ninja' \
              --include='*.ninja' \
              --include='*.rsp' \
              '(^|[[:space:]])-landroid([[:space:]]|$)|libandroid\.so' \
              build \
              2>/dev/null; then

            echo
            echo "ERROR: libandroid.so entered actual generated link graph."
            exit 1
          fi

          echo "PASS: No libandroid.so in actual build rules."

          echo
          echo "============================================================"
          echo "7. Informational: CMake cache variables"
          echo "============================================================"

          if grep -n \
              -E \
              '^(MEDIANDK_LIBRARY|SDL3.*ANDROID|ANDROID.*LIBRARY)' \
              build/CMakeCache.txt \
              2>/dev/null; then

            echo
            echo "NOTE:"
            echo "These are CMake cache discovery variables only."
            echo "Their presence does NOT mean they are linked into eden-cli."
          fi

          echo
          echo "============================================================"
          echo "GENERATED BUILD GRAPH AUDIT PASSED"
          echo "============================================================"

      # ============================================================
      # 27. C++20 stop_token test
      # ============================================================
      - name: Verify CXX20 stop_token
        shell: bash
        run: |
          set -eux

          cat >/tmp/test_cpp20.cpp <<'EOF'
          #include <stop_token>
          #include <thread>

          int main() {
              std::stop_source source;
              std::stop_token token = source.get_token();
              std::stop_callback callback(token, []() {});
              (void)callback;
              return 0;
          }
          EOF

          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            --target=aarch64-none-linux-android34 \
            --sysroot="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
            -std=c++20 \
            -fexperimental-library \
            /tmp/test_cpp20.cpp \
            -o /tmp/test_cpp20

          file /tmp/test_cpp20

      # ============================================================
      # 28. Build
      # ============================================================
      - name: Build Eden CLI
        shell: bash
        run: |
          set -eux

          echo "============================================================"
          echo "Building eden-cli"
          echo "============================================================"

          ninja \
            -C build \
            -j"$(nproc)" \
            yuzu-cmd

      # ============================================================
      # 29. ELF Validation
      #
      # 最终真相：
      #   DT_NEEDED
      #
      # CMakeCache.txt 里的变量不作为依据。
      # ============================================================
      - name: Verify Pure Bionic ELF
        shell: bash
        run: |
          set -eux

          BIN="build/bin/eden-cli"

          test -f "$BIN"

          echo "============================================================"
          echo "ELF"
          echo "============================================================"

          file "$BIN"

          echo
          echo "============================================================"
          echo "1. Native main"
          echo "============================================================"

          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            -C \
            "$BIN" \
            | grep -E '(^| )main$'

          echo "PASS."

          echo
          echo "============================================================"
          echo "2. DT_NEEDED"
          echo "============================================================"

          readelf -d "$BIN"

          echo
          echo "============================================================"
          echo "3. Forbidden Android libraries"
          echo "============================================================"

          NEEDED="$(readelf -d "$BIN")"

          if printf '%s\n' "$NEEDED" | grep -Ei \
              'libandroid\.so|libOpenSLES\.so|libmediandk\.so|android_runtime|libgui\.so'; then

            echo
            echo "ERROR: Forbidden Android library exists in final ELF."
            exit 1
          fi

          echo "PASS: No forbidden Android libraries in DT_NEEDED."

          echo
          echo "============================================================"
          echo "4. Forbidden undefined symbols"
          echo "============================================================"

          if \
            "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
              -u \
              "$BIN" \
              | grep -Ei \
                'slCreateEngine|SL_IID_|JNI_OnLoad|JavaVM'; then

            echo
            echo "ERROR: Forbidden Android/JNI/OpenSLES symbol detected."
            exit 1
          fi

          echo "PASS."

          echo
          echo "============================================================"
          echo "5. SDL Android Video symbols"
          echo "============================================================"

          if \
            "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
              -C \
              "$BIN" \
              | grep -Ei \
                'SDL_Android|Android_CreateWindow|Android_Video'; then

            echo
            echo "ERROR: SDL Android Video symbols detected."
            exit 1
          fi

          echo "PASS."

          echo
          echo "============================================================"
          echo "PURE BIONIC ELF VALIDATION PASSED"
          echo "============================================================"

      # ============================================================
      # 30. Package
      # ============================================================
      - name: Package Eden Bionic ARM64
        shell: bash
        run: |
          set -eux

          rm -rf output_bin
          mkdir -p output_bin

          cp \
            build/bin/eden-cli \
            output_bin/eden-cli

          LIBCXX="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"

          test -f "$LIBCXX"

          cp \
            "$LIBCXX" \
            output_bin/libc++_shared.so

          file output_bin/*

          echo "============================================================"
          echo "Final package"
          echo "============================================================"

          ls -lh output_bin/

          tar \
            -czf \
            eden-bionic-arm64.tar.gz \
            -C output_bin \
            .

          ls -lh eden-bionic-arm64.tar.gz

      # ============================================================
      # 31. Upload
      # ============================================================
      - name: Upload Eden Bionic ARM64
        uses: actions/upload-artifact@v4
        with:
          name: eden-bionic-arm64
          path: eden-bionic-arm64.tar.gz
          if-no-files-found: error
