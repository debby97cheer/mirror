name: Build Eden Bionic Native CLI ARM64 - Pure Bionic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-eden-bionic-arm64:
    runs-on: ubuntu-latest

    env:
      SDL_VERSION: release-3.4.14
      SDL_SRC: ${{ github.workspace }}/_deps/SDL3
      SDL_BUILD: ${{ github.workspace }}/_deps/SDL3-build
      SDL_INSTALL: ${{ github.workspace }}/_deps/SDL3-install

    steps:
      # ============================================================
      # 1. Runner 清理
      # ============================================================
      - name: Free Disk Space
        shell: bash
        run: |
          set -eux

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true

          df -h

      # ============================================================
      # 2. Checkout Eden
      # ============================================================
      - name: Checkout Eden
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # 3. Host dependencies
      # ============================================================
      - name: Install Host Dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            ccache \
            glslang-tools \
            nasm \
            libtool \
            python3 \
            pkg-config \
            file

          cmake --version
          ninja --version
          python3 --version

      # ============================================================
      # 4. Android NDK r27c
      # ============================================================
      - name: Setup Android NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Export NDK Environment
        shell: bash
        run: |
          set -eux

          echo "NDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      # ============================================================
      # 5. 先独立构建 SDL3
      #
      # 不使用 Eden CPMUtil SDL3。
      # 不使用 Eden Android CI SDL3。
      # 不使用 .cache/cpm/sdl3。
      #
      # SDL_AUDIO=OFF => SDL OpenSLES backend 不参与构建。
      # ============================================================
      - name: Build Clean SDL3 For Bionic
        shell: bash
        run: |
          set -eux

          rm -rf _deps
          mkdir -p _deps

          git clone \
            --depth 1 \
            --branch "$SDL_VERSION" \
            https://github.com/libsdl-org/SDL.git \
            "$SDL_SRC"

          rm -rf "$SDL_BUILD" "$SDL_INSTALL"

          cmake \
            -S "$SDL_SRC" \
            -B "$SDL_BUILD" \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DCMAKE_INSTALL_PREFIX="$SDL_INSTALL" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF \
            -DSDL_INSTALL_DOCS=OFF \
            -DSDL_INSTALL_TESTS=OFF \
            -DSDL_DISABLE_INSTALL_DOCS=ON \
            -DSDL_AUDIO=OFF \
            -DSDL_VIDEO=ON \
            -DSDL_JOYSTICK=OFF \
            -DSDL_HAPTIC=OFF \
            -DSDL_HIDAPI=OFF \
            -DSDL_SENSOR=OFF \
            -DSDL_CAMERA=OFF \
            -DSDL_POWER=OFF \
            -DSDL_DIALOG=OFF \
            -DSDL_TRAY=OFF \
            -DSDL_NOTIFICATION=OFF \
            -DSDL_OPENGL=OFF \
            -DSDL_OPENGLES=OFF \
            -DSDL_DUMMYVIDEO=ON \
            -DSDL_VULKAN=ON \
            -DSDL_OFFSCREEN=OFF

          cmake --build "$SDL_BUILD" \
            --parallel "$(nproc)"

          cmake --install "$SDL_BUILD"

          test -f "$SDL_INSTALL/lib/libSDL3.a"

          test -f "$SDL_INSTALL/include/SDL3/SDL.h"

          echo "============================================================"
          echo "SDL3 ARCHIVE"
          echo "============================================================"

          file "$SDL_INSTALL/lib/libSDL3.a"

          echo "============================================================"
          echo "SDL3 ARCHIVE OBJECT CHECK"
          echo "============================================================"

          if ar t "$SDL_INSTALL/lib/libSDL3.a" \
              | grep -Ei 'opensles|opensl|SDL_openslES'
          then
            echo "ERROR: OpenSLES object was compiled into SDL3."
            exit 1
          fi

          echo "PASS: SDL3 archive contains no OpenSLES object."

          echo "============================================================"
          echo "SDL3 DIRECTORY"
          echo "============================================================"

          find "$SDL_INSTALL" \
            -maxdepth 3 \
            -type f \
            -print

      # ============================================================
      # 6. Eden 源码架构补丁
      #
      # 绝不：
      # - fake OpenSLES
      # - fake ANativeWindow
      # - fake Sensor
      # - fake JNI
      # - fake MediaNDK
      # - 修改 build.ninja
      #
      # 所有 Android 依赖必须从源码/CMake target 层移除。
      # ============================================================
      - name: Patch Eden Pure Bionic Architecture
        shell: bash
        run: |
          set -eux

          echo "============================================================"
          echo "Patch Eden for pure Bionic CLI"
          echo "============================================================"

          # --------------------------------------------------------
          # 6.1 根 CMake：开启 YUZU_CMD + Bionic 宏
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("CMakeLists.txt")
          s = p.read_text()

          s, n = re.subn(
              r'cmake_dependent_option\s*\(\s*'
              r'YUZU_CMD\s+'
              r'"[^"]*"\s+'
              r'[^)]*?'
              r'"NOT ANDROID"\s+'
              r'OFF\s*\)',
              'option(YUZU_CMD "Compile the eden-cli executable" ON)',
              s,
              count=1,
              flags=re.MULTILINE,
          )

          if n:
              print("YUZU_CMD restriction removed.")
          elif 'option(YUZU_CMD "Compile the eden-cli executable" ON)' in s:
              print("YUZU_CMD already enabled.")
          else:
              raise SystemExit("ERROR: YUZU_CMD declaration not found.")

          marker = 'option(YUZU_CMD "Compile the eden-cli executable" ON)'

          if "YUZU_BIONIC_CLI" not in s:
              block = (
                  marker + "\n"
                  'option(YUZU_BIONIC_CLI "Pure Android Bionic native CLI" OFF)\n'
                  "if (YUZU_BIONIC_CLI)\n"
                  "    add_compile_definitions(YUZU_BIONIC_CLI)\n"
                  "endif()\n"
              )
              s = s.replace(marker, block, 1)

          p.write_text(s)
          PY

          # --------------------------------------------------------
          # 6.2 禁止 yuzu-android JNI target
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("src/CMakeLists.txt")
          s = p.read_text()

          pattern = re.compile(
              r'if\s*\(\s*ANDROID\s*\)\s*'
              r'add_subdirectory\(\s*android/app/src/main/jni\s*\)\s*'
              r'target_include_directories\(\s*yuzu-android\s+PRIVATE\s+android/app/src/main\s*\)\s*'
              r'endif\s*\(\s*\)',
              re.MULTILINE,
          )

          repl = (
              "if (ANDROID AND NOT YUZU_BIONIC_CLI)\n"
              "    add_subdirectory(android/app/src/main/jni)\n"
              "    target_include_directories(yuzu-android PRIVATE android/app/src/main)\n"
              "endif()"
          )

          if pattern.search(s):
              s = pattern.sub(repl, s, count=1)
              print("yuzu-android JNI target disabled.")
          else:
              print("yuzu-android JNI block not found; continuing.")

          p.write_text(s)
          PY

          # --------------------------------------------------------
          # 6.3 禁止 Android Framework 源码进入 native targets
          #
          # 只从 CMake source lists 移除：
          # - common/android/*
          # - fs_android.cpp
          #
          # android_settings.cpp 单独保留。
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path

          removed = []

          for p in Path("src").rglob("CMakeLists.txt"):
              lines = p.read_text().splitlines(keepends=True)
              out = []

              changed = False

              for line in lines:
                  stripped = line.strip()

                  if "android_settings.cpp" in stripped:
                      out.append(line)
                      continue

                  bad = (
                      "common/android/" in stripped
                      or "../common/android/" in stripped
                      or "fs_android.cpp" in stripped
                      or "../common/fs/fs_android.cpp" in stripped
                  )

                  if bad:
                      removed.append(f"{p}: {stripped}")
                      changed = True
                      continue

                  out.append(line)

              if changed:
                  p.write_text("".join(out))

          print("Removed Android-specific source entries:")
          for x in removed:
              print("  " + x)

          print(f"Total removed source entries: {len(removed)}")
          PY

          # --------------------------------------------------------
          # 6.4 从所有 CMake target link dependencies 中删除：
          # - mediandk
          # - OpenSLES
          # - Android framework library
          #
          # 只修改 target_link_libraries(...) 内容。
          # 不碰 build.ninja。
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          removed = []

          token_pattern = re.compile(
              r'\b(?:mediandk|OpenSLES|android)\b'
          )

          tl_pattern = re.compile(
              r'target_link_libraries\s*\((.*?)\)',
              re.DOTALL
          )

          for p in Path(".").rglob("CMakeLists.txt"):
              if ".git" in p.parts or "build" in p.parts:
                  continue

              text = p.read_text()

              def repl(match):
                  body = match.group(1)
                  if not token_pattern.search(body):
                      return match.group(0)

                  original = body

                  body = token_pattern.sub("", body)

                  lines = []
                  for line in body.splitlines():
                      if line.strip():
                          lines.append(line.rstrip())

                  body = "\n".join(lines)

                  removed.append(
                      f"{p}: {original.strip()} -> {body.strip()}"
                  )

                  return "target_link_libraries(" + body + ")"

              text2 = tl_pattern.sub(repl, text)

              if text2 != text:
                  p.write_text(text2)

          print("Removed Android framework link tokens:")
          for x in removed:
              print("  " + x)

          print(f"Total modified target_link_libraries blocks: {len(removed)}")
          PY

          # --------------------------------------------------------
          # 6.5 保证 core 不再主动链接 mediandk
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("src/core/CMakeLists.txt"),
              Path("src/common/CMakeLists.txt"),
          ]

          for p in candidates:
              if not p.exists():
                  continue

              s = p.read_text()

              s = re.sub(
                  r'(?m)^[ \t]*.*\bmediandk\b.*\n?',
                  "",
                  s,
              )

              s = re.sub(
                  r'(?m)^[ \t]*.*\btarget_link_libraries\b.*\bandroid\b.*\n?',
                  "",
                  s,
              )

              p.write_text(s)
              print(f"Checked Android framework links in {p}")
          PY

          # --------------------------------------------------------
          # 6.6 AudioCore：Bionic 下禁止 SDL sink
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          for p in Path("src/audio_core").rglob("CMakeLists.txt"):
              s = p.read_text()

              s = re.sub(
                  r'if\s*\(\s*YUZU_USE_BUNDLED_SDL3\s+OR\s+SDL3_FOUND\s*\)',
                  'if ((YUZU_USE_BUNDLED_SDL3 OR SDL3_FOUND) AND NOT YUZU_BIONIC_CLI)',
                  s,
                  flags=re.MULTILINE,
              )

              # 如果 source list 中直接存在 sdl_sink.cpp，也删除。
              lines = []
              for line in s.splitlines(keepends=True):
                  if "sdl_sink.cpp" in line:
                      continue
                  lines.append(line)

              p.write_text("".join(lines))

              print(f"SDL Audio sink disabled in {p}")

          sink = Path("src/audio_core/sink/sink_details.cpp")

          if sink.exists():
              s = sink.read_text()

              s = re.sub(
                  r'#if\s+defined\(HAVE_SDL3\)\s*\|\|\s*'
                  r'defined\(YUZU_USE_BUNDLED_SDL3\)',
                  '#if !defined(YUZU_BIONIC_CLI) && '
                  '(defined(HAVE_SDL3) || defined(YUZU_USE_BUNDLED_SDL3))',
                  s,
              )

              sink.write_text(s)
              print("SDL sink runtime branch guarded.")
          PY

          # --------------------------------------------------------
          # 6.7 Input：不要实例化 Android input engine / vibration
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          for p in [
              Path("src/input_common/main.cpp"),
              Path("src/input_common/main.h"),
          ]:
              if not p.exists():
                  continue

              s = p.read_text()

              s = re.sub(
                  r'#ifdef\s+__ANDROID__',
                  '#if defined(__ANDROID__) && !defined(YUZU_BIONIC_CLI)',
                  s,
              )

              s = re.sub(
                  r'#if\s+defined\(__ANDROID__\)',
                  '#if defined(__ANDROID__) && !defined(YUZU_BIONIC_CLI)',
                  s,
              )

              p.write_text(s)

              print(f"Android input guards patched: {p}")
          PY

          # --------------------------------------------------------
          # 6.8 PowerState：Bionic 走 generic no-battery fallback
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("src/common/device_power_state.cpp")

          if p.exists():
              s = p.read_text()

              s = re.sub(
                  r'#elif\s+defined\(__ANDROID__\)',
                  '#elif defined(__ANDROID__) && !defined(YUZU_BIONIC_CLI)',
                  s,
              )

              p.write_text(s)

          print("device_power_state.cpp patched.")
          PY

          # --------------------------------------------------------
          # 6.9 EmuWindow_SDL3：
          #
          # Bionic Null Renderer 下：
          # - 不创建 SDL Window
          # - 不创建 ANativeWindow
          # - 不碰 SurfaceFlinger
          #
          # 但保留完整 C++ 生命周期接口。
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("src/yuzu_cmd/emu_window/emu_window_sdl3.cpp")
          s = p.read_text()

          if "#include <iostream>" not in s:
              s = "#include <iostream>\n" + s

          init_pat = re.compile(
              r'(input_subsystem->Initialize\(\)\s*;\s*\n)'
          )

          injection = (
              r'\1'
              '#ifdef YUZU_BIONIC_CLI\n'
              '    std::cout << "[BIONIC] EmuWindow_SDL3: headless mode"'
              ' << std::endl;\n'
              '    is_open = true;\n'
              '    render_window = nullptr;\n'
              '    return;\n'
              '#endif\n'
          )

          if "#ifdef YUZU_BIONIC_CLI" not in s:
              if not init_pat.search(s):
                  raise SystemExit(
                      "ERROR: input_subsystem->Initialize() not found."
                  )
              s = init_pat.sub(injection, s, count=1)

          # 只在 render_window 为空时提前结束析构。
          # 不删除原有 C++ interface。
          dtor_pat = re.compile(
              r'EmuWindow_SDL3::~EmuWindow_SDL3\(\)\s*\{'
          )

          if "if (!render_window) return;" not in s:
              if not dtor_pat.search(s):
                  raise SystemExit(
                      "ERROR: EmuWindow_SDL3 destructor not found."
                  )

              s = dtor_pat.sub(
                  "EmuWindow_SDL3::~EmuWindow_SDL3() {\n"
                  "#ifdef YUZU_BIONIC_CLI\n"
                  "    if (!render_window) {\n"
                  "        return;\n"
                  "    }\n"
                  "#endif",
                  s,
                  count=1,
              )

          p.write_text(s)

          print("EmuWindow_SDL3 patched.")
          PY

          # --------------------------------------------------------
          # 6.10 Null Window：
          #
          # 不调用 SDL_HideWindow。
          # 保留 CreateSharedContext()。
          # 使用 Eden 原有 DummyContext。
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path

          p = Path("src/yuzu_cmd/emu_window/emu_window_sdl3_null.cpp")

          content = r'''// SPDX-FileCopyrightText: 2026 Eden Emulator Project
          // SPDX-License-Identifier: GPL-3.0-or-later

          #include <iostream>
          #include <memory>

          #include "yuzu_cmd/emu_window/emu_window_sdl3_null.h"

          EmuWindow_SDL3_Null::EmuWindow_SDL3_Null(
              InputCommon::InputSubsystem* input_subsystem,
              Core::System& system,
              bool fullscreen)
              : EmuWindow_SDL3{input_subsystem, system} {
              (void)fullscreen;

              is_open = true;

              std::cout
                  << "[BIONIC] EmuWindow_SDL3_Null: initialized"
                  << std::endl;
          }

          EmuWindow_SDL3_Null::~EmuWindow_SDL3_Null() = default;

          std::unique_ptr<Core::Frontend::GraphicsContext>
          EmuWindow_SDL3_Null::CreateSharedContext() const {
              return std::make_unique<DummyContext>();
          }
          '''

          p.write_text(content)
          print("emu_window_sdl3_null.cpp replaced with interface-complete implementation.")
          PY

          # --------------------------------------------------------
          # 6.11 yuzu_cmd CMake：
          #
          # 不链接 Eden Android SDL package。
          # 直接链接我们自己构建的 SDL3 static archive。
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("src/yuzu_cmd/CMakeLists.txt")
          s = p.read_text()

          # 添加 android_settings.cpp，只保留纯 C++ settings object。
          if "android_settings.cpp" not in s:
              marker = "add_executable(yuzu-cmd\n"

              if marker in s:
                  s = s.replace(
                      marker,
                      marker
                      + "    ../android/app/src/main/jni/android_settings.cpp\n",
                      1,
                  )

          # 替换 SDL3 target link。
          pattern = re.compile(
              r'target_link_libraries\s*\(\s*yuzu-cmd\s+PRIVATE\s+SDL3::SDL3\s*\)'
          )

          replacement = """if (YUZU_BIONIC_CLI)
              target_include_directories(yuzu-cmd PRIVATE
                  "${EDEN_BIONIC_SDL3_INCLUDE}"
              )
              target_link_libraries(yuzu-cmd PRIVATE
                  "${EDEN_BIONIC_SDL3_LIB}"
                  dl
              )
          else()
              target_link_libraries(yuzu-cmd PRIVATE SDL3::SDL3)
          endif()"""

          if pattern.search(s):
              s = pattern.sub(replacement, s, count=1)
          elif "EDEN_BIONIC_SDL3_LIB" not in s:
              raise SystemExit(
                  "ERROR: yuzu-cmd SDL3 link target not found."
              )

          # 确保不会再从 yuzu-cmd source list 加入 common/android。
          out = []
          for line in s.splitlines(keepends=True):
              if "common/android/" in line:
                  continue
              if "fs_android.cpp" in line:
                  continue
              out.append(line)

          s = "".join(out)

          p.write_text(s)

          print("yuzu-cmd CMake patched.")
          PY

          # --------------------------------------------------------
          # 6.12 禁止 externals 在 Bionic 下再引入 SDL3 package
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("externals/CMakeLists.txt")
          s = p.read_text()

          # current Eden externals SDL block is guarded by:
          # if (NOT ANDROID)
          #
          # In Bionic CLI we explicitly keep this block disabled.
          #
          # This prevents:
          # - sdl3-ci
          # - Android prebuilt SDL3
          # - .cache/cpm/sdl3/*
          #
          pattern = re.compile(
              r'if\s*\(\s*NOT\s+ANDROID\s*\)',
              re.MULTILINE
          )

          match = pattern.search(s)

          if match:
              before = s[:match.start()]
              after = s[match.end():]

              # 只修改靠近 SDL3 block 的那个 NOT ANDROID。
              if "sdl3" in after[:5000]:
                  s = (
                      before
                      + "if (NOT ANDROID AND NOT YUZU_BIONIC_CLI)\n"
                      + after
                  )
                  print("SDL external package block disabled for Bionic.")
              else:
                  print("Could not positively identify SDL external block.")
          else:
              print("No top-level NOT ANDROID SDL guard found.")

          p.write_text(s)
          PY

          # --------------------------------------------------------
          # 6.13 yuzu.cpp：
          # Native main 不再模拟完整 SDL callback loop。
          #
          # Null Renderer 第一阶段只需要：
          # SDL_AppInit
          # -> System.Initialize
          # -> Load
          # -> System.Run
          # -> SDL_AppQuit
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("src/yuzu_cmd/yuzu.cpp")
          s = p.read_text()

          if "#include <cstring>" not in s:
              s = s.replace(
                  "#include <string>",
                  "#include <string>\n#include <cstring>",
                  1,
              )

          if "#include <unistd.h>" not in s:
              s = s.replace(
                  "#include <getopt.h>",
                  "#include <getopt.h>\n"
                  "#ifndef _WIN32\n"
                  "#include <unistd.h>\n"
                  "#endif",
                  1,
              )

          # SDL main macro.
          sdl_main_pattern = re.compile(
              r'#define\s+SDL_MAIN_USE_CALLBACKS\s+1.*?\n'
              r'\s*#include\s+<SDL3/SDL_main\.h>',
              re.MULTILINE,
          )

          sdl_main_replacement = (
              "#ifdef YUZU_BIONIC_CLI\n"
              "#define SDL_MAIN_HANDLED 1\n"
              "#else\n"
              "#define SDL_MAIN_USE_CALLBACKS 1\n"
              "#endif\n"
              "#include <SDL3/SDL_main.h>"
          )

          if sdl_main_pattern.search(s):
              s = sdl_main_pattern.sub(
                  sdl_main_replacement,
                  s,
                  count=1,
              )

          # Correct getopt string.
          new_optstring = "g:fhvnc:m:p::u:d:i:sx:"

          s, count = re.subn(
              r'getopt_long\s*\(\s*argc\s*,\s*argv\s*,\s*"[^"]*"',
              f'getopt_long(argc, argv, "{new_optstring}"',
              s,
              count=1,
          )

          if count == 0:
              raise SystemExit("ERROR: getopt_long() not found.")

          s = s.replace(
              '{"input-profile", no_argument, 0, \'i\'},',
              '{"input-profile", required_argument, 0, \'i\'},'
          )

          s = s.replace(
              '{"filter", no_argument, 0, \'x\'},',
              '{"filter", required_argument, 0, \'x\'},'
          )

          # Telemetry, but do not alter core lifecycle semantics.
          if "[BIONIC] Step 1" not in s:
              s = s.replace(
                  "state->system.Initialize();",
                  'std::cout << "[BIONIC] Step 1: System Initialize"'
                  ' << std::endl;\n'
                  "    state->system.Initialize();\n"
                  '    std::cout << "[BIONIC] Step 2: System Initialized"'
                  ' << std::endl;',
                  1,
              )

          if "[BIONIC] Step 3" not in s:
              s = s.replace(
                  "state->system.ApplySettings();",
                  'std::cout << "[BIONIC] Step 3: Apply Settings"'
                  ' << std::endl;\n'
                  "    state->system.ApplySettings();\n"
                  '    std::cout << "[BIONIC] Step 4: Settings Applied"'
                  ' << std::endl;',
                  1,
              )

          if "Ready to Load ROM" not in s:
              s = s.replace(
                  "const Core::SystemResultStatus load_result = "
                  "state->system.Load(*state->emu_window, filepath, load_parameters);",
                  'std::cout << "[BIONIC] Step 6: Loading ROM: "'
                  '<< filepath << std::endl;\n'
                  "    const Core::SystemResultStatus load_result = "
                  "state->system.Load(*state->emu_window, filepath, load_parameters);\n"
                  '    std::cout << "[BIONIC] Step 7: ROM load finished: "'
                  '<< static_cast<int>(load_result) << std::endl;',
                  1,
              )

          # Add native main exactly once.
          if "int main(int argc, char** argv)" not in s:
              s += r'''


          #ifdef YUZU_BIONIC_CLI

          int main(int argc, char** argv) {
              setvbuf(stdout, nullptr, _IONBF, 0);
              setvbuf(stderr, nullptr, _IONBF, 0);

              if (chdir("/data/eden") != 0) {
                  std::cerr
                      << "Warning: unable to chdir to /data/eden"
                      << std::endl;
              }

              SDL_SetMainReady();

              void* appstate = nullptr;

              SDL_AppResult result =
                  SDL_AppInit(&appstate, argc, argv);

              if (appstate != nullptr) {
                  SDL_AppQuit(appstate, result);
              }

              return result == SDL_APP_SUCCESS ? 0 : 1;
          }

          #endif
          '''

          p.write_text(s)

          print("yuzu.cpp patched with native Bionic main.")
          PY

          # --------------------------------------------------------
          # 6.14 C++20
          # --------------------------------------------------------
          for f in \
            src/common/thread_worker.h \
            src/common/polyfill_thread.h \
            src/common/thread.h
          do
            if [ -f "$f" ] && \
               ! grep -q '#include <stop_token>' "$f"
            then
              sed -i '1i#include <stop_token>' "$f"
            fi
          done

      # ============================================================
      # 7. Patch result audit
      # ============================================================
      - name: Audit Source For Android Runtime Dependencies
        shell: bash
        run: |
          set -eux

          echo "============================================================"
          echo "Forbidden source/link references"
          echo "============================================================"

          if grep -RniE \
              'slCreateEngine|SL_IID_|ANativeWindow_|ASensorManager_|AAssetManager_|JavaVM|JNIEnv|JNI_OnLoad' \
              src/yuzu_cmd \
              src/common \
              src/input_common \
              src/frontend_common \
              src/audio_core \
              2>/dev/null
          then
            echo "WARNING: Android runtime API references still exist in source tree."
            echo "They must not be part of the Bionic yuzu-cmd target."
          else
            echo "PASS: No prohibited Android API symbols in inspected native source."
          fi

          echo "============================================================"
          echo "CMake mediandk/android/OpenSLES references"
          echo "============================================================"

          grep -RniE \
            'mediandk|OpenSLES|target_link_libraries.*\bandroid\b' \
            src \
            externals \
            CMakeLists.txt \
            2>/dev/null \
            || true

      # ============================================================
      # 8. Configure Eden
      # ============================================================
      - name: Configure Eden Bionic
        shell: bash
        run: |
          set -eux

          rm -rf build

          cmake -S . -B build \
            -GNinja \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DYUZU_CMD=ON \
            -DYUZU_BIONIC_CLI=ON \
            -DEDEN_BIONIC_SDL3_LIB="$SDL_INSTALL/lib/libSDL3.a" \
            -DEDEN_BIONIC_SDL3_INCLUDE="$SDL_INSTALL/include" \
            -DENABLE_QT=OFF \
            -DENABLE_QT_TRANSLATION=OFF \
            -DENABLE_CUBEB=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DENABLE_COMPATIBILITY_LIST_DOWNLOAD=OFF \
            -DENABLE_LIBUSB=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_DOWNLOAD_ANDROID_VVL=OFF \
            -DYUZU_DOWNLOAD_TIME_ZONE_DATA=ON \
            -DYUZU_LEGACY=ON \
            -DYUZU_ENABLE_LTO=OFF \
            -DCMAKE_CXX_FLAGS="-fexperimental-library -DYUZU_BIONIC_CLI" \
            -DCMAKE_C_FLAGS="-DYUZU_BIONIC_CLI" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -Wl,--as-needed" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld -Wl,--as-needed"

      # ============================================================
      # 9. Configure audit：确认 SDL 不是 CPM Android package
      # ============================================================
      - name: Audit Generated Link Configuration
        shell: bash
        run: |
          set -eux

          SDL_REAL="$SDL_INSTALL/lib/libSDL3.a"

          test -f "$SDL_REAL"

          echo "============================================================"
          echo "Expected SDL3"
          echo "============================================================"

          echo "$SDL_REAL"

          echo "============================================================"
          echo "Generated build references"
          echo "============================================================"

          if grep -Rni \
              '.cache/cpm/sdl3' \
              build
          then
            echo "ERROR: Eden still references CPM SDL3."
            exit 1
          fi

          if grep -RniE \
              'sdl3.*android-aarch64|android-aarch64.*sdl3' \
              build
          then
            echo "ERROR: Android prebuilt SDL3 still present."
            exit 1
          fi

          echo "PASS: No Eden CPM Android SDL3 reference."

          echo "============================================================"
          echo "Generated forbidden link references"
          echo "============================================================"

          if grep -RniE \
              'libmediandk\.so|-lmediandk|-lOpenSLES|-landroid|libOpenSLES\.so' \
              build
          then
            echo "ERROR: Forbidden Android library remains in generated build."
            exit 1
          fi

          echo "PASS: No generated mediandk/OpenSLES/android link flags."

      # ============================================================
      # 10. C++20 stop_token
      # ============================================================
      - name: Verify CXX20 stop_token
        shell: bash
        run: |
          set -eux

          cat > /tmp/test_cpp20.cpp <<'EOF'
          #include <stop_token>
          #include <thread>

          int main() {
              std::stop_source source;
              std::stop_token token = source.get_token();
              std::stop_callback callback(token, []() {});
              (void)callback;
              return 0;
          }
          EOF

          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            --target=aarch64-none-linux-android34 \
            --sysroot="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
            -std=c++20 \
            -fexperimental-library \
            /tmp/test_cpp20.cpp \
            -o /tmp/test_cpp20

          file /tmp/test_cpp20

      # ============================================================
      # 11. 构建
      # ============================================================
      - name: Build Eden CLI
        shell: bash
        run: |
          set -eux

          ninja -C build -j"$(nproc)" eden-cli

      # ============================================================
      # 12. 构建后检查：完整 linker command
      # ============================================================
      - name: Audit Final Link Command
        shell: bash
        run: |
          set -eux

          echo "============================================================"
          echo "FINAL LINK COMMAND CHECK"
          echo "============================================================"

          LINK_FILE="build/src/yuzu_cmd/CMakeFiles/yuzu-cmd.dir/link.txt"

          if [ -f "$LINK_FILE" ]; then
            cat "$LINK_FILE"
          else
            echo "link.txt not generated; scanning Ninja rules."
            grep -RniE \
              'eden-cli.*clang\+\+|libSDL3\.a|mediandk|OpenSLES|-landroid' \
              build \
              || true
          fi

          echo "============================================================"
          echo "Forbidden final-link dependencies"
          echo "============================================================"

          if grep -RniE \
              'libmediandk\.so|-lmediandk|-lOpenSLES|-landroid|libOpenSLES\.so|android-aarch64.*libSDL3\.a' \
              build/src/yuzu_cmd \
              build.ninja \
              2>/dev/null
          then
            echo "ERROR: forbidden Android framework dependency reached final link."
            exit 1
          fi

          echo "PASS: final link graph contains no Android framework library."

      # ============================================================
      # 13. ELF 校验
      # ============================================================
      - name: Verify Pure Bionic ELF
        shell: bash
        run: |
          set -eux

          BIN="build/bin/eden-cli"

          test -f "$BIN"

          echo "============================================================"
          echo "FILE"
          echo "============================================================"

          file "$BIN"

          echo "============================================================"
          echo "ELF HEADER"
          echo "============================================================"

          readelf -h "$BIN"

          echo "============================================================"
          echo "MAIN SYMBOL"
          echo "============================================================"

          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            -C "$BIN" \
            | grep -E '(^| )main$'

          echo "============================================================"
          echo "DT_NEEDED"
          echo "============================================================"

          readelf -d "$BIN"

          echo "============================================================"
          echo "FORBIDDEN DT_NEEDED"
          echo "============================================================"

          if readelf -d "$BIN" \
              | grep -Ei \
                'OpenSLES|mediandk|android\.so|gui\.so'
          then
            echo "ERROR: forbidden Android runtime library in DT_NEEDED."
            exit 1
          fi

          echo "============================================================"
          echo "FORBIDDEN SYMBOLS"
          echo "============================================================"

          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            -C \
            "$BIN" \
            | grep -Ei \
              'slCreateEngine|SL_IID_|ANativeWindow_|ASensorManager_|AAssetManager_|JNI_OnLoad|JavaVM' \
            && {
              echo "ERROR: prohibited Android runtime symbol found."
              exit 1
            } || true

          echo "PASS: no prohibited Android runtime symbols detected."

      # ============================================================
      # 14. 准备 Runtime Package
      # ============================================================
      - name: Prepare Runtime Package
        shell: bash
        run: |
          set -eux

          rm -rf output_bin
          mkdir -p output_bin

          cp build/bin/eden-cli \
            output_bin/eden-cli

          LIBCXX="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"

          test -f "$LIBCXX"

          cp "$LIBCXX" \
            output_bin/libc++_shared.so

          ls -lah output_bin
          file output_bin/*

      # ============================================================
      # 15. Package
      # ============================================================
      - name: Package Eden Bionic ARM64
        shell: bash
        run: |
          set -eux

          tar -czf \
            eden-bionic-arm64.tar.gz \
            -C output_bin .

          ls -lh eden-bionic-arm64.tar.gz

      # ============================================================
      # 16. Upload
      # ============================================================
      - name: Upload Eden Bionic ARM64
        uses: actions/upload-artifact@v4
        with:
          name: eden-bionic-arm64
          path: |
            output_bin/
            eden-bionic-arm64.tar.gz
          if-no-files-found: error
