name: Build Eden Bionic Native CLI ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-eden-bionic-arm64:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. 清理 GitHub Runner
      # ============================================================
      - name: Free Disk Space
        shell: bash
        run: |
          set -eux

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf "/usr/local/share/boost" || true

          df -h

      # ============================================================
      # 2. 拉取 Eden
      # ============================================================
      - name: Checkout Eden Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # 3. Host 工具
      # ============================================================
      - name: Install Host Dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            ccache \
            glslang-tools \
            nasm \
            libtool \
            python3 \
            pkg-config

          echo
          echo "=== Tool versions ==="

          cmake --version
          ninja --version
          python3 --version

      # ============================================================
      # 4. Android NDK
      # ============================================================
      - name: Setup Android NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      # ============================================================
      # 5. 为 Bionic Native CLI 修改构建图
      #
      # 核心原则：
      #
      # 1. yuzu_cmd 在 Android 下强制允许
      # 2. yuzu-android JNI 完全关闭
      # 3. 不修改官方 yuzu.cpp
      # 4. 添加独立 Bionic ELF main wrapper
      # ============================================================
      - name: Patch CMake For Bionic Native CLI
        shell: bash
        run: |
          set -eux

          echo "============================================================"
          echo "Patch Eden for ARM64 Android/Bionic native CLI"
          echo "============================================================"

          # --------------------------------------------------------
          # 5.1 修改 YUZU_CMD 的 Android 限制
          #
          # 官方：
          # cmake_dependent_option(... "NOT ANDROID" OFF)
          #
          # 我们改成普通 option。
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("CMakeLists.txt")
          text = path.read_text()

          # 找到 YUZU_CMD 的 dependent option
          pattern = re.compile(
              r'cmake_dependent_option\(\s*'
              r'YUZU_CMD\s+'
              r'"[^"]*"\s+'
              r'[^\)]*?'
              r'"NOT ANDROID"\s+'
              r'OFF\s*\)',
              re.MULTILINE
          )

          match = pattern.search(text)

          if match:
              old = match.group(0)

              new = (
                  'option(YUZU_CMD '
                  '"Compile the eden-cli executable" ON)'
              )

              text = text[:match.start()] + new + text[match.end():]

              print("=== Replaced YUZU_CMD option ===")
              print(old)
              print("---->")
              print(new)

          elif 'option(YUZU_CMD "Compile the eden-cli executable" ON)' in text:
              print("YUZU_CMD already patched.")

          else:
              raise SystemExit(
                  "ERROR: Could not find YUZU_CMD configuration "
                  "in top-level CMakeLists.txt"
              )

          path.write_text(text)
          PY

          # --------------------------------------------------------
          # 5.2 构造独立开关，屏蔽 Android JNI target
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/CMakeLists.txt")
          text = path.read_text()

          marker = (
              'if (ANDROID)\n'
              '    add_subdirectory(android/app/src/main/jni)\n'
              '    target_include_directories(yuzu-android PRIVATE android/app/src/main)\n'
              'endif()'
          )

          replacement = (
              'if (ANDROID AND NOT YUZU_BIONIC_CLI)\n'
              '    add_subdirectory(android/app/src/main/jni)\n'
              '    target_include_directories(yuzu-android PRIVATE android/app/src/main)\n'
              'endif()'
          )

          if marker in text:
              text = text.replace(marker, replacement, 1)
              print("=== Android JNI target disabled for Bionic CLI ===")
          elif replacement in text:
              print("Android JNI guard already patched.")
          else:
              raise SystemExit(
                  "ERROR: Could not find Android JNI block in src/CMakeLists.txt"
              )

          path.write_text(text)
          PY

          # --------------------------------------------------------
          # 5.3 创建 Bionic ELF 主入口 wrapper
          #
          # Eden 当前 yuzu.cpp 使用：
          #
          # SDL_MAIN_USE_CALLBACKS
          # SDL_AppInit
          # SDL_AppIterate
          # SDL_AppEvent
          # SDL_AppQuit
          #
          # Android/Bionic 最终链接器仍需要真实 main，
          # 所以单独提供 wrapper。
          # --------------------------------------------------------
          cat > src/yuzu_cmd/eden_bionic_entry.cpp <<'EOF'
          // SPDX-License-Identifier: GPL-3.0-or-later
          //
          // Eden ARM64 Android/Bionic native CLI entry point.
          //
          // Eden's yuzu_cmd uses SDL3's callback-based application model.
          // This wrapper supplies the native ELF main entry required by the
          // Android/Bionic executable linker and forwards execution into SDL3.

          #define SDL_MAIN_HANDLED 1

          #include <SDL3/SDL.h>
          #include <SDL3/SDL_main.h>

          extern "C" SDL_AppResult SDLCALL SDL_AppInit(
              void** appstate,
              int argc,
              char** argv);

          extern "C" SDL_AppResult SDLCALL SDL_AppIterate(
              void* appstate);

          extern "C" SDL_AppResult SDLCALL SDL_AppEvent(
              void* appstate,
              SDL_Event* event);

          extern "C" void SDLCALL SDL_AppQuit(
              void* appstate,
              SDL_AppResult result);

          int main(int argc, char** argv) {
              return SDL_EnterAppMainCallbacks(
                  argc,
                  argv,
                  SDL_AppInit,
                  SDL_AppIterate,
                  SDL_AppEvent,
                  SDL_AppQuit
              );
          }
          EOF

          # --------------------------------------------------------
          # 5.4 把 wrapper 加入 yuzu-cmd
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/yuzu_cmd/CMakeLists.txt")
          text = path.read_text()

          if "eden_bionic_entry.cpp" in text:
              print("eden_bionic_entry.cpp already present.")
          else:
              # 找 yuzu.cpp 行
              lines = text.splitlines()

              inserted = False
              output = []

              for line in lines:
                  output.append(line)

                  if line.strip() == "yuzu.cpp":
                      output.append("    eden_bionic_entry.cpp")
                      inserted = True

              if not inserted:
                  raise SystemExit(
                      "ERROR: Could not find yuzu.cpp in "
                      "src/yuzu_cmd/CMakeLists.txt"
                  )

              path.write_text("\n".join(output) + "\n")

          print("=== yuzu_cmd source list updated ===")
          PY

          # --------------------------------------------------------
          # 5.5 不修改官方 yuzu.cpp
          # --------------------------------------------------------
          echo
          echo "=== Verify yuzu.cpp remains upstream ==="

          git diff -- src/yuzu_cmd/yuzu.cpp || true

          echo
          echo "=== SDL callback entry in yuzu.cpp ==="

          grep -nE \
            'SDL_MAIN_USE_CALLBACKS|SDL_AppInit|SDL_AppIterate|SDL_AppEvent|SDL_AppQuit' \
            src/yuzu_cmd/yuzu.cpp || true

          echo
          echo "=== Bionic wrapper ==="

          sed -n '1,220p' src/yuzu_cmd/eden_bionic_entry.cpp

          echo
          echo "=== Android JNI CMake guard ==="

          grep -n -A4 -B2 \
            'YUZU_BIONIC_CLI' \
            src/CMakeLists.txt

          echo
          echo "=== YUZU_CMD CMake ==="

          grep -n -A2 -B2 \
            'YUZU_CMD' \
            CMakeLists.txt | head -40

      # ============================================================
      # 6. Configure
      # ============================================================
      - name: Configure CMake
        shell: bash
        run: |
          set -eux

          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"

          echo "============================================================"
          echo "Configure Eden"
          echo "============================================================"

          echo "NDK_PATH=$NDK_PATH"

          rm -rf build

          cmake -S . -B build \
            -GNinja \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            \
            -DYUZU_BIONIC_CLI=ON \
            -DYUZU_CMD=ON \
            \
            -DENABLE_QT=OFF \
            -DENABLE_QT_TRANSLATION=OFF \
            \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            \
            -DENABLE_OPENGL=OFF \
            \
            -DENABLE_CUBEB=OFF \
            \
            -DENABLE_WEB_SERVICE=OFF \
            \
            -DENABLE_UPDATE_CHECKER=OFF \
            \
            -DENABLE_COMPATIBILITY_LIST_DOWNLOAD=OFF \
            \
            -DENABLE_LIBUSB=OFF \
            \
            -DENABLE_WIFI_SCAN=OFF \
            \
            -DUSE_DISCORD_PRESENCE=OFF \
            \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            \
            -DYUZU_TESTS=OFF \
            \
            -DYUZU_DOWNLOAD_ANDROID_VVL=OFF \
            \
            -DYUZU_DOWNLOAD_TIME_ZONE_DATA=ON \
            \
            -DYUZU_LEGACY=ON \
            \
            -DYUZU_ENABLE_LTO=OFF \
            \
            -DYUZU_USE_BUNDLED_VCPKG=OFF \
            \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" \
            \
            -DCMAKE_CXX_FLAGS="-fexperimental-library" \
            -DCMAKE_C_FLAGS="-fexperimental-library"

      # ============================================================
      # 7. 验证 CMake 构建图
      # ============================================================
      - name: Validate CMake Build Graph
        shell: bash
        run: |
          set -eux

          echo "============================================================"
          echo "Validate build graph"
          echo "============================================================"

          echo
          echo "=== YUZU_BIONIC_CLI ==="
          grep '^YUZU_BIONIC_CLI:' build/CMakeCache.txt || true

          echo
          echo "=== YUZU_CMD ==="
          grep '^YUZU_CMD:' build/CMakeCache.txt || true

          echo
          echo "=== ANDROID ==="
          grep '^ANDROID:' build/CMakeCache.txt || true

          echo
          echo "=== Architecture ==="
          grep '^ARCHITECTURE:' build/CMakeCache.txt || true

          echo
          echo "=== HAS_NCE ==="
          grep -R "HAS_NCE" \
            build/CMakeCache.txt \
            build/CMakeFiles \
            2>/dev/null || true

          echo
          echo "=== Check yuzu-android target ==="

          if grep -R \
            'yuzu-android' \
            build/build.ninja \
            build/src \
            2>/dev/null | head -20; then

              echo "WARNING: yuzu-android references still exist in generated files."

          else

              echo "OK: yuzu-android target not present."

          fi

          echo
          echo "=== Check eden-cli target ==="

          ninja -C build -t targets all \
            | grep -E '(^|/)eden-cli($|:)|yuzu-cmd' \
            | head -50 || true

      # ============================================================
      # 8. 编译 eden-cli
      # ============================================================
      - name: Build Eden CLI
        shell: bash
        run: |
          set -eux

          echo "============================================================"
          echo "Building eden-cli"
          echo "============================================================"

          ninja -C build -j"$(nproc)" eden-cli

      # ============================================================
      # 9. 验证 ARM64 ELF
      # ============================================================
      - name: Verify Eden ELF
        shell: bash
        run: |
          set -eux

          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"

          BIN="build/bin/eden-cli"

          if [ ! -f "$BIN" ]; then
            echo "ERROR: eden-cli not found"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "ELF information"
          echo "============================================================"

          echo
          echo "=== file ==="

          file "$BIN"

          echo
          echo "=== ELF header ==="

          readelf -h "$BIN"

          echo
          echo "=== Interpreter ==="

          readelf -l "$BIN" \
            | grep -A2 INTERP \
            || true

          echo
          echo "=== Main symbol ==="

          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            -C "$BIN" \
            | grep -E '(^| )main$' \
            || true

          echo
          echo "=== Eden SDL callback symbols ==="

          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            -C "$BIN" \
            | grep -E \
              'SDL_AppInit|SDL_AppIterate|SDL_AppEvent|SDL_AppQuit' \
            || true

          echo
          echo "=== Dynamic libraries ==="

          readelf -d "$BIN" || true

      # ============================================================
      # 10. 准备运行包
      # ============================================================
      - name: Prepare Runtime Package
        shell: bash
        run: |
          set -eux

          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"

          rm -rf output_bin
          mkdir -p output_bin

          echo "=== eden-cli ==="

          cp \
            build/bin/eden-cli \
            output_bin/eden-cli

          echo
          echo "=== libc++_shared.so ==="

          LIBCXX="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"

          if [ ! -f "$LIBCXX" ]; then
            echo "ERROR: libc++_shared.so not found"
            exit 1
          fi

          cp \
            "$LIBCXX" \
            output_bin/libc++_shared.so

          echo
          echo "=== Other generated native libraries ==="

          find build/bin \
            -maxdepth 1 \
            -type f \
            -name '*.so' \
            -print \
            -exec cp {} output_bin/ \; \
            || true

          echo
          echo "=== Runtime package ==="

          ls -lah output_bin

          echo
          echo "=== File architecture ==="

          file output_bin/*

      # ============================================================
      # 11. 打包 tar.gz
      # ============================================================
      - name: Create Tarball
        shell: bash
        run: |
          set -eux

          tar \
            -czf \
            eden-bionic-arm64.tar.gz \
            -C output_bin \
            .

          ls -lh eden-bionic-arm64.tar.gz

      # ============================================================
      # 12. 上传
      # ============================================================
      - name: Upload Eden Bionic ARM64
        uses: actions/upload-artifact@v4
        with:
          name: eden-bionic-arm64
          path: |
            output_bin/
            eden-bionic-arm64.tar.gz
          if-no-files-found: error
