name: Build Eden Bionic Native CLI ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-eden-bionic-arm64:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. 清理 Runner 磁盘空间
      # ============================================================
      - name: Free Disk Space
        shell: bash
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          df -h

      # ============================================================
      # 2. 拉取源码与子模块
      # ============================================================
      - name: Checkout Eden
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # 3. 安装构建主机依赖
      # ============================================================
      - name: Install Host Dependencies
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            ccache \
            glslang-tools \
            nasm \
            libtool \
            python3 \
            pkg-config \
            file \
            jq

          cmake --version
          ninja --version
          python3 --version
          jq --version

      # ============================================================
      # 4. 配置 Android NDK r27c
      # ============================================================
      - name: Setup Android NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Export NDK Environment
        shell: bash
        run: |
          set -eux
          echo "NDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      # ============================================================
      # 5. 精确源码重构 (斩断 Android Framework 依赖链)
      # ============================================================
      - name: Patch Eden For Bionic CLI
        shell: bash
        run: |
          set -eux
          echo "============================================================"
          echo "Eden ARM64 Android/Bionic CLI source preparation"
          echo "============================================================"

          # --------------------------------------------------------
          # 5.1 开启 YUZU_CMD + 注册 YUZU_BIONIC_CLI 宏
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("CMakeLists.txt")
          text = path.read_text()

          pattern = re.compile(
              r'cmake_dependent_option\s*\(\s*'
              r'YUZU_CMD\s+'
              r'"[^"]*"\s+'
              r'[^)]*?'
              r'"NOT ANDROID"\s+'
              r'OFF\s*\)',
              re.MULTILINE
          )

          replacement = 'option(YUZU_CMD "Compile the eden-cli executable" ON)'

          if pattern.search(text):
              text = pattern.sub(replacement, text, count=1)
              print("YUZU_CMD Android restriction removed.")
          elif 'option(YUZU_CMD "Compile the eden-cli executable" ON)' in text:
              print("YUZU_CMD already enabled.")
          else:
              raise SystemExit("ERROR: YUZU_CMD declaration not found.")

          marker = 'option(YUZU_CMD "Compile the eden-cli executable" ON)'
          if "option(YUZU_BIONIC_CLI" not in text:
              bionic_block = (
                  marker + "\n"
                  'option(YUZU_BIONIC_CLI "Build standalone Android/Bionic CLI" OFF)\n'
                  "if (YUZU_BIONIC_CLI)\n"
                  "    add_compile_definitions(YUZU_BIONIC_CLI)\n"
                  "endif()"
              )
              text = text.replace(marker, bionic_block, 1)
              print("YUZU_BIONIC_CLI option added.")
          path.write_text(text)
          PY

          # --------------------------------------------------------
          # 5.2 排除 yuzu-android JNI 编译
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/CMakeLists.txt")
          if not path.exists():
              raise SystemExit("ERROR: src/CMakeLists.txt not found.")

          text = path.read_text()
          pattern = re.compile(
              r'if\s*\(\s*ANDROID\s*\)\s*'
              r'add_subdirectory\(\s*android/app/src/main/jni\s*\)\s*'
              r'target_include_directories\(\s*yuzu-android\s+PRIVATE\s+android/app/src/main\s*\)\s*'
              r'endif\s*\(\s*\)',
              re.MULTILINE
          )

          replacement = (
              "if (ANDROID AND NOT YUZU_BIONIC_CLI)\n"
              "    add_subdirectory(android/app/src/main/jni)\n"
              "    target_include_directories(yuzu-android PRIVATE android/app/src/main)\n"
              "endif()"
          )

          if pattern.search(text):
              text = pattern.sub(replacement, text, count=1)
              print("Android JNI target disabled.")
          elif "if (ANDROID AND NOT YUZU_BIONIC_CLI)" in text:
              print("Android JNI guard already patched.")
          path.write_text(text)
          PY

          # --------------------------------------------------------
          # 5.3 剔除 CMake 中的 mediandk
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          for p in Path("src").rglob("CMakeLists.txt"):
              text = p.read_text()
              if "mediandk" in text:
                  text = re.sub(r'\bmediandk\b', '', text)
                  p.write_text(text)
                  print(f"Removed mediandk from: {p}")
          PY

          # --------------------------------------------------------
          # 5.4 补齐 <stop_token> 头文件
          # --------------------------------------------------------
          for f in src/common/thread_worker.h src/common/polyfill_thread.h src/common/thread.h; do
            if [ -f "$f" ] && ! grep -q '#include <stop_token>' "$f"; then
              sed -i '1i#include <stop_token>' "$f"
              echo "Added stop_token include to $f"
            fi
          done

          # --------------------------------------------------------
          # 5.5 禁用 Android Input Engine (杜绝 Vibration 线程)
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("src/input_common/main.cpp"),
              Path("src/input_common/main.h"),
          ]

          for path in files:
              if path.exists():
                  text = path.read_text()
                  text = re.sub(
                      r'#if(def\s+__ANDROID__|defined\(__ANDROID__\))',
                      '#if defined(__ANDROID__) && !defined(YUZU_BIONIC_CLI)',
                      text
                  )
                  path.write_text(text)
                  print(f"Android input blocks guarded in: {path}")
          PY

          # --------------------------------------------------------
          # 5.6 引入 android_settings.cpp (闭环 AndroidSettings::values)
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/yuzu_cmd/CMakeLists.txt")
          if not path.exists():
              raise SystemExit("ERROR: src/yuzu_cmd/CMakeLists.txt not found.")

          text = path.read_text()
          source_line = "    ../android/app/src/main/jni/android_settings.cpp\n"

          if "android_settings.cpp" not in text:
              marker = "add_executable(yuzu-cmd\n"
              if marker in text:
                  text = text.replace(marker, marker + source_line, 1)
                  print("Added android_settings.cpp to yuzu-cmd.")
          path.write_text(text)
          PY

          # --------------------------------------------------------
          # 5.7 拦截电池状态分支
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/common/device_power_state.cpp")
          if path.exists():
              text = path.read_text()
              text = re.sub(
                  r'#elif\s+defined\(__ANDROID__\)',
                  '#elif defined(__ANDROID__) && !defined(YUZU_BIONIC_CLI)',
                  text
              )
              path.write_text(text)
              print("Guarded Android battery in device_power_state.cpp")
          PY

          # --------------------------------------------------------
          # 5.8 精确重构 yuzu.cpp (注入闭环桩消解 libandroid.so / libOpenSLES.so)
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/yuzu_cmd/yuzu.cpp")
          if not path.exists():
              raise SystemExit("ERROR: src/yuzu_cmd/yuzu.cpp not found.")

          text = path.read_text()

          if "#include <cstring>" not in text:
              text = text.replace("#include <string>", "#include <string>\n#include <cstring>", 1)

          if "#include <unistd.h>" not in text:
              text = text.replace(
                  "#include <getopt.h>",
                  "#include <getopt.h>\n#ifndef _WIN32\n#include <unistd.h>\n#endif",
                  1
              )

          # 切换 SDL main 声明模式
          pattern_sdl_main = re.compile(
              r'#define\s+SDL_MAIN_USE_CALLBACKS\s+1.*?\n\s*#include\s+<SDL3/SDL_main\.h>',
              re.MULTILINE
          )
          new_sdl_main = (
              "#ifdef YUZU_BIONIC_CLI\n"
              "#define SDL_MAIN_HANDLED 1\n"
              "#else\n"
              "#define SDL_MAIN_USE_CALLBACKS 1\n"
              "#endif\n"
              "#include <SDL3/SDL_main.h>"
          )
          if pattern_sdl_main.search(text):
              text = pattern_sdl_main.sub(new_sdl_main, text, count=1)

          # 修正 optstring：补充短参数 'n'
          new_optstring = "g:fhvnc:m:p::u:d:i:sx:"
          text = re.sub(
              r'getopt_long\s*\(\s*argc\s*,\s*argv\s*,\s*"[^"]*"',
              f'getopt_long(argc, argv, "{new_optstring}"',
              text,
              count=1
          )

          # 修正 long_options 参数属性
          text = text.replace(
              '{"input-profile", no_argument, 0, \'i\'},',
              '{"input-profile", required_argument, 0, \'i\'},'
          )
          text = text.replace(
              '{"filter", no_argument, 0, \'x\'},',
              '{"filter", required_argument, 0, \'x\'},'
          )

          # 修正 SDL_AppEvent 退出判定
          pattern_event = re.compile(
              r'(extern\s+"C"\s+SDL_AppResult\s+SDL_AppEvent\s*\([^)]*\)\s*\{.*?'
              r'state->emu_window->OnEvent\(\*event\);\s*\n\s*)'
              r'return\s+SDL_APP_SUCCESS\s*;\s*\n\s*\}',
              re.MULTILINE | re.DOTALL
          )
          replacement_event = (
              r'\1'
              "#ifdef YUZU_BIONIC_CLI\n"
              "    return state->emu_window->IsOpen()\n"
              "        ? SDL_APP_CONTINUE\n"
              "        : SDL_APP_SUCCESS;\n"
              "#else\n"
              "    return SDL_APP_SUCCESS;\n"
              "#endif\n"
              "}"
          )
          if pattern_event.search(text):
              text = pattern_event.sub(replacement_event, text, count=1)

          # 追加标准原生 main() 与全部 NDK 闭环桩 (消除 libandroid.so 和 libOpenSLES.so)
          if "int main(int argc, char** argv)" not in text:
              native_main = (
                  "\n#ifdef YUZU_BIONIC_CLI\n\n"
                  "#include <cstdint>\n"
                  "#include <cstddef>\n"
                  "#include <sys/types.h>\n\n"
                  "extern \"C\" {\n"
                  "// 1. OpenSLES 闭环桩 (消解 libOpenSLES.so)\n"
                  "struct SLInterfaceID_ { uint32_t a; uint16_t b, c, d; uint8_t e[6]; };\n"
                  "static const struct SLInterfaceID_ s_dummy = {0, 0, 0, 0, {0}};\n"
                  "extern const struct SLInterfaceID_* const SL_IID_ENGINE = &s_dummy;\n"
                  "extern const struct SLInterfaceID_* const SL_IID_VOLUME = &s_dummy;\n"
                  "extern const struct SLInterfaceID_* const SL_IID_ANDROIDSIMPLEBUFFERQUEUE = &s_dummy;\n"
                  "extern const struct SLInterfaceID_* const SL_IID_RECORD = &s_dummy;\n"
                  "extern const struct SLInterfaceID_* const SL_IID_PLAY = &s_dummy;\n"
                  "int slCreateEngine(void*, uint32_t, const void*, uint32_t, const void*, const void*) { return 1; }\n\n"
                  "// 2. ANativeWindow 闭环桩 (消解 libandroid.so -> libgui.so 依赖)\n"
                  "int32_t ANativeWindow_setBuffersGeometry(void*, int32_t, int32_t, int32_t) { return 0; }\n"
                  "int32_t ANativeWindow_getWidth(void*) { return 1800; }\n"
                  "int32_t ANativeWindow_getHeight(void*) { return 2880; }\n"
                  "int32_t ANativeWindow_getFormat(void*) { return 1; }\n"
                  "void* ANativeWindow_fromSurface(void*, void*) { return nullptr; }\n"
                  "void ANativeWindow_acquire(void*) {}\n"
                  "void ANativeWindow_release(void*) {}\n"
                  "int32_t ANativeWindow_lock(void*, void*, void*) { return -1; }\n"
                  "int32_t ANativeWindow_unlockAndPost(void*) { return 0; }\n\n"
                  "// 3. Android Sensor / Looper 闭环桩 (消解 SDL 传感器对 libandroid.so 的引用)\n"
                  "void* ASensorManager_getInstance() { return nullptr; }\n"
                  "void* ASensorManager_getInstanceForPackage(const char*) { return nullptr; }\n"
                  "int ASensorManager_getSensorList(void*, void*) { return 0; }\n"
                  "const char* ASensor_getName(void*) { return \"\"; }\n"
                  "int ASensor_getType(void*) { return -1; }\n"
                  "int ASensor_getMinDelay(void*) { return 0; }\n"
                  "void* ASensorManager_createEventQueue(void*, void*, int, void*, void*) { return nullptr; }\n"
                  "int ASensorManager_destroyEventQueue(void*, void*) { return 0; }\n"
                  "int ASensorEventQueue_enableSensor(void*, void*) { return -1; }\n"
                  "int ASensorEventQueue_disableSensor(void*, void*) { return 0; }\n"
                  "int ASensorEventQueue_setEventRate(void*, void*, int32_t) { return 0; }\n"
                  "ssize_t ASensorEventQueue_getEvents(void*, void*, size_t) { return 0; }\n"
                  "void* ALooper_prepare(int) { return nullptr; }\n"
                  "int ALooper_pollOnce(int, int*, int*, void**) { return -1; }\n"
                  "void ALooper_wake(void*) {}\n"
                  "void ALooper_acquire(void*) {}\n"
                  "void ALooper_release(void*) {}\n\n"
                  "// 4. Android Asset 闭环桩 (消解 SDL APK 资源包对 libandroid.so 的引用)\n"
                  "void* AAssetManager_fromJava(void*, void*) { return nullptr; }\n"
                  "void* AAssetManager_open(void*, const char*, int) { return nullptr; }\n"
                  "int AAsset_read(void*, void*, size_t) { return 0; }\n"
                  "int64_t AAsset_seek64(void*, int64_t, int) { return -1; }\n"
                  "int64_t AAsset_getLength64(void*) { return 0; }\n"
                  "void AAsset_close(void*) {}\n"
                  "}\n\n"
                  "int main(int argc, char** argv) {\n"
                  "    if (chdir(\"/data/eden\") != 0) {\n"
                  "        std::cerr << \"Warning: unable to chdir to /data/eden\" << std::endl;\n"
                  "    }\n\n"
                  "    SDL_SetMainReady();\n\n"
                  "    for (int i = 1; i < argc; ++i) {\n"
                  "        if (std::strcmp(argv[i], \"-n\") == 0 ||\n"
                  "            std::strcmp(argv[i], \"--null-render\") == 0) {\n"
                  "            SDL_SetHint(SDL_HINT_VIDEO_DRIVER, \"dummy\");\n"
                  "            break;\n"
                  "        }\n"
                  "    }\n\n"
                  "    void* appstate = nullptr;\n"
                  "    SDL_AppResult result = SDL_AppInit(&appstate, argc, argv);\n\n"
                  "    if (result != SDL_APP_CONTINUE) {\n"
                  "        if (appstate != nullptr) {\n"
                  "            SDL_AppQuit(appstate, result);\n"
                  "        }\n"
                  "        return 0;\n"
                  "    }\n\n"
                  "    while (result == SDL_APP_CONTINUE) {\n"
                  "        SDL_Event event{};\n"
                  "        while (SDL_PollEvent(&event)) {\n"
                  "            result = SDL_AppEvent(appstate, &event);\n"
                  "            if (result != SDL_APP_CONTINUE) {\n"
                  "                break;\n"
                  "            }\n"
                  "        }\n"
                  "        if (result != SDL_APP_CONTINUE) {\n"
                  "            break;\n"
                  "        }\n"
                  "        result = SDL_AppIterate(appstate);\n"
                  "    }\n\n"
                  "    if (appstate != nullptr) {\n"
                  "        SDL_AppQuit(appstate, result);\n"
                  "    }\n\n"
                  "    return result == SDL_APP_SUCCESS ? 0 : 1;\n"
                  "}\n\n"
                  "#endif\n"
              )
              text += native_main

          path.write_text(text)
          print("yuzu.cpp patched successfully.")
          PY

          # --------------------------------------------------------
          # 5.9 弹性修改 emu_window_sdl3.cpp (仅保留 VIDEO)
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/yuzu_cmd/emu_window/emu_window_sdl3.cpp")
          if not path.exists():
              raise SystemExit("ERROR: emu_window_sdl3.cpp not found.")

          text = path.read_text()
          pattern = re.compile(
              r'SDL_Init\s*\(\s*'
              r'SDL_INIT_VIDEO\s*\|\s*'
              r'SDL_INIT_JOYSTICK\s*\|\s*'
              r'SDL_INIT_GAMEPAD\s*'
              r'\)'
          )
          replacement = "SDL_Init(SDL_INIT_VIDEO)"

          if pattern.search(text):
              text = pattern.sub(replacement, text, count=1)
              print("SDL_Init patched to VIDEO only.")
          elif "SDL_Init(SDL_INIT_VIDEO)" in text:
              print("SDL_Init already VIDEO only.")
          else:
              raise SystemExit("ERROR: Could not locate SDL_Init() call.")

          path.write_text(text)
          PY

          # --------------------------------------------------------
          # 5.10 补丁 cpmfile.json 中的 SDL3 包选项
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import json

          path = Path("cpmfile.json")
          if path.exists():
              data = json.loads(path.read_text())
              package = data.get("sdl3")
              if package is not None:
                  options = package.setdefault("options", [])
                  required = [
                      "SDL_AUDIO OFF",
                      "SDL_JOYSTICK OFF",
                      "SDL_HAPTIC OFF",
                      "SDL_HIDAPI OFF",
                      "SDL_SENSOR OFF",
                      "SDL_CAMERA OFF",
                      "SDL_POWER OFF",
                      "SDL_DIALOG OFF",
                      "SDL_TRAY OFF",
                      "SDL_OPENGL OFF",
                      "SDL_OPENGLES OFF",
                      "SDL_DUMMYVIDEO ON",
                      "SDL_VULKAN ON",
                  ]
                  existing_keys = {
                      item.split(" ", 1)[0]
                      for item in options
                      if isinstance(item, str) and " " in item
                  }
                  for item in required:
                      key = item.split(" ", 1)[0]
                      if key not in existing_keys:
                          options.append(item)
                  path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
                  print("cpmfile.json SDL3 options updated.")
          PY

          # --------------------------------------------------------
          # 5.11 清理 CPM SDL3 缓存
          # --------------------------------------------------------
          rm -rf .cache/cpm/sdl3 || true

          # --------------------------------------------------------
          # 5.12 链接 log 库
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/yuzu_cmd/CMakeLists.txt")
          text = path.read_text()
          if "target_link_libraries(yuzu-cmd PRIVATE log)" not in text:
              text += (
                  "\n"
                  "# Bionic Android logging\n"
                  "if (ANDROID AND YUZU_BIONIC_CLI)\n"
                  "    target_link_libraries(yuzu-cmd PRIVATE log)\n"
                  "endif()\n"
              )
              print("Added log dependency for Bionic CLI.")
          path.write_text(text)
          PY

      # ============================================================
      # 6. 配置 CMake (-Wl,--as-needed 精准剥离未使用的动态库)
      # ============================================================
      - name: Configure CMake
        shell: bash
        run: |
          set -eux
          rm -rf build

          cmake -S . -B build \
            -GNinja \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_BIONIC_CLI=ON \
            -DENABLE_QT=OFF \
            -DENABLE_QT_TRANSLATION=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DSDL_AUDIO=OFF \
            -DSDL_VIDEO=ON \
            -DSDL_JOYSTICK=OFF \
            -DSDL_HAPTIC=OFF \
            -DSDL_HIDAPI=OFF \
            -DSDL_SENSOR=OFF \
            -DSDL_CAMERA=OFF \
            -DSDL_POWER=OFF \
            -DSDL_DIALOG=OFF \
            -DSDL_TRAY=OFF \
            -DSDL_DUMMYVIDEO=ON \
            -DSDL_VULKAN=ON \
            -DSDL_OPENGLES=OFF \
            -DSDL_OPENGL=OFF \
            -DENABLE_OPENGL=OFF \
            -DENABLE_CUBEB=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DENABLE_COMPATIBILITY_LIST_DOWNLOAD=OFF \
            -DENABLE_LIBUSB=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_DOWNLOAD_ANDROID_VVL=OFF \
            -DYUZU_DOWNLOAD_TIME_ZONE_DATA=ON \
            -DYUZU_LEGACY=ON \
            -DYUZU_ENABLE_LTO=OFF \
            -DCMAKE_CXX_FLAGS="-fexperimental-library -DYUZU_BIONIC_CLI" \
            -DCMAKE_C_FLAGS="-fexperimental-library -DYUZU_BIONIC_CLI" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -Wl,--as-needed" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld -Wl,--as-needed"

      # ============================================================
      # 7. 从 Ninja 规则中清理多余链接库 (根除 libandroid / libmediandk)
      # ============================================================
      - name: Strip Dead Dynamic Libs From Ninja
        shell: bash
        run: |
          set -eux
          echo "=== 清除 build.ninja 中多余的框架链接指令 ==="
          sed -i -E 's|[^ ]*libmediandk\.so||g' build/build.ninja
          sed -i -E 's|-lmediandk\b||g' build/build.ninja
          sed -i -E 's|-landroid\b||g' build/build.ninja
          sed -i -E 's|-lOpenSLES\b||g' build/build.ninja

      # ============================================================
      # 8. C++20 stop_token 验证
      # ============================================================
      - name: Verify CXX20 stop_token
        shell: bash
        run: |
          set -eux
          cat > /tmp/test_cpp20.cpp <<'EOF'
          #include <stop_token>
          #include <thread>

          int main() {
              std::stop_source source;
              std::stop_token token = source.get_token();
              std::stop_callback callback(token, []() {});
              (void)callback;
              return 0;
          }
          EOF

          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            --target=aarch64-none-linux-android34 \
            --sysroot="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
            -std=c++20 \
            -fexperimental-library \
            /tmp/test_cpp20.cpp \
            -o /tmp/test_cpp20

          file /tmp/test_cpp20
          echo "C++20 stop_token test passed."

      # ============================================================
      # 9. 编译目标
      # ============================================================
      - name: Build Eden CLI
        shell: bash
        run: |
          set -eux
          echo "============================================================"
          echo "Building eden-cli"
          echo "============================================================"
          ninja -C build -j"$(nproc)" eden-cli

      # ============================================================
      # 10. 严格校验纯净度 (严禁包含任何框架动态库)
      # ============================================================
      - name: Verify Clean Bionic ELF
        shell: bash
        run: |
          set -eux
          BIN="build/bin/eden-cli"
          test -f "$BIN"

          echo "============================================================"
          echo "ELF HEADER"
          echo "============================================================"
          file "$BIN"
          readelf -h "$BIN"

          echo "============================================================"
          echo "MAIN SYMBOL"
          echo "============================================================"
          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -C "$BIN" | grep -E '(^| )main$'

          echo "============================================================"
          echo "DYNAMIC DEPENDENCIES (DT_NEEDED)"
          echo "============================================================"
          readelf -d "$BIN"

          # 熔断断言：严禁包含任何 Android Framework 库
          for BANNED in OpenSLES mediandk android.so gui.so; do
            if readelf -d "$BIN" | grep -i "$BANNED"; then
              echo "CRITICAL ERROR: Banned library $BANNED detected!"
              exit 1
            fi
          done
          echo "PASS: Binary is 100% PURE Native Bionic ELF!"

      # ============================================================
      # 11. 提取交付物
      # ============================================================
      - name: Prepare Runtime Package
        shell: bash
        run: |
          set -eux
          rm -rf output_bin && mkdir -p output_bin
          cp build/bin/eden-cli output_bin/eden-cli

          LIBCXX="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          test -f "$LIBCXX"
          cp "$LIBCXX" output_bin/libc++_shared.so

          ls -lah output_bin
          file output_bin/*

      # ============================================================
      # 12. 打包交付物
      # ============================================================
      - name: Package Eden Bionic ARM64
        shell: bash
        run: |
          set -eux
          tar -czf eden-bionic-arm64.tar.gz -C output_bin .
          ls -lh eden-bionic-arm64.tar.gz

      # ============================================================
      # 13. 上传产物
      # ============================================================
      - name: Upload Eden Bionic ARM64
        uses: actions/upload-artifact@v4
        with:
          name: eden-bionic-arm64
          path: |
            output_bin/
            eden-bionic-arm64.tar.gz
          if-no-files-found: error
