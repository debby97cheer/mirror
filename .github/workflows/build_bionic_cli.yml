name: Build Eden Bionic Native CLI (ARM64)

on:
  workflow_dispatch:

jobs:
  build-android-bionic:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          df -h

      - name: Checkout Source with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache glslang-tools nasm libtool

      - name: Setup Android NDK (r27c)
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Patch CMake for Bionic CLI Build
        run: |
          echo "=== 1. 全面放行 yuzu_cmd 前端构建 ==="
          sed -i 's/if (NOT ANDROID)/if (TRUE)/g' CMakeLists.txt || true
          sed -i 's/if (NOT ANDROID)/if (TRUE)/g' src/CMakeLists.txt || true
          sed -i 's/if (ENABLE_SDL2)/if (TRUE)/g' src/CMakeLists.txt || true
          sed -i 's/if (YUZU_CMD)/if (TRUE)/g' src/CMakeLists.txt || true

          echo "=== 2. 补齐 C++20 stop_token 兜底 ==="
          if [ -f src/common/polyfill_thread.h ]; then
            grep -q "#include <stop_token>" src/common/polyfill_thread.h || sed -i '1i #include <stop_token>' src/common/polyfill_thread.h
          fi
          if [ -f src/common/thread.h ]; then
            grep -q "#include <stop_token>" src/common/thread.h || sed -i '1i #include <stop_token>' src/common/thread.h
          fi

          echo "=== 3. 根治 main 符号劫持 (在 yuzu_cmd 目标中永久注入 SDL_MAIN_HANDLED) ==="
          if [ -f "src/yuzu_cmd/CMakeLists.txt" ]; then
            echo 'target_compile_definitions(yuzu-cmd PRIVATE SDL_MAIN_HANDLED=1)' >> src/yuzu_cmd/CMakeLists.txt
          fi

      - name: Configure CMake (Android Bionic NCE)
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "Using NDK Toolchain at: $NDK_PATH"

          mkdir build && cd build

          cmake .. \
            -GNinja \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_QT=OFF \
            -DENABLE_SDL2=ON \
            -DENABLE_SDL3=ON \
            -DYUZU_CMD=ON \
            -DENABLE_NCE=ON \
            -DYUZU_USE_BUNDLED_VCPKG=OFF \
            -DENABLE_COMPATIBILITY_LIST_DOWNLOAD=OFF \
            -DYUZU_ENABLE_LTO=OFF \
            -DYUZU_TESTS=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld"

      - name: Compile Target (yuzu-cmd)
        run: |
          cd build
          echo "=== 检查已生成的 CLI 目标 ==="
          ninja -t targets | grep "yuzu-cmd" || true

          echo "=== 开始链接 yuzu-cmd ==="
          ninja -j$(nproc) yuzu-cmd

      - name: Prepare Artifacts
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          rm -rf output_bin && mkdir -p output_bin

          echo "=== 提取构建产物 ==="
          if [ -f "build/bin/yuzu-cmd" ]; then
            cp build/bin/yuzu-cmd output_bin/
          fi
          find build/bin -type f -exec cp {} output_bin/ \; 2>/dev/null || true

          # 提取配套 NDK libc++_shared.so 运行时
          cp "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" output_bin/ || true

          echo "=== 打包清单 ==="
          ls -lh output_bin/

      - name: Upload Bionic Binaries
        uses: actions/upload-artifact@v4
        with:
          name: eden-bionic-arm64
          path: output_bin/
