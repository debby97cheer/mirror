name: Build Eden Bionic Native CLI ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-eden-bionic-arm64:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. 清理 Runner 磁盘
      # ============================================================
      - name: Free Disk Space
        shell: bash
        run: |
          set -eux

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf "/usr/local/share/boost" || true

          df -h

      # ============================================================
      # 2. Checkout Eden
      # ============================================================
      - name: Checkout Eden
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # 3. Host dependencies
      # ============================================================
      - name: Install Host Dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            ccache \
            glslang-tools \
            nasm \
            libtool \
            python3 \
            pkg-config

          echo "===== Versions ====="

          cmake --version
          ninja --version
          python3 --version

      # ============================================================
      # 4. Android NDK r27c
      # ============================================================
      - name: Setup Android NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      # ============================================================
      # 5. Patch Eden build configuration
      # ============================================================
      - name: Patch Eden For Bionic CLI
        shell: bash
        run: |
          set -eux

          echo
          echo "============================================================"
          echo "Eden ARM64 Bionic CLI preparation"
          echo "============================================================"

          # --------------------------------------------------------
          # 5.1 只解除 YUZU_CMD 的 Android dependent 限制
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("CMakeLists.txt")
          text = path.read_text()

          # Eden 当前通常类似：
          #
          # cmake_dependent_option(
          #     YUZU_CMD
          #     "Compile the eden-cli executable"
          #     ON
          #     "NOT ANDROID"
          #     OFF
          # )
          #
          # 我们只把 YUZU_CMD 改成普通 option。
          pattern = re.compile(
              r'cmake_dependent_option\(\s*'
              r'YUZU_CMD\s+'
              r'"[^"]*"\s+'
              r'[^)]*?'
              r'"NOT ANDROID"\s+'
              r'OFF\s*\)',
              re.MULTILINE
          )

          match = pattern.search(text)

          if match:
              print("Found Android-dependent YUZU_CMD:")
              print(match.group(0))

              replacement = (
                  'option(YUZU_CMD '
                  '"Compile the eden-cli executable" ON)'
              )

              text = (
                  text[:match.start()]
                  + replacement
                  + text[match.end():]
              )

          elif 'option(YUZU_CMD "Compile the eden-cli executable" ON)' in text:
              print("YUZU_CMD is already patched.")

          else:
              raise SystemExit(
                  "ERROR: YUZU_CMD configuration was not found."
              )

          path.write_text(text)
          PY

          # --------------------------------------------------------
          # 5.2 添加专用 Bionic CLI 开关
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path

          path = Path("CMakeLists.txt")
          text = path.read_text()

          marker = 'option(YUZU_CMD "Compile the eden-cli executable" ON)'

          if 'option(YUZU_BIONIC_CLI' not in text:
              if marker not in text:
                  raise SystemExit(
                      "ERROR: Could not find YUZU_CMD marker."
                  )

              text = text.replace(
                  marker,
                  marker
                  + '\n'
                  + 'option(YUZU_BIONIC_CLI '
                  '"Build standalone Android/Bionic CLI" ON)',
                  1
              )

          path.write_text(text)
          PY

          # --------------------------------------------------------
          # 5.3 禁用 Android JNI application
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/CMakeLists.txt")
          text = path.read_text()

          # 只针对 Android JNI 子目录。
          #
          # 不进行：
          #   sed 's/if (NOT ANDROID)/if (TRUE)/g'
          #
          # 避免破坏其它平台条件。
          pattern = re.compile(
              r'if\s*\(\s*ANDROID\s*\)\s*'
              r'add_subdirectory\(\s*android/app/src/main/jni\s*\)\s*'
              r'target_include_directories\(\s*yuzu-android\s+PRIVATE\s+android/app/src/main\s*\)'
              r'\s*endif\s*\(\s*\)',
              re.MULTILINE
          )

          replacement = """if (ANDROID AND NOT YUZU_BIONIC_CLI)
              add_subdirectory(android/app/src/main/jni)
              target_include_directories(yuzu-android PRIVATE android/app/src/main)
          endif()"""

          if pattern.search(text):
              text = pattern.sub(replacement, text, count=1)
              print("Android JNI build disabled for Bionic CLI.")
          elif "ANDROID AND NOT YUZU_BIONIC_CLI" in text:
              print("Android JNI guard already patched.")
          else:
              print(
                  "WARNING: Android JNI block was not found. "
                  "Will verify generated targets later."
              )

          path.write_text(text)
          PY

          # --------------------------------------------------------
          # 5.4 确保 thread_worker.h 显式包含 stop_token
          # --------------------------------------------------------
          if [ -f src/common/thread_worker.h ]; then

            if ! grep -q '#include <stop_token>' src/common/thread_worker.h; then
              python3 - <<'PY'
          from pathlib import Path

          path = Path("src/common/thread_worker.h")
          text = path.read_text()

          text = '#include <stop_token>\n' + text

          path.write_text(text)

          print("Added <stop_token> to thread_worker.h")
          PY
            else
              echo "<stop_token> already included."
            fi

          else
            echo "ERROR: src/common/thread_worker.h not found."
            exit 1
          fi

          # --------------------------------------------------------
          # 5.5 不修改 yuzu.cpp
          # --------------------------------------------------------
          echo
          echo "============================================================"
          echo "yuzu.cpp integrity check"
          echo "============================================================"

          git diff -- src/yuzu_cmd/yuzu.cpp || true

          # --------------------------------------------------------
          # 5.6 检查 Eden 当前 SDL callback
          # --------------------------------------------------------
          echo
          echo "============================================================"
          echo "SDL entry model"
          echo "============================================================"

          grep -nE \
            'SDL_MAIN_USE_CALLBACKS|SDL_AppInit|SDL_AppIterate|SDL_AppEvent|SDL_AppQuit' \
            src/yuzu_cmd/yuzu.cpp \
            || true

          # --------------------------------------------------------
          # 5.7 输出关键配置
          # --------------------------------------------------------
          echo
          echo "============================================================"
          echo "Important configuration"
          echo "============================================================"

          grep -nE \
            'YUZU_CMD|YUZU_BIONIC_CLI' \
            CMakeLists.txt \
            | head -40

          echo
          echo "============================================================"
          echo "stop_callback source"
          echo "============================================================"

          grep -n \
            'std::stop_callback' \
            src/common/thread_worker.h \
            || true

      # ============================================================
      # 6. Configure CMake
      # ============================================================
      - name: Configure CMake
        shell: bash
        run: |
          set -eux

          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"

          echo "NDK = $NDK_PATH"

          rm -rf build

          cmake -S . -B build \
            -GNinja \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DANDROID_STL=c++_shared \
            \
            -DCMAKE_BUILD_TYPE=Release \
            \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            \
            -DYUZU_CMD=ON \
            -DYUZU_BIONIC_CLI=ON \
            \
            -DENABLE_QT=OFF \
            -DENABLE_QT_TRANSLATION=OFF \
            \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            \
            -DENABLE_OPENGL=OFF \
            \
            -DENABLE_CUBEB=OFF \
            \
            -DENABLE_WEB_SERVICE=OFF \
            \
            -DENABLE_UPDATE_CHECKER=OFF \
            \
            -DENABLE_COMPATIBILITY_LIST_DOWNLOAD=OFF \
            \
            -DENABLE_LIBUSB=OFF \
            \
            -DUSE_DISCORD_PRESENCE=OFF \
            \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            \
            -DYUZU_TESTS=OFF \
            \
            -DYUZU_DOWNLOAD_ANDROID_VVL=OFF \
            \
            -DYUZU_ENABLE_LTO=OFF \
            \
            -DYUZU_USE_BUNDLED_VCPKG=OFF \
            \
            -DYUZU_LEGACY=ON \
            \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld"

      # ============================================================
      # 7. Verify CMake actually selected C++20
      # ============================================================
      - name: Verify CXX20 Configuration
        shell: bash
        run: |
          set -eux

          echo "============================================================"
          echo "C++ standard verification"
          echo "============================================================"

          grep -E \
            'CMAKE_CXX_STANDARD:|CMAKE_CXX_FLAGS:' \
            build/CMakeCache.txt \
            || true

          echo
          echo "============================================================"
          echo "Test compiler command for std=c++20"
          echo "============================================================"

          cat > /tmp/test_cpp20.cpp <<'EOF'
          #include <stop_token>
          #include <thread>

          static void test(std::stop_token token) {
              (void)token;
          }

          int main() {
              std::stop_source source;
              std::stop_token token = source.get_token();

              std::stop_callback callback(
                  token,
                  []() {}
              );

              test(token);
              return 0;
          }
          EOF

          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            --target=aarch64-none-linux-android34 \
            --sysroot="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
            -std=c++20 \
            -fexperimental-library \
            /tmp/test_cpp20.cpp \
            -o /tmp/test_cpp20

          file /tmp/test_cpp20

          echo "C++20 stop_token/stop_callback test PASSED."

      # ============================================================
      # 8. 检查生成的 build.ninja
      # ============================================================
      - name: Inspect Ninja Configuration
        shell: bash
        run: |
          set -eux

          echo "============================================================"
          echo "Search generated compile rules"
          echo "============================================================"

          grep -R \
            -- '-std=c++20' \
            build/build.ninja \
            build/src \
            2>/dev/null \
            | head -20 \
            || true

          echo
          echo "============================================================"
          echo "Check yuzu-android"
          echo "============================================================"

          if grep -R \
            'yuzu-android' \
            build/build.ninja \
            2>/dev/null; then

              echo "WARNING: yuzu-android references exist."

          else

              echo "OK: yuzu-android is not in generated build graph."

          fi

          echo
          echo "============================================================"
          echo "Check eden-cli"
          echo "============================================================"

          ninja -C build -t targets all \
            | grep -E 'eden-cli|yuzu-cmd' \
            | head -50 \
            || true

      # ============================================================
      # 9. 编译 eden-cli
      # ============================================================
      - name: Build Eden CLI
        shell: bash
        run: |
          set -eux

          echo "============================================================"
          echo "Building Eden CLI"
          echo "============================================================"

          ninja -C build -j"$(nproc)" eden-cli

      # ============================================================
      # 10. 最终 ELF 检查
      # ============================================================
      - name: Verify Eden ARM64 ELF
        shell: bash
        run: |
          set -eux

          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"

          BIN="build/bin/eden-cli"

          if [ ! -f "$BIN" ]; then
            echo "ERROR: build/bin/eden-cli was not produced."
            exit 1
          fi

          echo
          echo "============================================================"
          echo "FILE"
          echo "============================================================"

          file "$BIN"

          echo
          echo "============================================================"
          echo "ELF HEADER"
          echo "============================================================"

          readelf -h "$BIN"

          echo
          echo "============================================================"
          echo "INTERPRETER"
          echo "============================================================"

          readelf -l "$BIN" \
            | grep -A2 INTERP \
            || true

          echo
          echo "============================================================"
          echo "MAIN SYMBOL"
          echo "============================================================"

          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            -C "$BIN" \
            | grep -E '(^| )main$' \
            || true

          echo
          echo "============================================================"
          echo "SDL CALLBACK SYMBOLS"
          echo "============================================================"

          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            -C "$BIN" \
            | grep -E \
              'SDL_AppInit|SDL_AppIterate|SDL_AppEvent|SDL_AppQuit' \
            || true

          echo
          echo "============================================================"
          echo "DYNAMIC DEPENDENCIES"
          echo "============================================================"

          readelf -d "$BIN"

      # ============================================================
      # 11. 收集运行时
      # ============================================================
      - name: Prepare Runtime
        shell: bash
        run: |
          set -eux

          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"

          rm -rf output_bin
          mkdir -p output_bin

          cp \
            build/bin/eden-cli \
            output_bin/eden-cli

          LIBCXX="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"

          if [ ! -f "$LIBCXX" ]; then
            echo "ERROR: libc++_shared.so not found."
            exit 1
          fi

          cp \
            "$LIBCXX" \
            output_bin/libc++_shared.so

          echo
          echo "============================================================"
          echo "Runtime files"
          echo "============================================================"

          find output_bin \
            -maxdepth 1 \
            -type f \
            -exec file {} \;

          echo
          ls -lah output_bin

      # ============================================================
      # 12. 打包
      # ============================================================
      - name: Package Eden Bionic ARM64
        shell: bash
        run: |
          set -eux

          tar \
            -czf eden-bionic-arm64.tar.gz \
            -C output_bin \
            .

          ls -lh eden-bionic-arm64.tar.gz

      # ============================================================
      # 13. Artifact
      # ============================================================
      - name: Upload Eden Bionic ARM64
        uses: actions/upload-artifact@v4
        with:
          name: eden-bionic-arm64
          path: |
            output_bin/
            eden-bionic-arm64.tar.gz
          if-no-files-found: error
