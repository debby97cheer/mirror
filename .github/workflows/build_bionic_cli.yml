name: Build Eden Bionic Native CLI ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-eden-bionic-arm64:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. 清理 Runner 磁盘空间
      # ============================================================
      - name: Free Disk Space
        shell: bash
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          df -h

      # ============================================================
      # 2. 拉取源码与子模块
      # ============================================================
      - name: Checkout Eden
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # 3. 安装构建主机依赖
      # ============================================================
      - name: Install Host Dependencies
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            ccache \
            glslang-tools \
            nasm \
            libtool \
            python3 \
            pkg-config \
            file \
            jq

          cmake --version
          ninja --version
          python3 --version
          jq --version

      # ============================================================
      # 4. 配置 Android NDK r27c
      # ============================================================
      - name: Setup Android NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Export NDK Environment
        shell: bash
        run: |
          set -eux
          echo "NDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      # ============================================================
      # 5. 源码与构建系统解耦 (源头阻断，绝无假桩，严禁篡改 ninja)
      # ============================================================
      - name: Patch Eden For Pure Bionic Architecture
        shell: bash
        run: |
          set -eux
          echo "============================================================"
          echo "Eden ARM64 Bionic CLI Architecture Decoupling"
          echo "============================================================"

          # --------------------------------------------------------
          # 5.1 根目录 CMakeLists.txt: 注册 YUZU_BIONIC_CLI
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("CMakeLists.txt")
          text = path.read_text()

          pattern = re.compile(
              r'cmake_dependent_option\s*\(\s*'
              r'YUZU_CMD\s+'
              r'"[^"]*"\s+'
              r'[^)]*?'
              r'"NOT ANDROID"\s+'
              r'OFF\s*\)',
              re.MULTILINE
          )

          replacement = 'option(YUZU_CMD "Compile the eden-cli executable" ON)'

          if pattern.search(text):
              text = pattern.sub(replacement, text, count=1)
              print("YUZU_CMD Android restriction removed.")
          elif 'option(YUZU_CMD "Compile the eden-cli executable" ON)' in text:
              print("YUZU_CMD already enabled.")
          else:
              raise SystemExit("ERROR: YUZU_CMD declaration not found.")

          marker = 'option(YUZU_CMD "Compile the eden-cli executable" ON)'
          if "option(YUZU_BIONIC_CLI" not in text:
              bionic_block = (
                  marker + "\n"
                  'option(YUZU_BIONIC_CLI "Build standalone Android/Bionic CLI" OFF)\n'
                  "if (YUZU_BIONIC_CLI)\n"
                  "    add_compile_definitions(YUZU_BIONIC_CLI)\n"
                  "endif()"
              )
              text = text.replace(marker, bionic_block, 1)
              print("YUZU_BIONIC_CLI option added.")
          path.write_text(text)
          PY

          # --------------------------------------------------------
          # 5.2 src/CMakeLists.txt: 彻底排除 yuzu-android 目录
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/CMakeLists.txt")
          text = path.read_text()

          pattern = re.compile(
              r'if\s*\(\s*ANDROID\s*\)\s*'
              r'add_subdirectory\(\s*android/app/src/main/jni\s*\)\s*'
              r'target_include_directories\(\s*yuzu-android\s+PRIVATE\s+android/app/src/main\s*\)\s*'
              r'endif\s*\(\s*\)',
              re.MULTILINE
          )

          replacement = (
              "if (ANDROID AND NOT YUZU_BIONIC_CLI)\n"
              "    add_subdirectory(android/app/src/main/jni)\n"
              "    target_include_directories(yuzu-android PRIVATE android/app/src/main)\n"
              "endif()"
          )

          if pattern.search(text):
              text = pattern.sub(replacement, text, count=1)
              print("Excluded yuzu-android directory in Bionic CLI mode.")
          path.write_text(text)
          PY

          # --------------------------------------------------------
          # 5.3 src/core/CMakeLists.txt: 消除 mediandk 传递依赖
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/core/CMakeLists.txt")
          text = path.read_text()

          text = re.sub(
              r'if\s*\(\s*ANDROID\s*\)\s*target_link_libraries\(\s*core\s+PRIVATE\s+mediandk\s*\)\s*endif\s*\(\s*\)',
              'if (ANDROID AND NOT YUZU_BIONIC_CLI)\n    target_link_libraries(core PRIVATE mediandk)\nendif()',
              text
          )
          text = re.sub(r'target_link_libraries\(\s*core\s+PRIVATE\s+mediandk\s*\)', 
                        'if (NOT YUZU_BIONIC_CLI)\n    target_link_libraries(core PRIVATE mediandk)\nendif()', text)

          path.write_text(text)
          print("Guarded mediandk linkage in src/core/CMakeLists.txt.")
          PY

          # --------------------------------------------------------
          # 5.4 切断 AudioCore 对 SDL Audio 的引用链
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          # 1. 在 CMake 中排除 sdl_sink.cpp 的编译
          for p in Path("src/audio_core").rglob("CMakeLists.txt"):
              text = p.read_text()
              text = re.sub(
                  r'if\s*\(\s*YUZU_USE_BUNDLED_SDL3\s+OR\s+SDL3_FOUND\s*\)',
                  'if ((YUZU_USE_BUNDLED_SDL3 OR SDL3_FOUND) AND NOT YUZU_BIONIC_CLI)',
                  text
              )
              p.write_text(text)
              print(f"Guarded SDL audio sink in: {p}")

          # 2. 在 sink_details.cpp 中排除 SDLSink 创建分支
          sink_details = Path("src/audio_core/sink/sink_details.cpp")
          if sink_details.exists():
              text = sink_details.read_text()
              text = re.sub(
                  r'#if\s+defined\(HAVE_SDL3\)\s*\|\|\s*defined\(YUZU_USE_BUNDLED_SDL3\)',
                  '#if (defined(HAVE_SDL3) || defined(YUZU_USE_BUNDLED_SDL3)) && !defined(YUZU_BIONIC_CLI)',
                  text
              )
              sink_details.write_text(text)
              print("Guarded SDLSink branch in sink_details.cpp")
          PY

          # --------------------------------------------------------
          # 5.5 src/common/CMakeLists.txt: 消除 android 系统库的 PUBLIC 传播
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/common/CMakeLists.txt")
          text = path.read_text()

          pattern = re.compile(r'target_link_libraries\(\s*common\s+PUBLIC\s+android\s*\)')
          replacement = 'if (NOT YUZU_BIONIC_CLI)\n    target_link_libraries(common PUBLIC android)\nendif()'
          text = pattern.sub(replacement, text)

          path.write_text(text)
          print("Guarded libandroid linkage in src/common/CMakeLists.txt.")
          PY

          # --------------------------------------------------------
          # 5.6 src/input_common: 切除 Android Input Engine 实例化
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          for p in [Path("src/input_common/main.cpp"), Path("src/input_common/main.h")]:
              if p.exists():
                  text = p.read_text()
                  text = re.sub(
                      r'#if(def\s+__ANDROID__|defined\(__ANDROID__\))',
                      '#if defined(__ANDROID__) && !defined(YUZU_BIONIC_CLI)',
                      text
                  )
                  p.write_text(text)
                  print(f"Disabled Android vibration engine in: {p}")
          PY

          # --------------------------------------------------------
          # 5.7 src/common/device_power_state.cpp: 走标准无电池回退分支
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/common/device_power_state.cpp")
          if path.exists():
              text = path.read_text()
              text = re.sub(
                  r'#elif\s+defined\(__ANDROID__\)',
                  '#elif defined(__ANDROID__) && !defined(YUZU_BIONIC_CLI)',
                  text
              )
              path.write_text(text)
              print("Guarded Android battery globals in device_power_state.cpp.")
          PY

          # --------------------------------------------------------
          # 5.8 src/yuzu_cmd/CMakeLists.txt: 编译原生 android_settings.cpp 数据源
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/yuzu_cmd/CMakeLists.txt")
          text = path.read_text()

          source_line = "    ../android/app/src/main/jni/android_settings.cpp\n"
          if "android_settings.cpp" not in text:
              marker = "add_executable(yuzu-cmd\n"
              if marker in text:
                  text = text.replace(marker, marker + source_line, 1)
                  print("Added android_settings.cpp data object to yuzu-cmd.")

          if "target_link_libraries(yuzu-cmd PRIVATE log)" not in text:
              text += (
                  "\n"
                  "if (ANDROID AND YUZU_BIONIC_CLI)\n"
                  "    target_link_libraries(yuzu-cmd PRIVATE log)\n"
                  "endif()\n"
              )
          path.write_text(text)
          PY

          # --------------------------------------------------------
          # 5.9 规范 EmuWindow_SDL3 抽象基类 (短路物理窗口)
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/yuzu_cmd/emu_window/emu_window_sdl3.cpp")
          text = path.read_text()

          if "#include <iostream>" not in text:
              text = "#include <iostream>\n" + text

          pattern = re.compile(r'(input_subsystem->Initialize\(\)\s*;\s*\n)')
          injection = (
              "\\1#ifdef YUZU_BIONIC_CLI\n"
              "    std::cout << \"[BIONIC] EmuWindow_SDL3: Headless mode - no physical window\" << std::endl;\n"
              "    is_open = true;\n"
              "    render_window = nullptr;\n"
              "    return;\n"
              "#endif\n"
          )
          if pattern.search(text):
              text = pattern.sub(injection, text, count=1)

          pattern_dtor = re.compile(r'EmuWindow_SDL3::~EmuWindow_SDL3\(\)\s*\{')
          injection_dtor = (
              "EmuWindow_SDL3::~EmuWindow_SDL3() {\n"
              "    if (!render_window) return;"
          )
          text = pattern_dtor.sub(injection_dtor, text, count=1)

          path.write_text(text)
          print("emu_window_sdl3.cpp patched cleanly.")
          PY

          # --------------------------------------------------------
          # 5.10 规范 EmuWindow_SDL3_Null 派生实现 (复用已有 DummyContext)
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/yuzu_cmd/emu_window/emu_window_sdl3_null.cpp")
          clean_null_impl = (
              "// SPDX-FileCopyrightText: 2026 Eden Emulator Project\n"
              "// SPDX-License-Identifier: GPL-3.0-or-later\n\n"
              "#include <iostream>\n"
              "#include <SDL3/SDL.h>\n"
              "#include \"yuzu_cmd/emu_window/emu_window_sdl3_null.h\"\n\n"
              "EmuWindow_SDL3_Null::EmuWindow_SDL3_Null(InputCommon::InputSubsystem* input_subsystem,\n"
              "                                         Core::System& system, bool fullscreen)\n"
              "    : EmuWindow_SDL3{input_subsystem, system} {\n"
              "    if (render_window != nullptr) {\n"
              "        SDL_HideWindow(render_window);\n"
              "    }\n"
              "    is_open = true;\n"
              "    std::cout << \"[BIONIC] EmuWindow_SDL3_Null: Ready with valid DummyContext.\" << std::endl;\n"
              "}\n\n"
              "EmuWindow_SDL3_Null::~EmuWindow_SDL3_Null() = default;\n\n"
              "std::unique_ptr<Core::Frontend::GraphicsContext> EmuWindow_SDL3_Null::CreateSharedContext() const {\n"
              "    return std::make_unique<DummyContext>();\n"
              "}\n"
          )
          path.write_text(clean_null_impl)
          print("emu_window_sdl3_null.cpp written cleanly with existing DummyContext definition.")
          PY

          # --------------------------------------------------------
          # 5.11 yuzu.cpp: 标准入口、无缓冲输出、绝无任何 fake/stub
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/yuzu_cmd/yuzu.cpp")
          text = path.read_text()

          if "#include <cstring>" not in text:
              text = text.replace("#include <string>", "#include <string>\n#include <cstring>", 1)

          if "#include <unistd.h>" not in text:
              text = text.replace(
                  "#include <getopt.h>",
                  "#include <getopt.h>\n#ifndef _WIN32\n#include <unistd.h>\n#endif",
                  1
              )

          pattern_sdl_main = re.compile(
              r'#define\s+SDL_MAIN_USE_CALLBACKS\s+1.*?\n\s*#include\s+<SDL3/SDL_main\.h>',
              re.MULTILINE
          )
          new_sdl_main = (
              "#ifdef YUZU_BIONIC_CLI\n"
              "#define SDL_MAIN_HANDLED 1\n"
              "#else\n"
              "#define SDL_MAIN_USE_CALLBACKS 1\n"
              "#endif\n"
              "#include <SDL3/SDL_main.h>"
          )
          if pattern_sdl_main.search(text):
              text = pattern_sdl_main.sub(new_sdl_main, text, count=1)

          new_optstring = "g:fhvnc:m:p::u:d:i:sx:"
          text = re.sub(
              r'getopt_long\s*\(\s*argc\s*,\s*argv\s*,\s*"[^"]*"',
              f'getopt_long(argc, argv, "{new_optstring}"',
              text,
              count=1
          )

          text = text.replace(
              '{"input-profile", no_argument, 0, \'i\'},',
              '{"input-profile", required_argument, 0, \'i\'},'
          )
          text = text.replace(
              '{"filter", no_argument, 0, \'x\'},',
              '{"filter", required_argument, 0, \'x\'},'
          )

          text = text.replace(
              'state->system.Initialize();',
              'std::cout << "[BIONIC] Step 1: Initializing System Core..." << std::endl;\n    state->system.Initialize();\n    std::cout << "[BIONIC] Step 2: System Core Initialized. Creating InputSubsystem..." << std::endl;'
          )
          text = text.replace(
              'state->system.ApplySettings();',
              'std::cout << "[BIONIC] Step 3: InputSubsystem Ready. Applying settings..." << std::endl;\n    state->system.ApplySettings();\n    std::cout << "[BIONIC] Step 4: Settings Applied. Selected backend=" << static_cast<int>(Settings::values.renderer_backend.GetValue()) << ". Creating EmuWindow..." << std::endl;'
          )
          text = text.replace(
              'state->system.SetContentProvider',
              'std::cout << "[BIONIC] Step 5: EmuWindow Ready! Initializing Filesystem..." << std::endl;\n    state->system.SetContentProvider'
          )
          text = text.replace(
              'const Core::SystemResultStatus load_result = state->system.Load(*state->emu_window, filepath, load_parameters);',
              'std::cout << "[BIONIC] Step 6: Ready to Load ROM: " << filepath << std::endl;\n    const Core::SystemResultStatus load_result = state->system.Load(*state->emu_window, filepath, load_parameters);\n    std::cout << "[BIONIC] Step 7: Load completed with status: " << static_cast<int>(load_result) << std::endl;'
          )

          pattern_tail = re.compile(
              r'(void\s*\(\s*state->system\.Run\(\)\s*\)\s*;\s*\n\s*'
              r'if\s*\(\s*state->system\.DebuggerEnabled\(\)\s*\)\s*\n\s*'
              r'state->system\.InitializeDebugger\(\)\s*;\s*\n\s*)'
              r'return\s+SDL_APP_SUCCESS\s*;\s*\n\s*\}',
              re.MULTILINE
          )
          new_tail = (
              r'\1'
              "#ifdef YUZU_BIONIC_CLI\n"
              "    std::cout << \"[BIONIC] Step 8: System Run! Entering iteration loop...\" << std::endl;\n"
              "    if (appstate != nullptr) {\n"
              "        *appstate = state;\n"
              "    }\n"
              "    return SDL_APP_CONTINUE;\n"
              "#else\n"
              "    return SDL_APP_SUCCESS;\n"
              "#endif\n"
              "}"
          )
          if pattern_tail.search(text):
              text = pattern_tail.sub(new_tail, text, count=1)

          if "int main(int argc, char** argv)" not in text:
              native_main = (
                  "\n#ifdef YUZU_BIONIC_CLI\n\n"
                  "#include <thread>\n"
                  "#include <chrono>\n\n"
                  "int main(int argc, char** argv) {\n"
                  "    setvbuf(stdout, nullptr, _IONBF, 0);\n"
                  "    setvbuf(stderr, nullptr, _IONBF, 0);\n\n"
                  "    if (chdir(\"/data/eden\") != 0) {\n"
                  "        std::cerr << \"Warning: unable to chdir to /data/eden\" << std::endl;\n"
                  "    }\n\n"
                  "    SDL_SetMainReady();\n\n"
                  "    for (int i = 1; i < argc; ++i) {\n"
                  "        if (std::strcmp(argv[i], \"-n\") == 0 ||\n"
                  "            std::strcmp(argv[i], \"--null-render\") == 0) {\n"
                  "            SDL_SetHint(SDL_HINT_VIDEO_DRIVER, \"dummy\");\n"
                  "            break;\n"
                  "        }\n"
                  "    }\n\n"
                  "    void* appstate = nullptr;\n"
                  "    SDL_AppResult result = SDL_AppInit(&appstate, argc, argv);\n\n"
                  "    if (result != SDL_APP_CONTINUE || appstate == nullptr) {\n"
                  "        if (appstate != nullptr) {\n"
                  "            SDL_AppQuit(appstate, result);\n"
                  "        }\n"
                  "        return (result == SDL_APP_SUCCESS) ? 0 : 1;\n"
                  "    }\n\n"
                  "    while (result == SDL_APP_CONTINUE) {\n"
                  "        SDL_Event event{};\n"
                  "        while (SDL_PollEvent(&event)) {\n"
                  "            result = SDL_AppEvent(appstate, &event);\n"
                  "            if (result != SDL_APP_CONTINUE) {\n"
                  "                break;\n"
                  "            }\n"
                  "        }\n"
                  "        if (result != SDL_APP_CONTINUE) {\n"
                  "            break;\n"
                  "        }\n"
                  "        result = SDL_AppIterate(appstate);\n"
                  "        std::this_thread::sleep_for(std::chrono::milliseconds(16));\n"
                  "    }\n\n"
                  "    if (appstate != nullptr) {\n"
                  "        SDL_AppQuit(appstate, result);\n"
                  "    }\n\n"
                  "    return (result == SDL_APP_SUCCESS) ? 0 : 1;\n"
                  "}\n\n"
                  "#endif\n"
              )
              text += native_main

          path.write_text(text)
          print("yuzu.cpp patched cleanly with ZERO fake stubs.")
          PY

          # --------------------------------------------------------
          # 5.12 强制从 Git 源码构建纯净 SDL3 (根除预编译 OpenSLES)
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import json

          path = Path("cpmfile.json")
          if path.exists():
              data = json.loads(path.read_text())
              pkg = data.get("sdl3")
              if pkg is not None:
                  # 打印原始配置以供诊断
                  print("Original sdl3 package entry:", json.dumps(pkg, indent=2))
                  
                  # 剔除预编译 URL / binary 属性，迫使 CPM 从 Git 构建
                  for key in ["url", "binaries", "download_only", "custom_package_url"]:
                      if key in pkg:
                          del pkg[key]
                          print(f"Removed prebuilt package attribute: {key}")

                  # 绑定官方源码仓库与具体 commit
                  pkg["git_repository"] = "https://github.com/libsdl-org/SDL.git"
                  pkg["git_tag"] = "147a8ee32dbf9ac02f3794964490687b6bbda1bc"
                  pkg["git_shallow"] = True

                  # 传递无头/无音频构建选项
                  pkg["options"] = [
                      "SDL_AUDIO OFF",
                      "SDL_OPENSLES OFF",
                      "SDL_JOYSTICK OFF",
                      "SDL_HAPTIC OFF",
                      "SDL_HIDAPI OFF",
                      "SDL_SENSOR OFF",
                      "SDL_CAMERA OFF",
                      "SDL_POWER OFF",
                      "SDL_DIALOG OFF",
                      "SDL_TRAY OFF",
                      "SDL_OPENGL OFF",
                      "SDL_OPENGLES OFF",
                      "SDL_VIDEO_ANDROID OFF",
                      "SDL_DUMMYVIDEO ON",
                      "SDL_VULKAN ON",
                      "SDL_DISABLE_INSTALL ON",
                  ]
                  path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
                  print("cpmfile.json configured to build SDL3 from source cleanly.")
          PY

          # --------------------------------------------------------
          # 5.13 彻底清理旧的 CPM 预编译缓存
          # --------------------------------------------------------
          rm -rf .cache/cpm || true

          # --------------------------------------------------------
          # 5.14 补齐 C++20 stop_token 头文件
          # --------------------------------------------------------
          for f in src/common/thread_worker.h src/common/polyfill_thread.h src/common/thread.h; do
            if [ -f "$f" ] && ! grep -q '#include <stop_token>' "$f"; then
              sed -i '1i#include <stop_token>' "$f"
            fi
          done

      # ============================================================
      # 6. 配置 CMake (-Wl,--as-needed 确保零框架依赖)
      # ============================================================
      - name: Configure CMake
        shell: bash
        run: |
          set -eux
          rm -rf build

          cmake -S . -B build \
            -GNinja \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_BIONIC_CLI=ON \
            -DENABLE_QT=OFF \
            -DENABLE_QT_TRANSLATION=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DSDL_AUDIO=OFF \
            -DSDL_OPENSLES=OFF \
            -DSDL_VIDEO=ON \
            -DSDL_JOYSTICK=OFF \
            -DSDL_HAPTIC=OFF \
            -DSDL_HIDAPI=OFF \
            -DSDL_SENSOR=OFF \
            -DSDL_CAMERA=OFF \
            -DSDL_POWER=OFF \
            -DSDL_DIALOG=OFF \
            -DSDL_TRAY=OFF \
            -DSDL_DUMMYVIDEO=ON \
            -DSDL_VULKAN=ON \
            -DSDL_OPENGLES=OFF \
            -DSDL_OPENGL=OFF \
            -DENABLE_OPENGL=OFF \
            -DENABLE_CUBEB=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DENABLE_COMPATIBILITY_LIST_DOWNLOAD=OFF \
            -DENABLE_LIBUSB=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_DOWNLOAD_ANDROID_VVL=OFF \
            -DYUZU_DOWNLOAD_TIME_ZONE_DATA=ON \
            -DYUZU_LEGACY=ON \
            -DYUZU_ENABLE_LTO=OFF \
            -DCMAKE_CXX_FLAGS="-fexperimental-library -DYUZU_BIONIC_CLI" \
            -DCMAKE_C_FLAGS="-fexperimental-library -DYUZU_BIONIC_CLI" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -Wl,--as-needed" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld -Wl,--as-needed"

      # ============================================================
      # 7. C++20 stop_token 验证
      # ============================================================
      - name: Verify CXX20 stop_token
        shell: bash
        run: |
          set -eux
          cat > /tmp/test_cpp20.cpp <<'EOF'
          #include <stop_token>
          #include <thread>

          int main() {
              std::stop_source source;
              std::stop_token token = source.get_token();
              std::stop_callback callback(token, []() {});
              (void)callback;
              return 0;
          }
          EOF

          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            --target=aarch64-none-linux-android34 \
            --sysroot="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
            -std=c++20 \
            -fexperimental-library \
            /tmp/test_cpp20.cpp \
            -o /tmp/test_cpp20

          file /tmp/test_cpp20
          echo "C++20 stop_token test passed."

      # ============================================================
      # 8. 编译目标 (原生 Ninja 构建，绝对无 sed 篡改)
      # ============================================================
      - name: Build Eden CLI
        shell: bash
        run: |
          set -eux
          echo "============================================================"
          echo "Building eden-cli directly from CMake rules"
          echo "============================================================"
          ninja -C build -j"$(nproc)" eden-cli

      # ============================================================
      # 9. 严格校验纯净度 (两层校验：DT_NEEDED 依赖 + 未定义符号追踪)
      # ============================================================
      - name: Verify Clean Bionic ELF
        shell: bash
        run: |
          set -eux
          BIN="build/bin/eden-cli"
          test -f "$BIN"

          echo "============================================================"
          echo "LAYER 1: DT_NEEDED DYNAMIC DEPENDENCIES"
          echo "============================================================"
          readelf -d "$BIN"

          for BANNED in OpenSLES mediandk android.so gui.so; do
            if readelf -d "$BIN" | grep -i "$BANNED"; then
              echo "CRITICAL ERROR: Banned dynamic library $BANNED detected in DT_NEEDED!"
              exit 1
            fi
          done

          echo "============================================================"
          echo "LAYER 2: UNDEFINED SYMBOLS SCAN"
          echo "============================================================"
          UNDEF_ANDROID=$("$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -u "$BIN" | grep -E 'ANativeWindow|ASensor|ALooper|AAsset|slCreateEngine|SL_IID' || true)
          if [ -n "$UNDEF_ANDROID" ]; then
            echo "CRITICAL ERROR: Undefined Android Framework symbols detected:"
            echo "$UNDEF_ANDROID"
            exit 1
          fi

          echo "PASS: Binary is 100% PURE Native Bionic ELF with ZERO stubs!"

      # ============================================================
      # 10. 提取交付物
      # ============================================================
      - name: Prepare Runtime Package
        shell: bash
        run: |
          set -eux
          rm -rf output_bin && mkdir -p output_bin
          cp build/bin/eden-cli output_bin/eden-cli

          LIBCXX="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          test -f "$LIBCXX"
          cp "$LIBCXX" output_bin/libc++_shared.so

          ls -lah output_bin
          file output_bin/*

      # ============================================================
      # 11. 打包交付物
      # ============================================================
      - name: Package Eden Bionic ARM64
        shell: bash
        run: |
          set -eux
          tar -czf eden-bionic-arm64.tar.gz -C output_bin .
          ls -lh eden-bionic-arm64.tar.gz

      # ============================================================
      # 12. 上传产物
      # ============================================================
      - name: Upload Eden Bionic ARM64
        uses: actions/upload-artifact@v4
        with:
          name: eden-bionic-arm64
          path: |
            output_bin/
            eden-bionic-arm64.tar.gz
          if-no-files-found: error
