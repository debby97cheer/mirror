name: Build Eden Bionic Native CLI ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-eden-bionic-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        shell: bash
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true

      - name: Checkout Eden
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Host Dependencies
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache glslang-tools nasm libtool python3 pkg-config file jq

      - name: Setup Android NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Export NDK
        run: echo "NDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Patch YUZU_CMD & YUZU_BIONIC_CLI option
        run: |
          sed -i 's/cmake_dependent_option(YUZU_CMD "Compile the yuzu-cmd executable" OFF "NOT ANDROID" OFF)/option(YUZU_CMD "Compile the eden-cli executable" ON)/g' CMakeLists.txt || true
          sed -i 's/cmake_dependent_option(YUZU_CMD "Compile the eden-cli executable" OFF "NOT ANDROID" OFF)/option(YUZU_CMD "Compile the eden-cli executable" ON)/g' CMakeLists.txt || true
          sed -i '/option(YUZU_CMD/a option(YUZU_BIONIC_CLI "Build standalone Android/Bionic CLI" OFF)\nif (YUZU_BIONIC_CLI)\nadd_compile_definitions(YUZU_BIONIC_CLI)\nendif()' CMakeLists.txt

      - name: Clean Architecture Dependencies
        run: |
          python3 -c "
          import pathlib, re

          def safe_patch(filepath, pattern, replacement):
              p = pathlib.Path(filepath)
              if p.exists():
                  text = p.read_text()
                  patched = re.sub(pattern, replacement, text, flags=re.MULTILINE)
                  p.write_text(patched)
                  print(f'Patched: {filepath}')

          # 1. 剔除核心目录下的 mediandk 和 yuzu-android
          safe_patch('src/CMakeLists.txt', r'(if\s*\(\s*ANDROID\s*\)\s*\n\s*add_subdirectory\(\s*android/app/src/main/jni\s*\)\s*\n\s*target_include_directories\(\s*yuzu-android\s+PRIVATE\s+android/app/src/main\s*\)\s*\n\s*endif\s*\(\s*\))', '# Disabled yuzu-android block for BIONIC_CLI')
          safe_patch('src/core/CMakeLists.txt', r'target_link_libraries\(\s*core\s+PRIVATE\s+mediandk\s*\)', '# Mediandk stripped')

          # 2. 剔除 -landroid 的链接
          safe_patch('src/input_common/CMakeLists.txt', r'target_link_libraries\(\s*input_common\s+PRIVATE\s+android\s*\)', '# libandroid stripped')
          safe_patch('src/common/CMakeLists.txt', r'target_link_libraries\(\s*common\s+PRIVATE\s+android\s*\)', '# libandroid stripped')

          # 3. 剔除 common 库下所有的 Android 专属源码
          safe_patch('src/common/CMakeLists.txt', r'PUBLIC\s+fs/fs_android\.cpp', '# fs_android.cpp stripped')
          safe_patch('src/common/CMakeLists.txt', r'android/android_common\.cpp', '# android_common.cpp stripped')
          safe_patch('src/common/CMakeLists.txt', r'android/id_cache\.cpp', '# id_cache.cpp stripped')
          safe_patch('src/common/CMakeLists.txt', r'android/applets/software_keyboard\.cpp', '# android software_keyboard.cpp stripped')
          safe_patch('src/common/CMakeLists.txt', r'android/applets/web_browser\.cpp', '# android web_browser.cpp stripped')
          safe_patch('src/common/CMakeLists.txt', r'android/multiplayer/multiplayer\.cpp', '# android multiplayer.cpp stripped')

          # 4. 把纯数据结构 android_settings.cpp 加入 yuzu-cmd 编译
          p = pathlib.Path('src/yuzu_cmd/CMakeLists.txt')
          if p.exists():
              text = p.read_text()
              if 'android_settings.cpp' not in text:
                  text = text.replace('add_executable(yuzu-cmd\n', 'add_executable(yuzu-cmd\n    ../android/app/src/main/jni/android_settings.cpp\n')
                  p.write_text(text)
                  print('Injected android_settings.cpp into yuzu-cmd.')

          # 5. 屏蔽设备电量的 JNI 调用，走无电池回退
          safe_patch('src/common/device_power_state.cpp', r'#elif\s+defined\(__ANDROID__\)', '#elif defined(__ANDROID__) && !defined(YUZU_BIONIC_CLI)')

          # 6. 屏蔽输入系统中的 JNI Vibration 驱动
          safe_patch('src/input_common/main.cpp', r'#if\s*defined\(__ANDROID__\)', '#if defined(__ANDROID__) && !defined(YUZU_BIONIC_CLI)')
          safe_patch('src/input_common/main.h', r'#if(def\s+__ANDROID__|defined\(__ANDROID__\))', '#if defined(__ANDROID__) && !defined(YUZU_BIONIC_CLI)')

          # 7. 修改 SDL3 配置文件，清理旧包
          import json
          cpm = pathlib.Path('cpmfile.json')
          if cpm.exists():
              data = json.loads(cpm.read_text())
              pkg = data.get('sdl3')
              if pkg:
                  for k in ['url', 'binaries', 'download_only', 'custom_package_url']:
                      if k in pkg:
                          del pkg[k]
                  cpm.write_text(json.dumps(data, indent=2) + '\n')
          "
          rm -rf .cache/cpm/sdl3 || true

      - name: Inject Telemetry and Safe Null Renderer
        run: |
          python3 -c "
          import pathlib, re

          # 规范化 Null Window 派生类：必须保留合法的 DummyContext，并且去除无效的 render_window 隐藏
          p_null_cpp = pathlib.Path('src/yuzu_cmd/emu_window/emu_window_sdl3_null.cpp')
          if p_null_cpp.exists():
              clean_null_impl = '''// SPDX-FileCopyrightText: 2026 Eden Emulator Project
          #include <iostream>
          #include <SDL3/SDL.h>
          #include \"yuzu_cmd/emu_window/emu_window_sdl3_null.h\"

          EmuWindow_SDL3_Null::EmuWindow_SDL3_Null(InputCommon::InputSubsystem* input_subsystem, Core::System& system, bool fullscreen)
              : EmuWindow_SDL3{input_subsystem, system} {
              is_open = true;
              std::cout << \"[BIONIC] EmuWindow_SDL3_Null: Ready with valid DummyContext.\" << std::endl;
          }
          EmuWindow_SDL3_Null::~EmuWindow_SDL3_Null() = default;

          std::unique_ptr<Core::Frontend::GraphicsContext> EmuWindow_SDL3_Null::CreateSharedContext() const {
              return std::make_unique<DummyContext>();
          }
          '''
              p_null_cpp.write_text(clean_null_impl)

          # 短路基类的物理窗口
          safe_patch = lambda p, r, rep: pathlib.Path(p).write_text(re.sub(r, rep, pathlib.Path(p).read_text()))
          safe_patch('src/yuzu_cmd/emu_window/emu_window_sdl3.cpp', r'(input_subsystem->Initialize\(\)\s*;\s*\n)', '\\1#ifdef YUZU_BIONIC_CLI\n    std::cout << \"[BIONIC] Headless mode - no physical window\" << std::endl;\n    is_open = true;\n    render_window = nullptr;\n    return;\n#endif\n')

          # 为 yuzu.cpp 加上启动和模拟循环遥测
          yuzu_cpp = pathlib.Path('src/yuzu_cmd/yuzu.cpp')
          text = yuzu_cpp.read_text()
          text = text.replace('state->system.Initialize();', 'std::cout << \"[BIONIC] Step 1: Init System...\" << std::endl;\n    state->system.Initialize();')
          text = text.replace('state->system.ApplySettings();', 'std::cout << \"[BIONIC] Step 2: Input & Settings...\" << std::endl;\n    state->system.ApplySettings();')
          text = text.replace('state->system.SetContentProvider', 'std::cout << \"[BIONIC] Step 3: VFS Ready!\" << std::endl;\n    state->system.SetContentProvider')
          text = text.replace('const Core::SystemResultStatus load_result = state->system.Load(', 'std::cout << \"[BIONIC] Step 4: Loading ROM...\" << std::endl;\n    const Core::SystemResultStatus load_result = state->system.Load(')
          yuzu_cpp.write_text(text)
          "

      - name: Configure CMake (BUNDLED SDL3 OFF)
        run: |
          rm -rf build
          cmake -S . -B build -GNinja \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DYUZU_CMD=ON \
            -DYUZU_BIONIC_CLI=ON \
            -DYUZU_USE_BUNDLED_SDL3=OFF \
            -DENABLE_QT=OFF \
            -DENABLE_QT_TRANSLATION=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DENABLE_COMPATIBILITY_LIST_DOWNLOAD=OFF \
            -DENABLE_LIBUSB=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_DOWNLOAD_ANDROID_VVL=OFF \
            -DSDL_AUDIO=OFF \
            -DSDL_OPENSLES=OFF \
            -DSDL_VIDEO_ANDROID=OFF \
            -DSDL_DUMMYVIDEO=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -Wl,--as-needed" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld -Wl,--as-needed"

      - name: Build Eden CLI
        run: ninja -C build -j"$(nproc)" eden-cli

      - name: Validate Binary Cleanliness
        run: |
          BIN="build/bin/eden-cli"
          echo "Checking ELF Dynamic Deps:"
          readelf -d "$BIN"
          
          # 发现任何一个 Android 假库，立刻熔断！
          for BANNED in OpenSLES mediandk android.so gui.so; do
            if readelf -d "$BIN" | grep -i "$BANNED"; then
              echo "CRITICAL ERROR: Banned dynamic library $BANNED detected!"
              exit 1
            fi
          done

      - name: Package Eden Bionic ARM64
        run: |
          rm -rf output_bin && mkdir -p output_bin
          cp build/bin/eden-cli output_bin/eden-cli
          cp "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" output_bin/libc++_shared.so
          tar -czf eden-bionic-arm64.tar.gz -C output_bin .

      - name: Upload Eden Bionic ARM64
        uses: actions/upload-artifact@v4
        with:
          name: eden-bionic-arm64
          path: eden-bionic-arm64.tar.gz
