name: Build Eden Bionic Native CLI ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-eden-bionic-arm64:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. 清理 Runner 磁盘空间
      # ============================================================
      - name: Free Disk Space
        shell: bash
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf "/usr/local/share/boost" || true
          df -h

      # ============================================================
      # 2. 拉取源码与子模块
      # ============================================================
      - name: Checkout Eden Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # 3. 安装构建依赖
      # ============================================================
      - name: Install Host Dependencies
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            ccache \
            glslang-tools \
            nasm \
            libtool \
            python3 \
            pkg-config

      # ============================================================
      # 4. 配置 Android NDK r27c
      # ============================================================
      - name: Setup Android NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Export Global NDK Environment
        shell: bash
        run: |
          echo "NDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      # ============================================================
      # 5. 精准手术：彻底解耦 SDL_MAIN 并植入 Native Bionic Main
      # ============================================================
      - name: Patch Eden Core and Yuzu CMD
        shell: bash
        run: |
          set -eux

          echo "=== 1. 解除 YUZU_CMD 的 Android 平台限制 ==="
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("CMakeLists.txt")
          text = path.read_text()

          pattern = re.compile(
              r'cmake_dependent_option\(\s*YUZU_CMD\s+"[^"]*"\s+[^)]*?"NOT ANDROID"\s+OFF\s*\)',
              re.MULTILINE
          )
          if pattern.search(text):
              text = pattern.sub('option(YUZU_CMD "Compile the eden-cli executable" ON)', text, count=1)
          if 'option(YUZU_BIONIC_CLI' not in text:
              marker = 'option(YUZU_CMD "Compile the eden-cli executable" ON)'
              if marker in text:
                  text = text.replace(marker, marker + '\noption(YUZU_BIONIC_CLI "Build standalone Android/Bionic CLI" ON)', 1)

          path.write_text(text)
          PY

          echo "=== 2. 排除 yuzu-android JNI 编译子目录 ==="
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/CMakeLists.txt")
          text = path.read_text()

          pattern = re.compile(
              r'if\s*\(\s*ANDROID\s*\)\s*add_subdirectory\(\s*android/app/src/main/jni\s*\)\s*target_include_directories\(\s*yuzu-android\s+PRIVATE\s+android/app/src/main\s*\)\s*endif\s*\(\s*\)',
              re.MULTILINE
          )
          replacement = """if (ANDROID AND NOT YUZU_BIONIC_CLI)
              add_subdirectory(android/app/src/main/jni)
              target_include_directories(yuzu-android PRIVATE android/app/src/main)
          endif()"""

          if pattern.search(text):
              text = pattern.sub(replacement, text, count=1)
          path.write_text(text)
          PY

          echo "=== 3. 补齐 <stop_token> 头文件 ==="
          for f in src/common/thread_worker.h src/common/polyfill_thread.h src/common/thread.h; do
            if [ -f "$f" ] && ! grep -q '#include <stop_token>' "$f"; then
              sed -i '1i #include <stop_token>' "$f"
            fi
          done

          echo "=== 4. 向 yuzu_cmd 显式注入编译宏与链接规则 ==="
          python3 <<'PY'
          from pathlib import Path

          p = Path("src/yuzu_cmd/CMakeLists.txt")
          content = p.read_text()
          if "target_compile_definitions(yuzu-cmd PRIVATE YUZU_BIONIC_CLI)" not in content:
              content += "\ntarget_compile_definitions(yuzu-cmd PRIVATE YUZU_BIONIC_CLI)\n"
          if "target_link_libraries(yuzu-cmd PRIVATE log)" not in content:
              content += "\ntarget_link_libraries(yuzu-cmd PRIVATE log)\n"
          p.write_text(content)
          PY

          echo "=== 5. 单点深度重构 yuzu.cpp ==="
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/yuzu_cmd/yuzu.cpp")
          text = path.read_text()

          # 5.1 彻底清除 SDL_MAIN_USE_CALLBACKS 与现有 SDL_main.h 引用
          text = re.sub(r'^[ \t]*#\s*define\s+SDL_MAIN_USE_CALLBACKS\b.*$', '', text, flags=re.MULTILINE)
          text = re.sub(r'^[ \t]*#\s*include\s+<SDL3/SDL_main\.h>.*$', '', text, flags=re.MULTILINE)

          # 5.2 在文件最头部注入 SDL_MAIN_HANDLED、闭环桩及 AndroidSettings
          header_injection = """// [EDEN_BIONIC_CLI_CORE_HEADER]
          #ifndef SDL_MAIN_HANDLED
          #define SDL_MAIN_HANDLED 1
          #endif
          #include <SDL3/SDL.h>
          #include <SDL3/SDL_main.h>
          #include <unistd.h>
          #include <atomic>
          #include <cstdint>
          #include <cstddef>
          #include <sys/types.h>
          #include "common/settings.h"

          #ifdef __ANDROID__
          namespace AndroidSettings {
          Settings::Values values{};
          }
          std::atomic<int> g_battery_percentage{100};
          std::atomic<bool> g_is_charging{false};
          std::atomic<bool> g_has_battery{true};

          extern "C" {
          struct SLInterfaceID_ { uint32_t a; uint16_t b, c, d; uint8_t e[6]; };
          static const struct SLInterfaceID_ s_dummy = {0, 0, 0, 0, {0}};
          const struct SLInterfaceID_* const SL_IID_ENGINE = &s_dummy;
          const struct SLInterfaceID_* const SL_IID_VOLUME = &s_dummy;
          const struct SLInterfaceID_* const SL_IID_ANDROIDSIMPLEBUFFERQUEUE = &s_dummy;
          const struct SLInterfaceID_* const SL_IID_RECORD = &s_dummy;
          const struct SLInterfaceID_* const SL_IID_PLAY = &s_dummy;
          int slCreateEngine(void*, uint32_t, const void*, uint32_t, const void*, const void*) { return 1; }

          int32_t ANativeWindow_setBuffersGeometry(void*, int32_t, int32_t, int32_t) { return 0; }
          int32_t ANativeWindow_getWidth(void*) { return 1800; }
          int32_t ANativeWindow_getHeight(void*) { return 2880; }
          int32_t ANativeWindow_getFormat(void*) { return 1; }
          void* ANativeWindow_fromSurface(void*, void*) { return nullptr; }
          void ANativeWindow_acquire(void*) {}
          void ANativeWindow_release(void*) {}
          int32_t ANativeWindow_lock(void*, void*, void*) { return -1; }
          int32_t ANativeWindow_unlockAndPost(void*) { return 0; }

          void* ASensorManager_getInstance() { return nullptr; }
          void* ASensorManager_getInstanceForPackage(const char*) { return nullptr; }
          int ASensorManager_getSensorList(void*, void*) { return 0; }
          const char* ASensor_getName(void*) { return ""; }
          int ASensor_getType(void*) { return -1; }
          int ASensor_getMinDelay(void*) { return 0; }
          void* ASensorManager_createEventQueue(void*, void*, int, void*, void*) { return nullptr; }
          int ASensorManager_destroyEventQueue(void*, void*) { return 0; }
          int ASensorEventQueue_enableSensor(void*, void*) { return -1; }
          int ASensorEventQueue_disableSensor(void*, void*) { return 0; }
          int ASensorEventQueue_setEventRate(void*, void*, int32_t) { return 0; }
          ssize_t ASensorEventQueue_getEvents(void*, void*, size_t) { return 0; }

          void* ALooper_prepare(int) { return nullptr; }
          int ALooper_pollOnce(int, int*, int*, void**) { return -1; }
          void ALooper_wake(void*) {}
          void ALooper_acquire(void*) {}
          void ALooper_release(void*) {}

          void* AAssetManager_fromJava(void*, void*) { return nullptr; }
          void* AAssetManager_open(void*, const char*, int) { return nullptr; }
          int AAsset_read(void*, void*, size_t) { return 0; }
          int64_t AAsset_seek64(void*, int64_t, int) { return -1; }
          int64_t AAsset_getLength64(void*) { return 0; }
          void AAsset_close(void*) {}
          }
          #endif
          """
          text = header_injection + "\n" + text

          # 5.3 扩展 getopt_long 短参数以支持 '-n'
          text = re.sub(
              r'getopt_long\(([^,]+,[^,]+,)"([^"]*)"',
              lambda m: f'getopt_long({m.group(1)}"{m.group(2) if "n" in m.group(2) else m.group(2) + "n"}"',
              text
          )

          # 5.4 修复 SDL_AppInit 成功返回值为 SDL_APP_CONTINUE
          if "void(state->system.Run());" in text:
              idx = text.find("void(state->system.Run());")
              ret_idx = text.find("return SDL_APP_SUCCESS;", idx)
              if ret_idx != -1 and ret_idx - idx < 200:
                  text = text[:ret_idx] + "return SDL_APP_CONTINUE;" + text[ret_idx + len("return SDL_APP_SUCCESS;"):]
              else:
                  text = text.replace("void(state->system.Run());", "void(state->system.Run());\n    return SDL_APP_CONTINUE;", 1)

          # 5.5 尾部注入原生 main()，并在定义前强制 #undef main 消除任何宏展开
          main_impl = """
          #ifdef main
          #undef main
          #endif

          extern "C" int main(int argc, char** argv) {
              if (chdir("/data/eden") != 0) {
                  // 工作目录容错
              }

              // 明确通知 SDL3 运行时主入口已就绪
              SDL_SetMainReady();

              void* appstate = nullptr;
              SDL_AppResult result = SDL_AppInit(&appstate, argc, argv);

              if (result != SDL_APP_CONTINUE) {
                  if (appstate != nullptr) {
                      SDL_AppQuit(appstate, result);
                  }
                  return (result == SDL_APP_SUCCESS) ? 0 : 1;
              }

              while (result == SDL_APP_CONTINUE) {
                  SDL_Event event;
                  while (SDL_PollEvent(&event)) {
                      result = SDL_AppEvent(appstate, &event);
                      if (result != SDL_APP_CONTINUE) {
                          break;
                      }
                  }
                  if (result != SDL_APP_CONTINUE) {
                      break;
                  }
                  result = SDL_AppIterate(appstate);
              }

              if (appstate != nullptr) {
                  SDL_AppQuit(appstate, result);
              }
              return (result == SDL_APP_SUCCESS) ? 0 : 1;
          }
          """
          text += main_impl

          # 硬性断言检测
          assert "SDL_MAIN_USE_CALLBACKS" not in text, "CRITICAL: SDL_MAIN_USE_CALLBACKS still exists!"
          assert 'extern "C" int main(' in text, "CRITICAL: main() function missing from yuzu.cpp!"

          path.write_text(text)
          print("SUCCESS: yuzu.cpp has been completely overhauled with a pure native main()!")
          PY

      # ============================================================
      # 6. 配置 CMake
      # ============================================================
      - name: Configure CMake
        shell: bash
        run: |
          set -eux
          rm -rf build

          cmake -S . -B build \
            -GNinja \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_BIONIC_CLI=ON \
            -DENABLE_QT=OFF \
            -DENABLE_QT_TRANSLATION=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DENABLE_OPENGL=OFF \
            -DENABLE_CUBEB=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DENABLE_LIBUSB=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_DOWNLOAD_ANDROID_VVL=OFF \
            -DYUZU_DOWNLOAD_TIME_ZONE_DATA=ON \
            -DYUZU_LEGACY=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -llog" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_CXX_FLAGS="-fexperimental-library -DYUZU_BIONIC_CLI" \
            -DCMAKE_C_FLAGS="-fexperimental-library -DYUZU_BIONIC_CLI"

      # ============================================================
      # 7. 从 Ninja 链接规则中剥离外部框架库
      # ============================================================
      - name: Strip Framework Linker Flags From Ninja
        shell: bash
        run: |
          set -eux
          sed -i -E 's|[^ ]*libmediandk\.so||g' build/build.ninja
          sed -i -E 's|-lmediandk\b||g' build/build.ninja
          sed -i -E 's|-landroid\b||g' build/build.ninja
          sed -i -E 's|-lOpenSLES\b||g' build/build.ninja

      # ============================================================
      # 8. 编译目标
      # ============================================================
      - name: Build Eden CLI Target
        shell: bash
        run: |
          set -eux
          TARGET=""
          if ninja -C build -t targets all | grep -q 'bin/eden-cli:'; then
              TARGET="eden-cli"
          elif ninja -C build -t targets all | grep -q 'bin/yuzu-cmd:'; then
              TARGET="yuzu-cmd"
          elif ninja -C build -t targets all | grep -q 'eden-cli'; then
              TARGET="eden-cli"
          elif ninja -C build -t targets all | grep -q 'yuzu-cmd'; then
              TARGET="yuzu-cmd"
          fi

          if [ -n "$TARGET" ]; then
              ninja -C build -j"$(nproc)" "$TARGET"
          else
              ninja -C build -j"$(nproc)"
          fi

      # ============================================================
      # 9. 校验依赖纯净度
      # ============================================================
      - name: Verify Clean Bionic ELF
        shell: bash
        run: |
          set -eux
          BIN=$(find build/bin -maxdepth 1 -type f \( -name "eden-cli" -o -name "yuzu-cmd" \) | head -n 1)

          echo "============================================================"
          echo "最终 ELF 动态依赖项 (DT_NEEDED)"
          echo "============================================================"
          readelf -d "$BIN"

          for BANNED in OpenSLES mediandk android.so gui.so; do
            if readelf -d "$BIN" | grep -i "$BANNED"; then
              echo "CRITICAL ERROR: Banned library $BANNED still detected!"
              exit 1
            fi
          done

          echo "PASS: Binary is 100% PURE Native Bionic ELF!"

      # ============================================================
      # 10. 提取交付物并归档
      # ============================================================
      - name: Package Runtime Artifacts
        shell: bash
        run: |
          set -eux
          rm -rf output_bin && mkdir -p output_bin

          BIN=$(find build/bin -maxdepth 1 -type f \( -name "eden-cli" -o -name "yuzu-cmd" \) | head -n 1)
          cp "$BIN" output_bin/eden-cli
          cp "$BIN" output_bin/yuzu-cmd

          LIBCXX="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          cp "$LIBCXX" output_bin/libc++_shared.so

          tar -czf eden-bionic-arm64.tar.gz -C output_bin .

      # ============================================================
      # 11. 上传构建产物
      # ============================================================
      - name: Upload Eden Bionic ARM64
        uses: actions/upload-artifact@v4
        with:
          name: eden-bionic-arm64
          path: |
            output_bin/
            eden-bionic-arm64.tar.gz
          if-no-files-found: error
