name: Build Eden Bionic Native CLI ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-eden-bionic-arm64:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Free disk space
      # ============================================================
      - name: Free Disk Space
        shell: bash
        run: |
          set -eux

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true

          df -h

      # ============================================================
      # 2. Checkout
      # ============================================================
      - name: Checkout Eden
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # 3. Host dependencies
      # ============================================================
      - name: Install Host Dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            ccache \
            glslang-tools \
            nasm \
            libtool \
            python3 \
            pkg-config

          cmake --version
          ninja --version
          python3 --version

      # ============================================================
      # 4. Android NDK r27c
      # ============================================================
      - name: Setup Android NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Export NDK Environment
        shell: bash
        run: |
          echo "NDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      # ============================================================
      # 5. Configure source tree
      # ============================================================
      - name: Configure Eden Bionic CLI Source
        shell: bash
        run: |
          set -eux

          echo "============================================================"
          echo "Configuring Eden for Android/Bionic Native CLI"
          echo "============================================================"

          # --------------------------------------------------------
          # Enable YUZU_CMD on Android
          # --------------------------------------------------------

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("CMakeLists.txt")
          text = path.read_text()

          pattern = re.compile(
              r'cmake_dependent_option\(\s*'
              r'YUZU_CMD\s+'
              r'"[^"]*"\s+'
              r'[^)]*?'
              r'"NOT ANDROID"\s+'
              r'OFF\s*\)',
              re.MULTILINE
          )

          match = pattern.search(text)

          if match:
              replacement = (
                  'option(YUZU_CMD '
                  '"Compile the eden-cli executable" ON)'
              )

              text = (
                  text[:match.start()]
                  + replacement
                  + text[match.end():]
              )

              print("YUZU_CMD Android restriction removed.")

          elif (
              'option(YUZU_CMD "Compile the eden-cli executable" ON)'
              not in text
          ):
              raise SystemExit(
                  "ERROR: Could not find YUZU_CMD configuration."
              )

          marker = (
              'option(YUZU_CMD '
              '"Compile the eden-cli executable" ON)'
          )

          if "option(YUZU_BIONIC_CLI" not in text:
              text = text.replace(
                  marker,
                  marker
                  + '\n'
                  + 'option(YUZU_BIONIC_CLI '
                  '"Build standalone Android/Bionic CLI" OFF)',
                  1
              )

          path.write_text(text)
          PY

          # --------------------------------------------------------
          # Disable Android JNI application
          # --------------------------------------------------------

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/CMakeLists.txt")
          text = path.read_text()

          old = """if (ANDROID)
              add_subdirectory(android/app/src/main/jni)
              target_include_directories(yuzu-android PRIVATE android/app/src/main)
          endif()"""

          new = """if (ANDROID AND NOT YUZU_BIONIC_CLI)
              add_subdirectory(android/app/src/main/jni)
              target_include_directories(yuzu-android PRIVATE android/app/src/main)
          endif()"""

          if old in text:
              text = text.replace(old, new, 1)
              print("Android JNI target disabled.")
          elif new in text:
              print("Android JNI guard already patched.")
          else:
              raise SystemExit(
                  "ERROR: Android JNI block not found."
              )

          path.write_text(text)
          PY

          # --------------------------------------------------------
          # Add global Bionic macro
          # --------------------------------------------------------

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/CMakeLists.txt")
          text = path.read_text()

          definition = """if (YUZU_BIONIC_CLI)
              add_compile_definitions(YUZU_BIONIC_CLI=1)
          endif()
          """

          if "add_compile_definitions(YUZU_BIONIC_CLI=1)" not in text:
              text = definition + "\n" + text

          path.write_text(text)
          PY

          # --------------------------------------------------------
          # C++20 header safety
          # --------------------------------------------------------

          if [ -f src/common/thread_worker.h ]; then
            if ! grep -q '#include <stop_token>' src/common/thread_worker.h; then
              sed -i '1i#include <stop_token>' src/common/thread_worker.h
            fi
          fi

          # --------------------------------------------------------
          # Do NOT modify Android input driver.
          #
          # Instead disable registration of the Android input engine
          # at the subsystem level.
          # --------------------------------------------------------

          python3 - <<'PY'
          from pathlib import Path

          targets = [
              Path("src/input_common/main.cpp"),
              Path("src/input_common/main.h"),
          ]

          for path in targets:
              if not path.exists():
                  raise SystemExit(f"ERROR: {path} not found")

              text = path.read_text()

              text = text.replace(
                  "#ifdef __ANDROID__",
                  "#if defined(__ANDROID__) && !defined(YUZU_BIONIC_CLI)"
              )

              path.write_text(text)

              print(f"Patched: {path}")
          PY

          # --------------------------------------------------------
          # Patch yuzu.cpp
          # --------------------------------------------------------

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/yuzu_cmd/yuzu.cpp")
          text = path.read_text()

          # --------------------------------------------------------
          # SDL main configuration
          # --------------------------------------------------------

          old = """#define SDL_MAIN_USE_CALLBACKS 1
          #include <SDL3/SDL_main.h>"""

          new = """#ifdef YUZU_BIONIC_CLI
          #define SDL_MAIN_HANDLED 1
          #else
          #define SDL_MAIN_USE_CALLBACKS 1
          #endif
          #include <SDL3/SDL_main.h>"""

          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit(
                  "ERROR: SDL main declaration not found."
              )

          # --------------------------------------------------------
          # Fix getopt string.
          #
          # Existing options:
          #
          # g: game
          # f  fullscreen
          # h  help
          # v  version
          # c: config
          # m: multiplayer
          # p:: program
          # u: user
          # d: debug
          # i: input profile
          # n  null render
          # s  singlecore
          # x: filter
          # --------------------------------------------------------

          old_options = (
              'getopt_long(argc, argv, '
              '"g:fhvcip::c:u:d:",'
          )

          new_options = (
              'getopt_long(argc, argv, '
              '"g:fhvnc:m:p::u:d:i:nsx:",'
          )

          if old_options in text:
              text = text.replace(
                  old_options,
                  new_options,
                  1
              )

          # --------------------------------------------------------
          # Fix long option argument declarations.
          # --------------------------------------------------------

          text = text.replace(
              '{"input-profile", no_argument, 0, \'i\'},',
              '{"input-profile", required_argument, 0, \'i\'},'
          )

          text = text.replace(
              '{"filter", no_argument, 0, \'x\'},',
              '{"filter", required_argument, 0, \'x\'},'
          )

          # --------------------------------------------------------
          # Bionic AppInit must remain alive.
          # --------------------------------------------------------

          old_return = """    void(state->system.Run());
          if (state->system.DebuggerEnabled())
              state->system.InitializeDebugger();
          return SDL_APP_SUCCESS;
          }"""

          new_return = """    void(state->system.Run());
          if (state->system.DebuggerEnabled())
              state->system.InitializeDebugger();

          #ifdef YUZU_BIONIC_CLI
              return SDL_APP_CONTINUE;
          #else
              return SDL_APP_SUCCESS;
          #endif
          }"""

          if old_return in text:
              text = text.replace(
                  old_return,
                  new_return,
                  1
              )

          # --------------------------------------------------------
          # Bionic event behavior.
          # --------------------------------------------------------

          old_event = """extern "C" SDL_AppResult SDL_AppEvent(void *appstate, SDL_Event *event) {
              SdlState *state = (SdlState *)appstate;
              state->emu_window->OnEvent(*event);
              return SDL_APP_SUCCESS;
          }"""

          new_event = """extern "C" SDL_AppResult SDL_AppEvent(void *appstate, SDL_Event *event) {
              SdlState *state = (SdlState *)appstate;
              state->emu_window->OnEvent(*event);

          #ifdef YUZU_BIONIC_CLI
              return state->emu_window->IsOpen()
                         ? SDL_APP_CONTINUE
                         : SDL_APP_SUCCESS;
          #else
              return SDL_APP_SUCCESS;
          #endif
          }"""

          if old_event in text:
              text = text.replace(
                  old_event,
                  new_event,
                  1
              )

          # --------------------------------------------------------
          # Add native Bionic main once.
          # --------------------------------------------------------

          if "extern \"C\" int main(int argc, char** argv)" not in text:

              native_main = r'''

          #ifdef YUZU_BIONIC_CLI

          int main(int argc, char** argv) {

              // Recovery processes normally start in "/".
              // Eden uses relative directories such as config/ and keys/.
              if (chdir("/data/eden") != 0) {
                  std::cerr
                      << "Warning: unable to chdir to /data/eden"
                      << std::endl;
              }

              SDL_SetMainReady();

              // When -n / --null-render is requested,
              // use SDL's dummy video driver.
              for (int i = 1; i < argc; ++i) {

                  if (std::strcmp(argv[i], "-n") == 0 ||
                      std::strcmp(argv[i], "--null-render") == 0) {

                      SDL_SetHint(
                          SDL_HINT_VIDEO_DRIVER,
                          "dummy"
                      );

                      break;
                  }
              }

              void* appstate = nullptr;

              SDL_AppResult result =
                  SDL_AppInit(
                      &appstate,
                      argc,
                      argv
                  );

              if (result != SDL_APP_CONTINUE) {

                  if (appstate != nullptr) {
                      SDL_AppQuit(
                          appstate,
                          result
                      );
                  }

                  return result == SDL_APP_SUCCESS ? 0 : 0;
              }

              while (result == SDL_APP_CONTINUE) {

                  SDL_Event event{};

                  while (SDL_PollEvent(&event)) {

                      result = SDL_AppEvent(
                          appstate,
                          &event
                      );

                      if (result != SDL_APP_CONTINUE) {
                          break;
                      }
                  }

                  if (result != SDL_APP_CONTINUE) {
                      break;
                  }

                  result = SDL_AppIterate(
                      appstate
                  );
              }

              if (appstate != nullptr) {
                  SDL_AppQuit(
                      appstate,
                      result
                  );
              }

              return result == SDL_APP_SUCCESS ? 0 : 1;
          }

          #endif
          '''

              text += native_main

          path.write_text(text)

          print("yuzu.cpp patch completed.")
          PY

          # --------------------------------------------------------
          # Patch SDL3 window initialization.
          # --------------------------------------------------------

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "src/yuzu_cmd/emu_window/emu_window_sdl3.cpp"
          )

          text = path.read_text()

          old = """    if (!SDL_Init(SDL_INIT_VIDEO | SDL_INIT_JOYSTICK | SDL_INIT_GAMEPAD)) {
              LOG_CRITICAL(Frontend, "Failed to initialize SDL3: {}, Exiting...", SDL_GetError());
              exit(1);
          }"""

          new = """#ifdef YUZU_BIONIC_CLI
              if (!SDL_Init(SDL_INIT_VIDEO)) {
                  LOG_CRITICAL(
                      Frontend,
                      "Failed to initialize SDL3 Video: {}, Exiting...",
                      SDL_GetError()
                  );
                  exit(1);
              }
          #else
              if (!SDL_Init(SDL_INIT_VIDEO | SDL_INIT_JOYSTICK | SDL_INIT_GAMEPAD)) {
                  LOG_CRITICAL(
                      Frontend,
                      "Failed to initialize SDL3: {}, Exiting...",
                      SDL_GetError()
                  );
                  exit(1);
              }
          #endif"""

          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit(
                  "ERROR: SDL_Init block not found."
              )

          path.write_text(text)

          print("SDL3 initialization patched.")
          PY

      # ============================================================
      # 6. Configure
      # ============================================================
      - name: Configure CMake
        shell: bash
        run: |
          set -eux

          rm -rf build

          cmake -S . -B build \
            -GNinja \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_BIONIC_CLI=ON \
            -DENABLE_QT=OFF \
            -DENABLE_QT_TRANSLATION=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DSDL_AUDIO=OFF \
            -DSDL_JOYSTICK=OFF \
            -DSDL_HAPTIC=OFF \
            -DSDL_SENSOR=OFF \
            -DSDL_CAMERA=OFF \
            -DSDL_POWER=OFF \
            -DSDL_DIALOG=OFF \
            -DSDL_TRAY=OFF \
            -DSDL_NOTIFICATION=OFF \
            -DSDL_DUMMYVIDEO=ON \
            -DSDL_VULKAN=ON \
            -DSDL_OPENGLES=OFF \
            -DENABLE_OPENGL=OFF \
            -DENABLE_CUBEB=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DENABLE_COMPATIBILITY_LIST_DOWNLOAD=OFF \
            -DENABLE_LIBUSB=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_DOWNLOAD_ANDROID_VVL=OFF \
            -DYUZU_DOWNLOAD_TIME_ZONE_DATA=ON \
            -DYUZU_LEGACY=ON \
            -DYUZU_ENABLE_LTO=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld"

      # ============================================================
      # 7. Verify configuration
      # ============================================================
      - name: Verify Build Configuration
        shell: bash
        run: |
          set -eux

          echo "===== YUZU_BIONIC_CLI ====="
          grep '^YUZU_BIONIC_CLI:' build/CMakeCache.txt || true

          echo
          echo "===== YUZU_CMD ====="
          grep '^YUZU_CMD:' build/CMakeCache.txt || true

          echo
          echo "===== CXX STANDARD ====="
          grep 'CMAKE_CXX_STANDARD' build/CMakeCache.txt || true

          echo
          echo "===== SDL ====="
          grep -E \
            '^SDL_(AUDIO|JOYSTICK|HAPTIC|SENSOR|CAMERA|POWER|DUMMYVIDEO|VULKAN|OPENGLES):' \
            build/CMakeCache.txt \
            || true

          echo
          echo "===== Android JNI target ====="

          if grep -R \
              'yuzu-android' \
              build/build.ninja \
              2>/dev/null; then

              echo "WARNING: yuzu-android references found."

          else

              echo "OK: yuzu-android target absent."

          fi

      # ============================================================
      # 8. C++20 smoke test
      # ============================================================
      - name: Test CXX20 stop_token
        shell: bash
        run: |
          set -eux

          cat > /tmp/test_cpp20.cpp <<'EOF'
          #include <stop_token>
          #include <thread>

          int main() {
              std::stop_source source;
              std::stop_token token = source.get_token();

              std::stop_callback callback(
                  token,
                  []() {}
              );

              (void)callback;

              return 0;
          }
          EOF

          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            --target=aarch64-none-linux-android34 \
            --sysroot="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
            -std=c++20 \
            /tmp/test_cpp20.cpp \
            -o /tmp/test_cpp20

          file /tmp/test_cpp20

      # ============================================================
      # 9. Build
      # ============================================================
      - name: Build Eden CLI
        shell: bash
        run: |
          set -eux

          ninja -C build -j"$(nproc)" eden-cli

      # ============================================================
      # 10. Verify ELF
      # ============================================================
      - name: Verify Eden ARM64 ELF
        shell: bash
        run: |
          set -eux

          BIN="build/bin/eden-cli"

          test -f "$BIN"

          echo "===== FILE ====="
          file "$BIN"

          echo
          echo "===== ELF HEADER ====="
          readelf -h "$BIN"

          echo
          echo "===== INTERPRETER ====="
          readelf -l "$BIN" \
            | grep -A2 INTERP \
            || true

          echo
          echo "===== MAIN ====="

          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            -C "$BIN" \
            | grep -E '(^| )main$'

          echo
          echo "===== DYNAMIC DEPENDENCIES ====="

          readelf -d "$BIN"

          echo
          echo "===== FORBIDDEN ANDROID FRAMEWORK DEPENDENCIES ====="

          if readelf -d "$BIN" \
              | grep -E \
                'libOpenSLES\.so|libmediandk\.so'; then

              echo "ERROR: forbidden audio/media dependency detected."
              exit 1
          fi

          echo
          echo "No OpenSLES / MediaNDK dependency."

      # ============================================================
      # 11. Prepare runtime
      # ============================================================
      - name: Prepare Runtime Package
        shell: bash
        run: |
          set -eux

          rm -rf output_bin
          mkdir -p output_bin

          cp \
            build/bin/eden-cli \
            output_bin/eden-cli

          LIBCXX="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"

          test -f "$LIBCXX"

          cp \
            "$LIBCXX" \
            output_bin/libc++_shared.so

          echo
          echo "===== ARTIFACTS ====="

          ls -lah output_bin

          file output_bin/*

      # ============================================================
      # 12. Package
      # ============================================================
      - name: Package Eden Bionic ARM64
        shell: bash
        run: |
          set -eux

          tar \
            -czf \
            eden-bionic-arm64.tar.gz \
            -C output_bin \
            .

          ls -lh eden-bionic-arm64.tar.gz

      # ============================================================
      # 13. Upload
      # ============================================================
      - name: Upload Eden Bionic ARM64
        uses: actions/upload-artifact@v4
        with:
          name: eden-bionic-arm64
          path: |
            output_bin/
            eden-bionic-arm64.tar.gz
          if-no-files-found: error
