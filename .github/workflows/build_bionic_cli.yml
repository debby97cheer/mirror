name: Build Eden Bionic Native CLI ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-eden-bionic-arm64:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. 清理 Runner 磁盘空间
      # ============================================================
      - name: Free Disk Space
        shell: bash
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          df -h

      # ============================================================
      # 2. 拉取源码与子模块
      # ============================================================
      - name: Checkout Eden
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # 3. 安装构建主机依赖
      # ============================================================
      - name: Install Host Dependencies
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            ccache \
            glslang-tools \
            nasm \
            libtool \
            python3 \
            pkg-config \
            file

          cmake --version
          ninja --version
          python3 --version

      # ============================================================
      # 4. 配置 Android NDK r27c
      # ============================================================
      - name: Setup Android NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Export NDK Environment
        shell: bash
        run: |
          set -eux
          echo "NDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      # ============================================================
      # 5. 精确源码重构 (纯净 Bionic 原生 CLI)
      # ============================================================
      - name: Patch Eden For Bionic CLI
        shell: bash
        run: |
          set -eux
          echo "============================================================"
          echo "Eden ARM64 Android/Bionic CLI source preparation"
          echo "============================================================"

          # --------------------------------------------------------
          # 5.1 启用 YUZU_CMD 并增加 YUZU_BIONIC_CLI 宏支持
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("CMakeLists.txt")
          text = path.read_text()

          pattern = re.compile(
              r'cmake_dependent_option\s*\(\s*'
              r'YUZU_CMD\s+'
              r'"[^"]*"\s+'
              r'[^)]*?'
              r'"NOT ANDROID"\s+'
              r'OFF\s*\)',
              re.MULTILINE
          )

          match = pattern.search(text)
          if match:
              replacement = 'option(YUZU_CMD "Compile the eden-cli executable" ON)'
              text = text[:match.start()] + replacement + text[match.end():]
              print("YUZU_CMD Android restriction removed.")
          elif 'option(YUZU_CMD "Compile the eden-cli executable" ON)' in text:
              print("YUZU_CMD is already enabled.")
          else:
              raise SystemExit("ERROR: YUZU_CMD declaration was not found.")

          if "option(YUZU_BIONIC_CLI" not in text:
              marker = 'option(YUZU_CMD "Compile the eden-cli executable" ON)'
              bionic_block = (
                  marker + '\n'
                  'option(YUZU_BIONIC_CLI "Build standalone Android/Bionic CLI" OFF)\n'
                  'if (YUZU_BIONIC_CLI)\n'
                  '    add_compile_definitions(YUZU_BIONIC_CLI)\n'
                  'endif()'
              )
              text = text.replace(marker, bionic_block, 1)

          path.write_text(text)
          PY

          # --------------------------------------------------------
          # 5.2 排除 yuzu-android JNI 编译
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/CMakeLists.txt")
          text = path.read_text()

          pattern = re.compile(
              r'if\s*\(\s*ANDROID\s*\)\s*'
              r'add_subdirectory\(\s*android/app/src/main/jni\s*\)\s*'
              r'target_include_directories\(\s*yuzu-android\s+PRIVATE\s+android/app/src/main\s*\)\s*'
              r'endif\s*\(\s*\)',
              re.MULTILINE
          )

          replacement = (
              "if (ANDROID AND NOT YUZU_BIONIC_CLI)\n"
              "    add_subdirectory(android/app/src/main/jni)\n"
              "    target_include_directories(yuzu-android PRIVATE android/app/src/main)\n"
              "endif()"
          )

          if pattern.search(text):
              text = pattern.sub(replacement, text, count=1)
              print("Android JNI target disabled.")
          elif "if (ANDROID AND NOT YUZU_BIONIC_CLI)" in text:
              print("Android JNI guard already patched.")
          path.write_text(text)
          PY

          # --------------------------------------------------------
          # 5.3 补齐 <stop_token> 头文件引入
          # --------------------------------------------------------
          for f in src/common/thread_worker.h src/common/polyfill_thread.h src/common/thread.h; do
            if [ -f "$f" ] && ! grep -q '#include <stop_token>' "$f"; then
              sed -i '1i#include <stop_token>' "$f"
            fi
          done

          # --------------------------------------------------------
          # 5.4 在 input_common 中阻断 Android Engine 实例化
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("src/input_common/main.cpp"),
              Path("src/input_common/main.h"),
          ]

          for path in files:
              if path.exists():
                  text = path.read_text()
                  text = re.sub(
                      r'#if(def\s+__ANDROID__|defined\(__ANDROID__\))',
                      '#if defined(__ANDROID__) && !defined(YUZU_BIONIC_CLI)',
                      text
                  )
                  path.write_text(text)
                  print(f"Android blocks guarded in: {path}")
          PY

          # --------------------------------------------------------
          # 5.5 精确重构 yuzu.cpp (生命周期 + 短参数 + 符号闭环)
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/yuzu_cmd/yuzu.cpp")
          text = path.read_text()

          if "#include <cstring>" not in text:
              text = text.replace("#include <string>", "#include <string>\n#include <cstring>", 1)

          if "#include <unistd.h>" not in text:
              text = text.replace(
                  "#include <getopt.h>",
                  "#include <getopt.h>\n#ifndef _WIN32\n#include <unistd.h>\n#endif",
                  1
              )

          # 替换 SDL main 模式
          pattern_sdl_main = re.compile(
              r'#define\s+SDL_MAIN_USE_CALLBACKS\s+1.*?\n\s*#include\s+<SDL3/SDL_main\.h>',
              re.MULTILINE
          )
          new_sdl_main = (
              "#ifdef YUZU_BIONIC_CLI\n"
              "#define SDL_MAIN_HANDLED 1\n"
              "#else\n"
              "#define SDL_MAIN_USE_CALLBACKS 1\n"
              "#endif\n"
              "#include <SDL3/SDL_main.h>"
          )
          text = pattern_sdl_main.sub(new_sdl_main, text, count=1)

          # 提供原属于 yuzu-android 的平台全局变量定义
          android_globals = """
          #if defined(YUZU_BIONIC_CLI) && defined(__ANDROID__)
          #include <atomic>
          namespace AndroidSettings {
          Settings::Values values{};
          }
          std::atomic<int> g_battery_percentage{100};
          std::atomic<bool> g_is_charging{false};
          std::atomic<bool> g_has_battery{true};
          #endif
          """
          if "namespace AndroidSettings" not in text:
              text = text.replace("#include <SDL3/SDL_main.h>", "#include <SDL3/SDL_main.h>\n" + android_globals, 1)

          # 修正 optstring：补充短参数 'n'
          text = re.sub(
              r'getopt_long\s*\(\s*argc\s*,\s*argv\s*,\s*"[^"]*"',
              'getopt_long(argc, argv, "g:fhvnc:m:p::u:d:i:sx:"',
              text
          )

          # 修正 long_options 参数配置
          text = text.replace(
              '{"input-profile", no_argument, 0, \'i\'},',
              '{"input-profile", required_argument, 0, \'i\'},'
          )
          text = text.replace(
              '{"filter", no_argument, 0, \'x\'},',
              '{"filter", required_argument, 0, \'x\'},'
          )

          # 修正 SDL_AppInit 保持运行
          pattern_tail = re.compile(
              r'(void\s*\(\s*state->system\.Run\(\)\s*\)\s*;\s*\n\s*'
              r'if\s*\(\s*state->system\.DebuggerEnabled\(\)\s*\)\s*\n\s*'
              r'state->system\.InitializeDebugger\(\)\s*;\s*\n\s*)'
              r'return\s+SDL_APP_SUCCESS\s*;\s*\n\s*\}',
              re.MULTILINE
          )
          new_tail = (
              r'\1'
              "#ifdef YUZU_BIONIC_CLI\n"
              "    return SDL_APP_CONTINUE;\n"
              "#else\n"
              "    return SDL_APP_SUCCESS;\n"
              "#endif\n"
              "}"
          )
          text = pattern_tail.sub(new_tail, text, count=1)

          # 修正 SDL_AppEvent 退出逻辑
          pattern_event = re.compile(
              r'(extern\s+"C"\s+SDL_AppResult\s+SDL_AppEvent\s*\([^)]*\)\s*\{[^{}]*?'
              r'state->emu_window->OnEvent\(\*event\);\s*\n\s*)'
              r'return\s+SDL_APP_SUCCESS\s*;\s*\n\s*\}',
              re.MULTILINE
          )
          new_event = (
              r'\1'
              "#ifdef YUZU_BIONIC_CLI\n"
              "    return state->emu_window->IsOpen()\n"
              "        ? SDL_APP_CONTINUE\n"
              "        : SDL_APP_SUCCESS;\n"
              "#else\n"
              "    return SDL_APP_SUCCESS;\n"
              "#endif\n"
              "}"
          )
          text = pattern_event.sub(new_event, text, count=1)

          # 追加标准原生 main()
          if "int main(int argc, char** argv)" not in text:
              native_main = r'''
          #ifdef YUZU_BIONIC_CLI

          int main(int argc, char** argv) {
              if (chdir("/data/eden") != 0) {
                  std::cerr << "Warning: unable to chdir to /data/eden" << std::endl;
              }

              SDL_SetMainReady();

              for (int i = 1; i < argc; ++i) {
                  if (std::strcmp(argv[i], "-n") == 0 ||
                      std::strcmp(argv[i], "--null-render") == 0) {
                      SDL_SetHint(SDL_HINT_VIDEO_DRIVER, "dummy");
                      break;
                  }
              }

              void* appstate = nullptr;
              SDL_AppResult result = SDL_AppInit(&appstate, argc, argv);

              if (result != SDL_APP_CONTINUE) {
                  if (appstate != nullptr) {
                      SDL_AppQuit(appstate, result);
                  }
                  return 0;
              }

              while (result == SDL_APP_CONTINUE) {
                  SDL_Event event{};
                  while (SDL_PollEvent(&event)) {
                      result = SDL_AppEvent(appstate, &event);
                      if (result != SDL_APP_CONTINUE) {
                          break;
                      }
                  }
                  if (result != SDL_APP_CONTINUE) {
                      break;
                  }
                  result = SDL_AppIterate(appstate);
              }

              if (appstate != nullptr) {
                  SDL_AppQuit(appstate, result);
              }

              return result == SDL_APP_SUCCESS ? 0 : 1;
          }

          #endif
          '''
              text += native_main

          path.write_text(text)
          print("yuzu.cpp patched successfully.")
          PY

          # --------------------------------------------------------
          # 5.6 弹性修改 emu_window_sdl3.cpp (仅初始化 VIDEO)
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/yuzu_cmd/emu_window/emu_window_sdl3.cpp")
          text = path.read_text()

          pattern = re.compile(r'SDL_Init\s*\([^\)]*SDL_INIT_VIDEO[^\)]*\)')
          replacement = "SDL_Init(SDL_INIT_VIDEO)"

          match = pattern.search(text)
          if match:
              text = pattern.sub(replacement, text, count=1)
              print("SDL_Init patched to video-only successfully.")
          elif "SDL_Init(SDL_INIT_VIDEO)" in text:
              print("SDL_Init already configured for video-only.")
          else:
              raise SystemExit("ERROR: Could not locate SDL_Init() call.")

          path.write_text(text)
          PY

          # --------------------------------------------------------
          # 5.7 链接 log 库
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path

          p = Path("src/yuzu_cmd/CMakeLists.txt")
          content = p.read_text()
          if "target_link_libraries(yuzu-cmd PRIVATE log)" not in content:
              content += "\ntarget_link_libraries(yuzu-cmd PRIVATE log)\n"
          p.write_text(content)
          PY

          # --------------------------------------------------------
          # 5.8 源码验证打印
          # --------------------------------------------------------
          echo "============================================================"
          echo "VALIDATION: yuzu.cpp"
          echo "============================================================"
          grep -nE 'SDL_MAIN_HANDLED|SDL_MAIN_USE_CALLBACKS|int main\(|SDL_SetMainReady' src/yuzu_cmd/yuzu.cpp

          echo "============================================================"
          echo "VALIDATION: getopt"
          echo "============================================================"
          grep -nE 'null-render|getopt_long' src/yuzu_cmd/yuzu.cpp

          echo "============================================================"
          echo "VALIDATION: Android input"
          echo "============================================================"
          grep -nE 'YUZU_BIONIC_CLI|RegisterEngine\("android"' src/input_common/main.cpp || true

          echo "============================================================"
          echo "VALIDATION: SDL Init"
          echo "============================================================"
          grep -n -C3 'SDL_Init' src/yuzu_cmd/emu_window/emu_window_sdl3.cpp

      # ============================================================
      # 6. 配置 CMake (-fexperimental-library 关键修复)
      # ============================================================
      - name: Configure CMake
        shell: bash
        run: |
          set -eux
          rm -rf build

          cmake -S . -B build \
            -GNinja \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_BIONIC_CLI=ON \
            -DENABLE_QT=OFF \
            -DENABLE_QT_TRANSLATION=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DSDL_AUDIO=OFF \
            -DSDL_JOYSTICK=OFF \
            -DSDL_HAPTIC=OFF \
            -DSDL_HIDAPI=OFF \
            -DSDL_SENSOR=OFF \
            -DSDL_CAMERA=OFF \
            -DSDL_POWER=OFF \
            -DSDL_DIALOG=OFF \
            -DSDL_TRAY=OFF \
            -DSDL_NOTIFICATION=OFF \
            -DSDL_DUMMYVIDEO=ON \
            -DSDL_VULKAN=ON \
            -DSDL_OPENGLES=OFF \
            -DENABLE_OPENGL=OFF \
            -DENABLE_CUBEB=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DENABLE_COMPATIBILITY_LIST_DOWNLOAD=OFF \
            -DENABLE_LIBUSB=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_DOWNLOAD_ANDROID_VVL=OFF \
            -DYUZU_DOWNLOAD_TIME_ZONE_DATA=ON \
            -DYUZU_LEGACY=ON \
            -DYUZU_ENABLE_LTO=OFF \
            -DCMAKE_CXX_FLAGS="-fexperimental-library -DYUZU_BIONIC_CLI" \
            -DCMAKE_C_FLAGS="-fexperimental-library -DYUZU_BIONIC_CLI" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld"

      # ============================================================
      # 7. 检查 CMake 配置
      # ============================================================
      - name: Inspect CMake Configuration
        shell: bash
        run: |
          set -eux
          grep -E 'YUZU_CMD:|YUZU_BIONIC_CLI:|YUZU_LEGACY:' build/CMakeCache.txt || true
          grep -E '^SDL_(AUDIO|JOYSTICK|HAPTIC|HIDAPI|SENSOR|CAMERA|POWER|DUMMYVIDEO|VULKAN|OPENGLES):' build/CMakeCache.txt || true
          grep -E 'CMAKE_CXX_FLAGS' build/CMakeCache.txt || true

      # ============================================================
      # 8. C++20 stop_token 验证 (带 -fexperimental-library)
      # ============================================================
      - name: Verify CXX20 stop_token
        shell: bash
        run: |
          set -eux

          cat > /tmp/test_cpp20.cpp <<'EOF'
          #include <stop_token>
          #include <thread>

          int main() {
              std::stop_source source;
              std::stop_token token = source.get_token();
              std::stop_callback callback(token, []() {});
              (void)callback;
              return 0;
          }
          EOF

          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            --target=aarch64-none-linux-android34 \
            --sysroot="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
            -std=c++20 \
            -fexperimental-library \
            /tmp/test_cpp20.cpp \
            -o /tmp/test_cpp20

          file /tmp/test_cpp20
          echo "C++20 stop_token test passed."

      # ============================================================
      # 9. 编译目标
      # ============================================================
      - name: Build Eden CLI
        shell: bash
        run: |
          set -eux
          echo "============================================================"
          echo "Building eden-cli"
          echo "============================================================"
          ninja -C build -j"$(nproc)" eden-cli

      # ============================================================
      # 10. 校验 ELF 导出与动态依赖
      # ============================================================
      - name: Verify Eden ARM64 ELF
        shell: bash
        run: |
          set -eux
          BIN="build/bin/eden-cli"
          test -f "$BIN"

          echo "============================================================"
          echo "FILE & ELF HEADER"
          echo "============================================================"
          file "$BIN"
          readelf -h "$BIN"

          echo "============================================================"
          echo "MAIN SYMBOL"
          echo "============================================================"
          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -C "$BIN" | grep -E '(^| )main$'

          echo "============================================================"
          echo "DYNAMIC DEPENDENCIES (DT_NEEDED)"
          echo "============================================================"
          readelf -d "$BIN"

          if readelf -d "$BIN" | grep -E 'libOpenSLES\.so|libmediandk\.so'; then
              echo "ERROR: OpenSLES or MediaNDK dependency detected."
              exit 1
          fi
          echo "PASS: Clean Bionic ELF verified."

      # ============================================================
      # 11. 提取产物
      # ============================================================
      - name: Prepare Runtime Package
        shell: bash
        run: |
          set -eux
          rm -rf output_bin && mkdir -p output_bin
          cp build/bin/eden-cli output_bin/eden-cli

          LIBCXX="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          test -f "$LIBCXX"
          cp "$LIBCXX" output_bin/libc++_shared.so

          ls -lah output_bin
          file output_bin/*

      # ============================================================
      # 12. 打包交付物
      # ============================================================
      - name: Package Eden Bionic ARM64
        shell: bash
        run: |
          set -eux
          tar -czf eden-bionic-arm64.tar.gz -C output_bin .
          ls -lh eden-bionic-arm64.tar.gz

      # ============================================================
      # 13. 上传产物
      # ============================================================
      - name: Upload Eden Bionic ARM64
        uses: actions/upload-artifact@v4
        with:
          name: eden-bionic-arm64
          path: |
            output_bin/
            eden-bionic-arm64.tar.gz
          if-no-files-found: error
