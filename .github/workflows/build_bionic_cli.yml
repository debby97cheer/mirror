          python3 <<'PY'
          from pathlib import Path

          # --------------------------------------------------------
          # Null Window implementation
          # --------------------------------------------------------

          null_cpp = Path(
              "src/yuzu_cmd/emu_window/emu_window_sdl3_null.cpp"
          )

          null_cpp.write_text(
              "// SPDX-FileCopyrightText: 2026 Eden Emulator Project\n"
              "// SPDX-License-Identifier: GPL-3.0-or-later\n\n"

              "#include <iostream>\n"
              "#include <memory>\n\n"

              "#include "
              "\"yuzu_cmd/emu_window/emu_window_sdl3_null.h\"\n\n"

              "EmuWindow_SDL3_Null::EmuWindow_SDL3_Null(\n"
              "    InputCommon::InputSubsystem* input_subsystem,\n"
              "    Core::System& system,\n"
              "    bool fullscreen)\n"
              "    : EmuWindow_SDL3{input_subsystem, system} {\n"

              "    (void)fullscreen;\n"

              "    is_open = true;\n"

              "    std::cout "
              "<< \"[BIONIC] EmuWindow_SDL3_Null initialized\" "
              "<< std::endl;\n"
              "}\n\n"

              "EmuWindow_SDL3_Null::~EmuWindow_SDL3_Null() = default;\n\n"

              "std::unique_ptr<Core::Frontend::GraphicsContext>\n"
              "EmuWindow_SDL3_Null::CreateSharedContext() const {\n"
              "    return std::make_unique<DummyContext>();\n"
              "}\n"
          )

          # --------------------------------------------------------
          # Base SDL window
          # --------------------------------------------------------

          base = Path(
              "src/yuzu_cmd/emu_window/emu_window_sdl3.cpp"
          )

          text = base.read_text()

          if "#include <iostream>" not in text:
              text = (
                  "#include <iostream>\n"
                  + text
              )

          marker = (
              "input_subsystem->Initialize();\n"
          )

          if "YUZU_BIONIC_CLI" not in text:

              index = text.find(marker)

              if index < 0:
                  raise SystemExit(
                      "ERROR: SDL input init marker not found."
                  )

              insert_pos = (
                  index + len(marker)
              )

              headless = (
                  "#ifdef YUZU_BIONIC_CLI\n"

                  "    std::cout "
                  "<< \"[BIONIC] Headless SDL window mode\" "
                  "<< std::endl;\n"

                  "    is_open = true;\n"
                  "    render_window = nullptr;\n"

                  "    return;\n"

                  "#endif\n"
              )

              text = (
                  text[:insert_pos]
                  + headless
                  + text[insert_pos:]
              )

          # --------------------------------------------------------
          # Destructor protection
          # --------------------------------------------------------

          dtor = (
              "EmuWindow_SDL3::~EmuWindow_SDL3() {"
          )

          dtor_pos = text.find(dtor)

          if dtor_pos >= 0:

              region = text[
                  dtor_pos:dtor_pos + 600
              ]

              if "#ifdef YUZU_BIONIC_CLI" not in region:

                  replacement = (
                      dtor
                      + "\n"
                      "#ifdef YUZU_BIONIC_CLI\n"
                      "    if (!render_window) {\n"
                      "        return;\n"
                      "    }\n"
                      "#endif"
                  )

                  text = text.replace(
                      dtor,
                      replacement,
                      1,
                  )

          base.write_text(text)

          print(
              "Headless EmuWindow configured."
          )
          PY

