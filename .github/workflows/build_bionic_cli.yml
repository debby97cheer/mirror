name: Build Eden Bionic Native CLI ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-eden-bionic-arm64:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. 清理 Runner 磁盘空间
      # ============================================================
      - name: Free Disk Space
        shell: bash
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf "/usr/local/share/boost" || true
          df -h

      # ============================================================
      # 2. 拉取源码与子模块
      # ============================================================
      - name: Checkout Eden Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # 3. 安装构建主机基础依赖
      # ============================================================
      - name: Install Host Dependencies
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            ccache \
            glslang-tools \
            nasm \
            libtool \
            python3 \
            pkg-config

          cmake --version
          ninja --version
          python3 --version

      # ============================================================
      # 4. 配置 Android NDK r27c 并全局导出路径
      # ============================================================
      - name: Setup Android NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Export Global NDK Environment
        shell: bash
        run: |
          echo "NDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      # ============================================================
      # 5. 精准补丁构建图 (启用 CLI、禁用 JNI、植入 ELF main 桥接)
      # ============================================================
      - name: Patch Eden For Bionic CLI
        shell: bash
        run: |
          set -eux
          echo "============================================================"
          echo "1. 解除 YUZU_CMD 的 Android 平台排他限制"
          echo "============================================================"
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("CMakeLists.txt")
          text = path.read_text()

          pattern = re.compile(
              r'cmake_dependent_option\(\s*YUZU_CMD\s+"[^"]*"\s+[^)]*?"NOT ANDROID"\s+OFF\s*\)',
              re.MULTILINE
          )

          if pattern.search(text):
              text = pattern.sub('option(YUZU_CMD "Compile the eden-cli executable" ON)', text, count=1)
              print("YUZU_CMD converted to standard option.")
          elif 'option(YUZU_CMD "Compile the eden-cli executable" ON)' in text:
              print("YUZU_CMD already configured.")

          if 'option(YUZU_BIONIC_CLI' not in text:
              marker = 'option(YUZU_CMD "Compile the eden-cli executable" ON)'
              text = text.replace(marker, marker + '\noption(YUZU_BIONIC_CLI "Build standalone Android/Bionic CLI" ON)', 1)

          path.write_text(text)
          PY

          echo "============================================================"
          echo "2. 排除 yuzu-android JNI 模块"
          echo "============================================================"
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/CMakeLists.txt")
          text = path.read_text()

          pattern = re.compile(
              r'if\s*\(\s*ANDROID\s*\)\s*add_subdirectory\(\s*android/app/src/main/jni\s*\)\s*target_include_directories\(\s*yuzu-android\s+PRIVATE\s+android/app/src/main\s*\)\s*endif\s*\(\s*\)',
              re.MULTILINE
          )

          replacement = """if (ANDROID AND NOT YUZU_BIONIC_CLI)
              add_subdirectory(android/app/src/main/jni)
              target_include_directories(yuzu-android PRIVATE android/app/src/main)
          endif()"""

          if pattern.search(text):
              text = pattern.sub(replacement, text, count=1)
              print("yuzu-android JNI target bypassed.")
          elif "ANDROID AND NOT YUZU_BIONIC_CLI" in text:
              print("JNI guard already in place.")

          path.write_text(text)
          PY

          echo "============================================================"
          echo "3. 补齐关键头文件 <stop_token>"
          echo "============================================================"
          for f in src/common/thread_worker.h src/common/polyfill_thread.h src/common/thread.h; do
            if [ -f "$f" ] && ! grep -q '#include <stop_token>' "$f"; then
              sed -i '1i #include <stop_token>' "$f"
              echo "Injected <stop_token> into $f"
            fi
          done

          echo "============================================================"
          echo "4. 生成并注入 Bionic ELF 原生入口桥接"
          echo "============================================================"
          cat > src/yuzu_cmd/eden_bionic_entry.cpp <<'EOF'
          // SPDX-License-Identifier: GPL-3.0-or-later
          #define SDL_MAIN_HANDLED 1

          #include <SDL3/SDL.h>
          #include <SDL3/SDL_main.h>

          extern "C" SDL_AppResult SDLCALL SDL_AppInit(void** appstate, int argc, char** argv);
          extern "C" SDL_AppResult SDLCALL SDL_AppIterate(void* appstate);
          extern "C" SDL_AppResult SDLCALL SDL_AppEvent(void* appstate, SDL_Event* event);
          extern "C" void SDLCALL SDL_AppQuit(void* appstate, SDL_AppResult result);

          int main(int argc, char** argv) {
              return SDL_EnterAppMainCallbacks(
                  argc,
                  argv,
                  SDL_AppInit,
                  SDL_AppIterate,
                  SDL_AppEvent,
                  SDL_AppQuit
              );
          }
          EOF

          python3 <<'PY'
          from pathlib import Path

          p = Path("src/yuzu_cmd/CMakeLists.txt")
          if p.exists():
              content = p.read_text()
              if "eden_bionic_entry.cpp" not in content:
                  content = content.replace("yuzu.cpp", "yuzu.cpp\n    eden_bionic_entry.cpp", 1)
                  p.write_text(content)
                  print("Registered eden_bionic_entry.cpp in src/yuzu_cmd/CMakeLists.txt")
          PY

      # ============================================================
      # 6. 执行 CMake 配置
      # ============================================================
      - name: Configure CMake
        shell: bash
        run: |
          set -eux
          rm -rf build

          cmake -S . -B build \
            -GNinja \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_BIONIC_CLI=ON \
            -DENABLE_QT=OFF \
            -DENABLE_QT_TRANSLATION=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DENABLE_OPENGL=OFF \
            -DENABLE_CUBEB=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DENABLE_LIBUSB=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_DOWNLOAD_ANDROID_VVL=OFF \
            -DYUZU_DOWNLOAD_TIME_ZONE_DATA=ON \
            -DYUZU_LEGACY=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_CXX_FLAGS="-fexperimental-library" \
            -DCMAKE_C_FLAGS="-fexperimental-library"

      # ============================================================
      # 7. 验证 C++20 编译器特性
      # ============================================================
      - name: Verify CXX20 Configuration
        shell: bash
        run: |
          set -eux
          grep -E 'CMAKE_CXX_STANDARD:|CMAKE_CXX_FLAGS:' build/CMakeCache.txt || true

          cat > /tmp/test_cpp20.cpp <<'EOF'
          #include <stop_token>
          #include <thread>

          static void test(std::stop_token token) {
              (void)token;
          }

          int main() {
              std::stop_source source;
              std::stop_token token = source.get_token();
              std::stop_callback callback(token, []() {});
              test(token);
              return 0;
          }
          EOF

          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            --target=aarch64-none-linux-android34 \
            --sysroot="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
            -std=c++20 \
            -fexperimental-library \
            /tmp/test_cpp20.cpp \
            -o /tmp/test_cpp20

          file /tmp/test_cpp20
          echo "C++20 stop_token/stop_callback test PASSED."

      # ============================================================
      # 8. 编译可执行程序目标
      # ============================================================
      - name: Build Eden CLI Target
        shell: bash
        run: |
          set -eux

          echo "=== 检索当前构建图中的目标名称 ==="
          TARGET=""
          if ninja -C build -t targets all | grep -q 'bin/eden-cli:'; then
              TARGET="eden-cli"
          elif ninja -C build -t targets all | grep -q 'bin/yuzu-cmd:'; then
              TARGET="yuzu-cmd"
          elif ninja -C build -t targets all | grep -q 'eden-cli'; then
              TARGET="eden-cli"
          elif ninja -C build -t targets all | grep -q 'yuzu-cmd'; then
              TARGET="yuzu-cmd"
          fi

          echo "Target matched: ${TARGET:-all}"
          if [ -n "$TARGET" ]; then
              ninja -C build -j"$(nproc)" "$TARGET"
          else
              ninja -C build -j"$(nproc)"
          fi

      # ============================================================
      # 9. 检验生成的 Bionic ARM64 ELF 文件
      # ============================================================
      - name: Verify Eden ARM64 ELF
        shell: bash
        run: |
          set -eux
          BIN=$(find build/bin -maxdepth 1 -type f \( -name "eden-cli" -o -name "yuzu-cmd" \) | head -n 1)

          if [ -z "$BIN" ] || [ ! -f "$BIN" ]; then
            echo "ERROR: Executable (eden-cli or yuzu-cmd) was not found in build/bin."
            find build -type f -executable | head -40
            exit 1
          fi

          echo "Found Binary: $BIN"
          file "$BIN"
          readelf -h "$BIN"

          echo "=== 检查 ELF Interpreter (必须为 /system/bin/linker64) ==="
          readelf -l "$BIN" | grep -A2 INTERP || true

          echo "=== 检查符号导出 (确保 main 存在) ==="
          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -C "$BIN" | grep -E '(^| )main$' || true

          echo "=== 动态链接库依赖 ==="
          readelf -d "$BIN"

      # ============================================================
      # 10. 收集交付物并归档
      # ============================================================
      - name: Package Runtime Artifacts
        shell: bash
        run: |
          set -eux
          rm -rf output_bin && mkdir -p output_bin

          BIN=$(find build/bin -maxdepth 1 -type f \( -name "eden-cli" -o -name "yuzu-cmd" \) | head -n 1)
          cp "$BIN" output_bin/eden-cli
          cp "$BIN" output_bin/yuzu-cmd

          LIBCXX="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          cp "$LIBCXX" output_bin/libc++_shared.so

          find build/bin -maxdepth 1 -type f -name '*.so' -exec cp {} output_bin/ \; || true

          ls -lah output_bin/
          tar -czf eden-bionic-arm64.tar.gz -C output_bin .

      # ============================================================
      # 11. 上传构建成果
      # ============================================================
      - name: Upload Eden Bionic ARM64
        uses: actions/upload-artifact@v4
        with:
          name: eden-bionic-arm64
          path: |
            output_bin/
            eden-bionic-arm64.tar.gz
          if-no-files-found: error
