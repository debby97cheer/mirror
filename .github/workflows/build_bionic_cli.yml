name: Build Eden Bionic Native CLI ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-eden-bionic-arm64:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Free disk space
      # ============================================================
      - name: Free Disk Space
        shell: bash
        run: |
          set -eux

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true

          df -h

      # ============================================================
      # 2. Checkout Eden
      # ============================================================
      - name: Checkout Eden
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # 3. Host dependencies
      # ============================================================
      - name: Install Host Dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            ccache \
            glslang-tools \
            nasm \
            libtool \
            python3 \
            pkg-config \
            file

          cmake --version
          ninja --version
          python3 --version

      # ============================================================
      # 4. Android NDK r27c
      # ============================================================
      - name: Setup Android NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Export NDK Environment
        shell: bash
        run: |
          set -eux

          echo "NDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      # ============================================================
      # 5. Prepare source tree
      # ============================================================
      - name: Patch Eden For Bionic CLI
        shell: bash
        run: |
          set -eux

          echo
          echo "============================================================"
          echo "Eden ARM64 Android/Bionic CLI source preparation"
          echo "============================================================"

          # ========================================================
          # 5.1 Enable YUZU_CMD on Android
          # ========================================================

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("CMakeLists.txt")
          text = path.read_text()

          # Find the YUZU_CMD cmake_dependent_option regardless of
          # whitespace/newlines.
          pattern = re.compile(
              r'cmake_dependent_option\s*\(\s*'
              r'YUZU_CMD\s+'
              r'"[^"]*"\s+'
              r'[^)]*?'
              r'"NOT ANDROID"\s+'
              r'OFF\s*\)',
              re.MULTILINE
          )

          match = pattern.search(text)

          if match:
              replacement = (
                  'option(YUZU_CMD '
                  '"Compile the eden-cli executable" ON)'
              )

              text = (
                  text[:match.start()]
                  + replacement
                  + text[match.end():]
              )

              print("YUZU_CMD Android restriction removed.")

          elif (
              'option(YUZU_CMD '
              '"Compile the eden-cli executable" ON)'
              in text
          ):
              print("YUZU_CMD is already enabled.")

          else:
              raise SystemExit(
                  "ERROR: YUZU_CMD declaration was not found."
              )

          # Add our private build switch.
          if "option(YUZU_BIONIC_CLI" not in text:

              marker = (
                  'option(YUZU_CMD '
                  '"Compile the eden-cli executable" ON)'
              )

              text = text.replace(
                  marker,
                  marker
                  + '\n'
                  + 'option(YUZU_BIONIC_CLI '
                  '"Build standalone Android/Bionic CLI" OFF)',
                  1
              )

          path.write_text(text)
          PY

          # ========================================================
          # 5.2 Disable Android JNI application
          # ========================================================

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/CMakeLists.txt")
          text = path.read_text()

          # Only modify the Android JNI subdirectory.
          old = (
              "if (ANDROID)\n"
              "    add_subdirectory(android/app/src/main/jni)\n"
              "    target_include_directories(yuzu-android PRIVATE android/app/src/main)\n"
              "endif()"
          )

          new = (
              "if (ANDROID AND NOT YUZU_BIONIC_CLI)\n"
              "    add_subdirectory(android/app/src/main/jni)\n"
              "    target_include_directories(yuzu-android PRIVATE android/app/src/main)\n"
              "endif()"
          )

          if old in text:
              text = text.replace(old, new, 1)
              print("Android JNI target disabled.")
          elif new in text:
              print("Android JNI guard already patched.")
          else:
              print(
                  "WARNING: exact Android JNI block not found; "
                  "CMake target validation will be performed later."
              )

          path.write_text(text)
          PY

          # ========================================================
          # 5.3 Ensure C++20 header availability
          # ========================================================

          if [ -f src/common/thread_worker.h ]; then
            if ! grep -q '#include <stop_token>' \
                src/common/thread_worker.h; then

              sed -i \
                '1i#include <stop_token>' \
                src/common/thread_worker.h
            fi
          fi

          # ========================================================
          # 5.4 Disable Android Input Engine ONLY for Bionic CLI
          #
          # We deliberately do not modify android.cpp.
          #
          # This prevents:
          #
          #   Android::Android()
          #        ↓
          #   Android_Vibration thread
          #        ↓
          #   JavaVM
          #
          # from ever being instantiated.
          # ========================================================

          python3 <<'PY'
          from pathlib import Path

          files = [
              Path("src/input_common/main.cpp"),
              Path("src/input_common/main.h"),
          ]

          for path in files:

              if not path.exists():
                  raise SystemExit(
                      f"ERROR: missing {path}"
                  )

              text = path.read_text()

              text = text.replace(
                  "#ifdef __ANDROID__",
                  "#if defined(__ANDROID__) && !defined(YUZU_BIONIC_CLI)"
              )

              path.write_text(text)

              print(f"Android blocks guarded in: {path}")
          PY

          # ========================================================
          # 5.5 Patch yuzu.cpp
          # ========================================================

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/yuzu_cmd/yuzu.cpp")
          text = path.read_text()

          # --------------------------------------------------------
          # Explicit headers needed by our Bionic entry.
          # --------------------------------------------------------

          if "#include <cstring>" not in text:
              text = text.replace(
                  "#include <string>",
                  "#include <string>\n#include <cstring>",
                  1
              )

          if "#include <unistd.h>" not in text:
              text = text.replace(
                  "#include <getopt.h>",
                  "#include <getopt.h>\n#ifndef _WIN32\n#include <unistd.h>\n#endif",
                  1
              )

          # --------------------------------------------------------
          # SDL main mode.
          #
          # Desktop remains SDL callback based.
          # Bionic gets a native ELF main().
          # --------------------------------------------------------

          old = (
              "#define SDL_MAIN_USE_CALLBACKS 1\n"
              "#include <SDL3/SDL_main.h>"
          )

          new = (
              "#ifdef YUZU_BIONIC_CLI\n"
              "#define SDL_MAIN_HANDLED 1\n"
              "#else\n"
              "#define SDL_MAIN_USE_CALLBACKS 1\n"
              "#endif\n"
              "#include <SDL3/SDL_main.h>"
          )

          if old in text:
              text = text.replace(old, new, 1)

          elif new in text:
              print("SDL main block already patched.")

          else:
              raise SystemExit(
                  "ERROR: SDL main declaration not found."
              )

          # --------------------------------------------------------
          # getopt short option string.
          #
          # Current source already has:
          #   --null-render => n
          #
          # Only the short option string was missing n.
          #
          # g: game
          # f  fullscreen
          # h  help
          # v  version
          # n  null renderer
          # c: config
          # m: multiplayer
          # p:: program
          # u: user
          # d: debug
          # i: input profile
          # s  singlecore
          # x: log filter
          # --------------------------------------------------------

          old_opt = (
              'getopt_long(argc, argv, '
              '"g:fhvcip::c:u:d:",'
          )

          new_opt = (
              'getopt_long(argc, argv, '
              '"g:fhvnc:m:p::u:d:i:nsx:",'
          )

          if old_opt in text:
              text = text.replace(
                  old_opt,
                  new_opt,
                  1
              )

          elif new_opt in text:
              print("getopt option string already patched.")

          else:
              raise SystemExit(
                  "ERROR: getopt_long option string not found."
              )

          # --------------------------------------------------------
          # Fix long option declarations.
          # --------------------------------------------------------

          text = text.replace(
              '{"input-profile", no_argument, 0, \'i\'},',
              '{"input-profile", required_argument, 0, \'i\'},'
          )

          text = text.replace(
              '{"filter", no_argument, 0, \'x\'},',
              '{"filter", required_argument, 0, \'x\'},'
          )

          # --------------------------------------------------------
          # Bionic AppInit keeps application alive.
          # --------------------------------------------------------

          old_tail = (
              "    void(state->system.Run());\n"
              "    if (state->system.DebuggerEnabled())\n"
              "        state->system.InitializeDebugger();\n"
              "    return SDL_APP_SUCCESS;\n"
              "}"
          )

          new_tail = (
              "    void(state->system.Run());\n"
              "    if (state->system.DebuggerEnabled())\n"
              "        state->system.InitializeDebugger();\n"
              "#ifdef YUZU_BIONIC_CLI\n"
              "    return SDL_APP_CONTINUE;\n"
              "#else\n"
              "    return SDL_APP_SUCCESS;\n"
              "#endif\n"
              "}"
          )

          if old_tail in text:
              text = text.replace(
                  old_tail,
                  new_tail,
                  1
              )

          # --------------------------------------------------------
          # Event callback.
          # --------------------------------------------------------

          old_event = (
              'extern "C" SDL_AppResult SDL_AppEvent(void *appstate, '
              'SDL_Event *event) {\n'
              '    SdlState *state = (SdlState *)appstate;\n'
              '    state->emu_window->OnEvent(*event);\n'
              '    return SDL_APP_SUCCESS;\n'
              '}'
          )

          new_event = (
              'extern "C" SDL_AppResult SDL_AppEvent(void *appstate, '
              'SDL_Event *event) {\n'
              '    SdlState *state = (SdlState *)appstate;\n'
              '    state->emu_window->OnEvent(*event);\n'
              '#ifdef YUZU_BIONIC_CLI\n'
              '    return state->emu_window->IsOpen()\n'
              '        ? SDL_APP_CONTINUE\n'
              '        : SDL_APP_SUCCESS;\n'
              '#else\n'
              '    return SDL_APP_SUCCESS;\n'
              '#endif\n'
              '}'
          )

          if old_event in text:
              text = text.replace(
                  old_event,
                  new_event,
                  1
              )

          # --------------------------------------------------------
          # Native Bionic main().
          # --------------------------------------------------------

          if "int main(int argc, char** argv)" not in text:

              native_main = r'''

          #ifdef YUZU_BIONIC_CLI

          int main(int argc, char** argv) {

              // Recovery processes normally begin in "/".
              // Eden uses relative paths for configuration and keys.
              if (chdir("/data/eden") != 0) {
                  std::cerr
                      << "Warning: unable to chdir to /data/eden"
                      << std::endl;
              }

              // We provide the actual ELF entry point.
              SDL_SetMainReady();

              // In Null Renderer mode, use SDL's dummy video driver.
              for (int i = 1; i < argc; ++i) {

                  if (std::strcmp(argv[i], "-n") == 0 ||
                      std::strcmp(argv[i], "--null-render") == 0) {

                      SDL_SetHint(
                          SDL_HINT_VIDEO_DRIVER,
                          "dummy"
                      );

                      break;
                  }
              }

              void* appstate = nullptr;

              SDL_AppResult result =
                  SDL_AppInit(
                      &appstate,
                      argc,
                      argv
                  );

              // --help, --version and argument errors can terminate
              // before entering the application loop.
              if (result != SDL_APP_CONTINUE) {

                  if (appstate != nullptr) {
                      SDL_AppQuit(
                          appstate,
                          result
                      );
                  }

                  return 0;
              }

              while (result == SDL_APP_CONTINUE) {

                  SDL_Event event{};

                  while (SDL_PollEvent(&event)) {

                      result = SDL_AppEvent(
                          appstate,
                          &event
                      );

                      if (result != SDL_APP_CONTINUE) {
                          break;
                      }
                  }

                  if (result != SDL_APP_CONTINUE) {
                      break;
                  }

                  result = SDL_AppIterate(
                      appstate
                  );
              }

              if (appstate != nullptr) {
                  SDL_AppQuit(
                      appstate,
                      result
                  );
              }

              return result == SDL_APP_SUCCESS ? 0 : 1;
          }

          #endif
          '''

              text += native_main

          path.write_text(text)

          print("yuzu.cpp patched successfully.")
          PY

          # ========================================================
          # 5.6 Patch SDL3 initialization robustly
          #
          # IMPORTANT:
          # Do NOT match the complete if() block.
          # Only replace the SDL_Init argument expression.
          # ========================================================

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "src/yuzu_cmd/emu_window/emu_window_sdl3.cpp"
          )

          text = path.read_text()

          # Only replace the argument list.
          #
          # Original:
          #
          # SDL_Init(SDL_INIT_VIDEO | SDL_INIT_JOYSTICK | SDL_INIT_GAMEPAD)
          #
          # Bionic:
          #
          # SDL_Init(SDL_INIT_VIDEO)
          #
          pattern = re.compile(
              r'SDL_Init\s*\(\s*'
              r'SDL_INIT_VIDEO\s*\|\s*'
              r'SDL_INIT_JOYSTICK\s*\|\s*'
              r'SDL_INIT_GAMEPAD\s*'
              r'\s*\)'
          )

          replacement = "SDL_Init(SDL_INIT_VIDEO)"

          match = pattern.search(text)

          if match:
              text = (
                  text[:match.start()]
                  + replacement
                  + text[match.end():]
              )

              print(
                  "SDL_Init argument patched successfully:"
              )
              print(match.group(0))
              print("->")
              print(replacement)

          elif "SDL_Init(SDL_INIT_VIDEO)" in text:
              print(
                  "SDL_Init already configured for video-only."
              )

          else:
              raise SystemExit(
                  "ERROR: Could not locate SDL_Init() call."
              )

          path.write_text(text)
          PY

          # ========================================================
          # 5.7 Final source validation
          # ========================================================

          echo
          echo "============================================================"
          echo "VALIDATION: yuzu.cpp"
          echo "============================================================"

          grep -nE \
            'SDL_MAIN_HANDLED|SDL_MAIN_USE_CALLBACKS|int main\(|SDL_SetMainReady' \
            src/yuzu_cmd/yuzu.cpp

          echo
          echo "============================================================"
          echo "VALIDATION: getopt"
          echo "============================================================"

          grep -nE \
            'null-render|getopt_long|input-profile|filter|singlecore' \
            src/yuzu_cmd/yuzu.cpp

          echo
          echo "============================================================"
          echo "VALIDATION: Android input"
          echo "============================================================"

          grep -nE \
            'YUZU_BIONIC_CLI|RegisterEngine\("android"' \
            src/input_common/main.cpp \
            src/input_common/main.h \
            || true

          echo
          echo "============================================================"
          echo "VALIDATION: SDL Init"
          echo "============================================================"

          grep -n -A8 -B4 \
            'SDL_Init' \
            src/yuzu_cmd/emu_window/emu_window_sdl3.cpp

          echo
          echo "============================================================"
          echo "VALIDATION: android.cpp untouched"
          echo "============================================================"

          git diff --exit-code \
            src/input_common/drivers/android.cpp

      # ============================================================
      # 6. Configure CMake
      # ============================================================
      - name: Configure CMake
        shell: bash
        run: |
          set -eux

          rm -rf build

          cmake -S . -B build \
            -GNinja \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            \
            -DYUZU_CMD=ON \
            -DYUZU_BIONIC_CLI=ON \
            \
            -DENABLE_QT=OFF \
            -DENABLE_QT_TRANSLATION=OFF \
            \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            \
            -DSDL_AUDIO=OFF \
            -DSDL_JOYSTICK=OFF \
            -DSDL_HAPTIC=OFF \
            -DSDL_HIDAPI=OFF \
            -DSDL_SENSOR=OFF \
            -DSDL_CAMERA=OFF \
            -DSDL_POWER=OFF \
            -DSDL_DIALOG=OFF \
            -DSDL_TRAY=OFF \
            -DSDL_NOTIFICATION=OFF \
            -DSDL_DUMMYVIDEO=ON \
            -DSDL_VULKAN=ON \
            -DSDL_OPENGLES=OFF \
            \
            -DENABLE_OPENGL=OFF \
            -DENABLE_CUBEB=OFF \
            \
            -DENABLE_WEB_SERVICE=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DENABLE_COMPATIBILITY_LIST_DOWNLOAD=OFF \
            \
            -DENABLE_LIBUSB=OFF \
            \
            -DUSE_DISCORD_PRESENCE=OFF \
            \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            \
            -DYUZU_TESTS=OFF \
            \
            -DYUZU_DOWNLOAD_ANDROID_VVL=OFF \
            \
            -DYUZU_DOWNLOAD_TIME_ZONE_DATA=ON \
            \
            -DYUZU_LEGACY=ON \
            \
            -DYUZU_ENABLE_LTO=OFF \
            \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld"

      # ============================================================
      # 7. Inspect CMake configuration
      # ============================================================
      - name: Inspect CMake Configuration
        shell: bash
        run: |
          set -eux

          echo
          echo "============================================================"
          echo "CMake configuration"
          echo "============================================================"

          grep -E \
            'YUZU_CMD:|YUZU_BIONIC_CLI:|YUZU_LEGACY:' \
            build/CMakeCache.txt \
            || true

          echo
          echo "============================================================"
          echo "SDL configuration"
          echo "============================================================"

          grep -E \
            '^SDL_(AUDIO|JOYSTICK|HAPTIC|HIDAPI|SENSOR|CAMERA|POWER|DUMMYVIDEO|VULKAN|OPENGLES):' \
            build/CMakeCache.txt \
            || true

          echo
          echo "============================================================"
          echo "C++ standard"
          echo "============================================================"

          grep -E \
            'CMAKE_CXX_STANDARD|CMAKE_CXX_FLAGS' \
            build/CMakeCache.txt \
            || true

          echo
          echo "============================================================"
          echo "Android JNI target search"
          echo "============================================================"

          if grep -R \
              'yuzu-android' \
              build/build.ninja \
              2>/dev/null; then

              echo "WARNING: yuzu-android references exist."

          else

              echo "OK: yuzu-android target is absent."

          fi

      # ============================================================
      # 8. C++20 smoke test
      # ============================================================
      - name: Verify CXX20 stop_token
        shell: bash
        run: |
          set -eux

          cat > /tmp/test_cpp20.cpp <<'EOF'
          #include <stop_token>
          #include <thread>

          int main() {

              std::stop_source source;
              std::stop_token token = source.get_token();

              std::stop_callback callback(
                  token,
                  []() {}
              );

              (void)callback;

              return 0;
          }
          EOF

          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            --target=aarch64-none-linux-android34 \
            --sysroot="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
            -std=c++20 \
            /tmp/test_cpp20.cpp \
            -o /tmp/test_cpp20

          file /tmp/test_cpp20

          echo "C++20 stop_token test passed."

      # ============================================================
      # 9. Build
      # ============================================================
      - name: Build Eden CLI
        shell: bash
        run: |
          set -eux

          echo "============================================================"
          echo "Building eden-cli"
          echo "============================================================"

          ninja -C build -j"$(nproc)" eden-cli

      # ============================================================
      # 10. ELF validation
      # ============================================================
      - name: Verify Eden ARM64 ELF
        shell: bash
        run: |
          set -eux

          BIN="build/bin/eden-cli"

          test -f "$BIN"

          echo
          echo "============================================================"
          echo "FILE"
          echo "============================================================"

          file "$BIN"

          echo
          echo "============================================================"
          echo "ELF HEADER"
          echo "============================================================"

          readelf -h "$BIN"

          echo
          echo "============================================================"
          echo "INTERPRETER"
          echo "============================================================"

          readelf -l "$BIN" \
            | grep -A2 INTERP \
            || true

          echo
          echo "============================================================"
          echo "MAIN SYMBOL"
          echo "============================================================"

          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            -C "$BIN" \
            | grep -E '(^| )main$'

          echo
          echo "============================================================"
          echo "DYNAMIC DEPENDENCIES"
          echo "============================================================"

          readelf -d "$BIN"

          echo
          echo "============================================================"
          echo "FORBIDDEN FRAMEWORK DEPENDENCIES"
          echo "============================================================"

          if readelf -d "$BIN" \
              | grep -E \
                'libOpenSLES\.so|libmediandk\.so'; then

              echo "ERROR: OpenSLES or MediaNDK dependency detected."
              exit 1
          fi

          echo
          echo "PASS: No OpenSLES / MediaNDK DT_NEEDED dependency."

      # ============================================================
      # 11. Prepare runtime
      # ============================================================
      - name: Prepare Runtime Package
        shell: bash
        run: |
          set -eux

          rm -rf output_bin
          mkdir -p output_bin

          cp \
            build/bin/eden-cli \
            output_bin/eden-cli

          LIBCXX="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"

          test -f "$LIBCXX"

          cp \
            "$LIBCXX" \
            output_bin/libc++_shared.so

          echo
          echo "============================================================"
          echo "Runtime files"
          echo "============================================================"

          ls -lah output_bin

          file output_bin/*

      # ============================================================
      # 12. Package
      # ============================================================
      - name: Package Eden Bionic ARM64
        shell: bash
        run: |
          set -eux

          tar \
            -czf \
            eden-bionic-arm64.tar.gz \
            -C output_bin \
            .

          ls -lh eden-bionic-arm64.tar.gz

      # ============================================================
      # 13. Upload
      # ============================================================
      - name: Upload Eden Bionic ARM64
        uses: actions/upload-artifact@v4
        with:
          name: eden-bionic-arm64
          path: |
            output_bin/
            eden-bionic-arm64.tar.gz
          if-no-files-found: error
