name: Build Eden Bionic Native CLI ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-eden-bionic-arm64:
    runs-on: ubuntu-latest

    env:
      SDL_SOURCE_DIR: ${{ github.workspace }}/third_party/SDL
      SDL_VERSION: release-3.4.8

    steps:
      # ============================================================
      # 1. 清理 Runner
      # ============================================================
      - name: Free Disk Space
        shell: bash
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          df -h

      # ============================================================
      # 2. Checkout Eden
      # ============================================================
      - name: Checkout Eden
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # 3. Host Dependencies
      # ============================================================
      - name: Install Host Dependencies
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            ccache \
            glslang-tools \
            nasm \
            libtool \
            python3 \
            pkg-config \
            file

          cmake --version
          ninja --version
          python3 --version

      # ============================================================
      # 4. Android NDK r27c
      # ============================================================
      - name: Setup Android NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Export NDK
        shell: bash
        run: |
          set -eux
          echo "NDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      # ============================================================
      # 5. 获取 SDL3 源码 (本地源码编译)
      # ============================================================
      - name: Checkout SDL3 Source
        shell: bash
        run: |
          set -eux
          rm -rf third_party
          mkdir -p third_party

          git clone \
            --depth 1 \
            --branch "$SDL_VERSION" \
            https://github.com/libsdl-org/SDL.git \
            "$SDL_SOURCE_DIR"

          test -f "$SDL_SOURCE_DIR/CMakeLists.txt"
          echo "SDL3 commit:"
          git -C "$SDL_SOURCE_DIR" rev-parse HEAD

      # ============================================================
      # 6. Patch 根 CMake
      # ============================================================
      - name: Patch Root CMake
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("CMakeLists.txt")
          text = path.read_text()

          pattern = re.compile(
              r'cmake_dependent_option\s*\(\s*YUZU_CMD\b.*?\)',
              re.DOTALL | re.MULTILINE,
          )
          replacement = 'option(YUZU_CMD "Compile the eden-cli executable" ON)'
          text, count = pattern.subn(replacement, text, count=1)

          if count:
              print("YUZU_CMD Android restriction removed.")
          elif 'option(YUZU_CMD "Compile the eden-cli executable" ON)' in text:
              print("YUZU_CMD already enabled.")
          else:
              raise SystemExit("ERROR: YUZU_CMD declaration not found.")

          if "option(YUZU_BIONIC_CLI" not in text:
              marker = 'option(YUZU_CMD "Compile the eden-cli executable" ON)'
              block = (
                  marker + "\n"
                  'option(YUZU_BIONIC_CLI "Build standalone Android/Bionic CLI" OFF)\n'
                  "if (YUZU_BIONIC_CLI)\n"
                  "    add_compile_definitions(YUZU_BIONIC_CLI)\n"
                  "endif()\n"
              )
              text = text.replace(marker, block, 1)

          path.write_text(text)
          print("Root CMake patched.")
          PY

      # ============================================================
      # 7. 清除 cpmfile.json 中的 SDL3 预编译包定义
      # ============================================================
      - name: Sanitize CPM SDL3 Configuration
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          import json
          from pathlib import Path

          cpm = Path("cpmfile.json")
          if cpm.exists():
              data = json.loads(cpm.read_text())
              if "sdl3" in data:
                  del data["sdl3"]
                  cpm.write_text(json.dumps(data, indent=2) + "\n")
                  print("Deleted 'sdl3' entry from cpmfile.json.")
          PY

      # ============================================================
      # 8. 修改 externals/CMakeLists.txt (强制挂载本地源码 SDL3)
      # ============================================================
      - name: Patch SDL3 Dependency Routing
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path

          path = Path("externals/CMakeLists.txt")
          text = path.read_text()

          start_marker = "if (NOT YUZU_USE_BUNDLED_SDL3)"
          end_marker = "# Normalize SDL3 link target across package variants."

          start = text.find(start_marker)
          end = text.find(end_marker)

          if start < 0 or end < 0 or end <= start:
              raise SystemExit("ERROR: Invalid SDL3 dependency block boundaries.")

          new_block = "\n".join([
              'message(STATUS "Using EXCLUSIVE local source SDL3 for Bionic CLI")',
              'set(SDL_AUDIO OFF CACHE BOOL "" FORCE)',
              'set(SDL_VIDEO ON CACHE BOOL "" FORCE)',
              'set(SDL_SHARED OFF CACHE BOOL "" FORCE)',
              'set(SDL_STATIC ON CACHE BOOL "" FORCE)',
              'set(SDL_JOYSTICK OFF CACHE BOOL "" FORCE)',
              'set(SDL_HAPTIC OFF CACHE BOOL "" FORCE)',
              'set(SDL_HIDAPI OFF CACHE BOOL "" FORCE)',
              'set(SDL_SENSOR OFF CACHE BOOL "" FORCE)',
              'set(SDL_CAMERA OFF CACHE BOOL "" FORCE)',
              'set(SDL_POWER OFF CACHE BOOL "" FORCE)',
              'set(SDL_DIALOG OFF CACHE BOOL "" FORCE)',
              'set(SDL_TRAY OFF CACHE BOOL "" FORCE)',
              'set(SDL_NOTIFICATION OFF CACHE BOOL "" FORCE)',
              'set(SDL_OPENGL OFF CACHE BOOL "" FORCE)',
              'set(SDL_OPENGLES OFF CACHE BOOL "" FORCE)',
              'set(SDL_DUMMYVIDEO ON CACHE BOOL "" FORCE)',
              'set(SDL_VULKAN ON CACHE BOOL "" FORCE)',
              'add_subdirectory("${EDEN_BIONIC_SDL3_SOURCE}" "${CMAKE_BINARY_DIR}/eden_sdl3" EXCLUDE_FROM_ALL)',
              'if (NOT TARGET SDL3::SDL3)',
              '    add_library(SDL3::SDL3 ALIAS SDL3-static)',
              'endif()',
              '',
          ])

          text = text[:start] + new_block + text[end:]
          path.write_text(text)
          print("SDL3 dependency block replaced with exclusive source routing.")
          PY

      # ============================================================
      # 9. 修改 common/CMakeLists.txt
      # ============================================================
      - name: Patch Common Android Dependencies
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/common/CMakeLists.txt")
          text = path.read_text()

          text = re.sub(
              r'if\s*\(\s*ANDROID\s*\)(?=\s+target_sources\(\s*common\s+PUBLIC\s+fs/fs_android\.cpp)',
              'if(ANDROID AND NOT YUZU_BIONIC_CLI)',
              text,
              count=1
          )

          text = re.sub(
              r'if\s*\(\s*ANDROID\s*\)(?=\s+#\s*For ASharedMemory_create|\s+target_link_libraries\(\s*common\s+PRIVATE\s+android\s*\))',
              'if(ANDROID AND NOT YUZU_BIONIC_CLI)',
              text,
              count=1
          )

          path.write_text(text)
          print("Common Android dependencies guarded.")
          PY

      # ============================================================
      # 10. 修改 input_common/CMakeLists.txt
      # ============================================================
      - name: Patch Input Android Driver
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/input_common/CMakeLists.txt")
          text = path.read_text()

          if "if (ANDROID AND NOT YUZU_BIONIC_CLI)" in text:
              print("Input Android block already patched.")
          else:
              pattern = re.compile(r'if\s*\(\s*ANDROID\s*\)(?=[\s\S]*?drivers/android\.cpp)', re.MULTILINE)
              text, count = pattern.subn("if (ANDROID AND NOT YUZU_BIONIC_CLI)", text, count=1)
              if count == 0:
                  raise SystemExit("ERROR: Could not locate `if (ANDROID)` in src/input_common/CMakeLists.txt")
              print("Android input driver and libandroid disabled.")

          path.write_text(text)
          PY

      # ============================================================
      # 11. 修改 src/CMakeLists.txt
      # ============================================================
      - name: Patch src CMake
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/CMakeLists.txt")
          text = path.read_text()

          text = re.sub(r'if\s*\(\s*YUZU_CMD\s*\)', 'if (YUZU_CMD OR YUZU_BIONIC_CLI)', text, count=1)
          pattern_jni = re.compile(
              r'if\s*\(\s*ANDROID\s*\)\s*'
              r'add_subdirectory\s*\(\s*android/app/src/main/jni\s*\)\s*'
              r'target_include_directories\s*\(\s*yuzu-android\s+PRIVATE\s+android/app/src/main\s*\)\s*'
              r'endif\s*\(\s*\)',
              re.MULTILINE
          )
          replacement_jni = (
              "if (ANDROID AND NOT YUZU_BIONIC_CLI)\n"
              "    add_subdirectory(android/app/src/main/jni)\n"
              "    target_include_directories(yuzu-android PRIVATE android/app/src/main)\n"
              "endif()"
          )
          text, count = pattern_jni.subn(replacement_jni, text, count=1)
          if count:
              print("Full Android JNI target disabled via regex.")

          path.write_text(text)
          PY

      # ============================================================
      # 12. Core mediandk
      # ============================================================
      - name: Patch Core MediaNDK Dependency
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/core/CMakeLists.txt")
          text = path.read_text()

          if "mediandk" not in text:
              print("No mediandk dependency in core/CMakeLists.txt.")
              raise SystemExit(0)

          pattern = re.compile(
              r'if\s*\(\s*ANDROID\s*\)\s*'
              r'target_link_libraries\s*\(\s*core\s+PRIVATE\s+mediandk\s*\)\s*'
              r'endif\s*\(\s*\)',
              re.MULTILINE,
          )
          replacement = (
              "if (ANDROID AND NOT YUZU_BIONIC_CLI)\n"
              "    target_link_libraries(core PRIVATE mediandk)\n"
              "endif()"
          )

          text, count = pattern.subn(replacement, text, count=1)
          if count:
              print("Core mediandk dependency guarded.")
          else:
              text = text.replace("mediandk", "")
              print("Fallback: mediandk removed from core/CMakeLists.txt.")

          path.write_text(text)
          PY

      # ============================================================
      # 13. yuzu_cmd CMake：android_settings.cpp
      # ============================================================
      - name: Patch yuzu-cmd Sources
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/yuzu_cmd/CMakeLists.txt")
          text = path.read_text()

          if "android_settings.cpp" not in text:
              marker = "add_executable(yuzu-cmd\n"
              if marker not in text:
                  raise SystemExit("ERROR: yuzu-cmd add_executable() not found.")
              text = text.replace(
                  marker,
                  marker + "    ../android/app/src/main/jni/android_settings.cpp\n",
                  1,
              )
              print("Added android_settings.cpp.")

          if "target_link_libraries(yuzu-cmd PRIVATE log)" not in text:
              text += (
                  "\n"
                  "if (ANDROID AND YUZU_BIONIC_CLI)\n"
                  "    target_link_libraries(yuzu-cmd PRIVATE log)\n"
                  "endif()\n"
              )

          path.write_text(text)
          PY

      # ============================================================
      # 14. Input C++ Android guards
      # ============================================================
      - name: Patch Input Android Runtime Guards
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path

          for filename in ("src/input_common/main.cpp", "src/input_common/main.h"):
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text()
              text = text.replace("#ifdef __ANDROID__", "#if defined(__ANDROID__) && !defined(YUZU_BIONIC_CLI)")
              text = text.replace("#if defined(__ANDROID__)", "#if defined(__ANDROID__) && !defined(YUZU_BIONIC_CLI)")
              path.write_text(text)
              print("Patched Android input guards:", filename)
          PY

      # ============================================================
      # 15. Battery branch
      # ============================================================
      - name: Patch Android Battery Runtime
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/common/device_power_state.cpp")
          if path.exists():
              text = path.read_text()
              text = text.replace("#elif defined(__ANDROID__)", "#elif defined(__ANDROID__) && !defined(YUZU_BIONIC_CLI)")
              path.write_text(text)
              print("Android battery branch disabled.")
          PY

      # ============================================================
      # 16. 从 CMake 源码根除全局 -Wl,-u,JNI_OnLoad 强制链接
      # ============================================================
      - name: Strip Forced JNI_OnLoad
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          for p in Path(".").rglob("CMakeLists.txt"):
              text = p.read_text()
              if "JNI_OnLoad" in text:
                  new = re.sub(r'-Wl,\s*-u,\s*JNI_OnLoad', '', text)
                  if new != text:
                      p.write_text(new)
                      print(f"Stripped -Wl,-u,JNI_OnLoad from {p}")
          PY

      # ============================================================
      # 17. Headless EmuWindow
      # ============================================================
      - name: Patch Headless EmuWindow
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path

          null_cpp = Path("src/yuzu_cmd/emu_window/emu_window_sdl3_null.cpp")
          null_cpp.write_text(
              "// SPDX-FileCopyrightText: 2026 Eden Emulator Project\n"
              "// SPDX-License-Identifier: GPL-3.0-or-later\n\n"
              "#include <iostream>\n"
              "#include <memory>\n\n"
              "#include \"yuzu_cmd/emu_window/emu_window_sdl3_null.h\"\n\n"
              "EmuWindow_SDL3_Null::EmuWindow_SDL3_Null(\n"
              "    InputCommon::InputSubsystem* input_subsystem,\n"
              "    Core::System& system,\n"
              "    bool fullscreen)\n"
              "    : EmuWindow_SDL3{input_subsystem, system} {\n"
              "    (void)fullscreen;\n"
              "    is_open = true;\n"
              "    std::cout << \"[BIONIC] EmuWindow_SDL3_Null: initialized\" << std::endl;\n"
              "}\n\n"
              "EmuWindow_SDL3_Null::~EmuWindow_SDL3_Null() = default;\n\n"
              "std::unique_ptr<Core::Frontend::GraphicsContext>\n"
              "EmuWindow_SDL3_Null::CreateSharedContext() const {\n"
              "    return std::make_unique<DummyContext>();\n"
              "}\n"
          )

          base = Path("src/yuzu_cmd/emu_window/emu_window_sdl3.cpp")
          text = base.read_text()
          if "#include <iostream>" not in text:
              text = "#include <iostream>\n" + text

          marker = "input_subsystem->Initialize();\n"
          if "#ifdef YUZU_BIONIC_CLI" not in text:
              index = text.find(marker)
              if index < 0:
                  raise SystemExit("ERROR: SDL input init marker not found.")
              insert_pos = index + len(marker)
              headless = (
                  "#ifdef YUZU_BIONIC_CLI\n"
                  "    std::cout << \"[BIONIC] Headless mode - no physical window\" << std::endl;\n"
                  "    is_open = true;\n"
                  "    render_window = nullptr;\n"
                  "    return;\n"
                  "#endif\n"
              )
              text = text[:insert_pos] + headless + text[insert_pos:]

          dtor = "EmuWindow_SDL3::~EmuWindow_SDL3() {"
          if dtor in text and "#ifdef YUZU_BIONIC_CLI" not in text[text.find(dtor):text.find(dtor)+500]:
              text = text.replace(
                  dtor,
                  dtor + "\n#ifdef YUZU_BIONIC_CLI\n    if (!render_window) {\n        return;\n    }\n#endif",
                  1,
              )

          base.write_text(text)
          PY

      # ============================================================
      # 18. Native main + SDL main mode
      # ============================================================
      - name: Patch Native Main
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/yuzu_cmd/yuzu.cpp")
          text = path.read_text()

          if "#include <cstring>" not in text:
              text = text.replace("#include <string>", "#include <string>\n#include <cstring>", 1)

          if "#include <unistd.h>" not in text:
              text = text.replace(
                  "#include <getopt.h>",
                  "#include <getopt.h>\n#ifndef _MSC_VER\n#include <unistd.h>\n#endif",
                  1,
              )

          pattern = re.compile(
              r'#define\s+SDL_MAIN_USE_CALLBACKS\s+1\s*\n#include\s+<SDL3/SDL_main\.h>',
              re.MULTILINE,
          )
          replacement = (
              "#ifdef YUZU_BIONIC_CLI\n"
              "#define SDL_MAIN_HANDLED 1\n"
              "#else\n"
              "#define SDL_MAIN_USE_CALLBACKS 1\n"
              "#endif\n"
              "#include <SDL3/SDL_main.h>"
          )
          text, count = pattern.subn(replacement, text, count=1)

          text, count = re.subn(
              r'getopt_long\s*\(\s*argc\s*,\s*argv\s*,\s*"[^"]*"',
              'getopt_long(argc, argv, "g:fhvnc:m:p::u:d:i:sx:"',
              text,
              count=1,
          )
          text = text.replace('{"input-profile", no_argument, 0, \'i\'},', '{"input-profile", required_argument, 0, \'i\'},')
          text = text.replace('{"filter", no_argument, 0, \'x\'},', '{"filter", required_argument, 0, \'x\'},')

          if "[BIONIC] Step 1:" not in text:
              text = text.replace("state->system.Initialize();", 'std::cout << "[BIONIC] Step 1: Init System Core..." << std::endl;\n    state->system.Initialize();', 1)
          if "[BIONIC] Step 2:" not in text:
              text = text.replace("state->system.ApplySettings();", 'std::cout << "[BIONIC] Step 2: Apply Settings..." << std::endl;\n    state->system.ApplySettings();', 1)
          if "[BIONIC] Step 3:" not in text:
              text = text.replace("state->system.SetContentProvider", 'std::cout << "[BIONIC] Step 3: Filesystem Ready..." << std::endl;\n    state->system.SetContentProvider', 1)
          if "[BIONIC] Step 4:" not in text:
              text = text.replace("const Core::SystemResultStatus load_result = state->system.Load(", 'std::cout << "[BIONIC] Step 4: Loading ROM..." << std::endl;\n    const Core::SystemResultStatus load_result = state->system.Load(', 1)

          if "int main(int argc, char** argv)" not in text:
              native_main = (
                  "\n#ifdef YUZU_BIONIC_CLI\n\n"
                  "int main(int argc, char** argv) {\n"
                  "    setvbuf(stdout, nullptr, _IONBF, 0);\n"
                  "    setvbuf(stderr, nullptr, _IONBF, 0);\n\n"
                  "    if (chdir(\"/data/eden\") != 0) {\n"
                  "        std::cerr << \"Warning: unable to chdir to /data/eden\" << std::endl;\n"
                  "    }\n\n"
                  "    SDL_SetMainReady();\n\n"
                  "    std::cout << \"[BIONIC] Native main() entered.\" << std::endl;\n\n"
                  "    void* appstate = nullptr;\n"
                  "    const SDL_AppResult result = SDL_AppInit(&appstate, argc, argv);\n"
                  "    std::cout << \"[BIONIC] SDL_AppInit returned \" << static_cast<int>(result) << std::endl;\n\n"
                  "    if (appstate != nullptr) {\n"
                  "        SDL_AppQuit(appstate, result);\n"
                  "    }\n\n"
                  "    return (result == SDL_APP_CONTINUE || result == SDL_APP_SUCCESS) ? 0 : 1;\n"
                  "}\n\n"
                  "#endif\n"
              )
              text += native_main

          path.write_text(text)
          print("Native main() ready.")
          PY

      # ============================================================
      # 19. C++20 stop_token
      # ============================================================
      - name: Ensure CXX20 stop_token
        shell: bash
        run: |
          set -eux
          for f in src/common/thread_worker.h src/common/polyfill_thread.h src/common/thread.h; do
            if [ -f "$f" ] && ! grep -q '#include <stop_token>' "$f"; then
              sed -i '1i#include <stop_token>' "$f"
            fi
          done

      # ============================================================
      # 20. Source validation
      # ============================================================
      - name: Validate Patched Sources
        shell: bash
        run: |
          set -eux

          echo "=== Check control characters ==="
          if LC_ALL=C grep -RIl $'\001' src/yuzu_cmd 2>/dev/null; then
            echo "ERROR: ASCII 0x01 control character found."
            exit 1
          fi
          echo "PASS: no ASCII 0x01."

          echo "=== Check Native main ==="
          grep -n 'int main(int argc, char\*\* argv)' src/yuzu_cmd/yuzu.cpp

          echo "=== Check Android source blocks ==="
          if grep -n 'if(ANDROID)' src/common/CMakeLists.txt; then
            echo "ERROR: unguarded common Android block remains."
            exit 1
          fi

          if grep -n 'if (ANDROID)$' src/input_common/CMakeLists.txt; then
            echo "ERROR: unguarded input Android block remains."
            exit 1
          fi
          echo "PASS: Android blocks are guarded."

      # ============================================================
      # 21. Configure
      # ============================================================
      - name: Configure CMake
        shell: bash
        run: |
          set -eux
          rm -rf build

          cmake \
            -S . \
            -B build \
            -GNinja \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DYUZU_CMD=ON \
            -DYUZU_BIONIC_CLI=ON \
            -DYUZU_USE_BUNDLED_SDL3=OFF \
            -DEDEN_BIONIC_SDL3_SOURCE="$SDL_SOURCE_DIR" \
            -DENABLE_QT=OFF \
            -DENABLE_QT_TRANSLATION=OFF \
            -DENABLE_OPENGL=OFF \
            -DENABLE_CUBEB=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DENABLE_COMPATIBILITY_LIST_DOWNLOAD=OFF \
            -DENABLE_LIBUSB=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_DOWNLOAD_ANDROID_VVL=OFF \
            -DYUZU_DOWNLOAD_TIME_ZONE_DATA=ON \
            -DYUZU_LEGACY=ON \
            -DYUZU_ENABLE_LTO=OFF \
            -DCMAKE_CXX_FLAGS="-fexperimental-library" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -Wl,--as-needed" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld -Wl,--as-needed"

      # ============================================================
      # 22. Configure 后构建依赖审计 (严格审查 build.ninja 实际链接)
      # ============================================================
      - name: Audit Generated Build Graph
        shell: bash
        run: |
          set -eux

          echo "=== 1. 验证没有生成预编译 SDL3 缓存目录 ==="
          if [ -d ".cache/cpm/sdl3" ] || [ -d ".cache/cpm/sdl3-ci" ]; then
            echo "ERROR: CPM Android SDL3 directory detected in .cache/cpm!"
            exit 1
          fi
          echo "PASS: No CPM Android SDL3 directory."

          echo "=== 2. 验证 build.ninja 中没有实际链接 OpenSLES ==="
          if grep -E -- '-lOpenSLES\b|libOpenSLES\.so|SDL_openslES\.c\.o' build/build.ninja 2>/dev/null; then
            echo "ERROR: OpenSLES entered build.ninja."
            exit 1
          fi
          echo "PASS: no OpenSLES in build.ninja."

          echo "=== 3. 验证 build.ninja 中没有残留 -Wl,-u,JNI_OnLoad ==="
          if grep -E -- '-Wl,-u,JNI_OnLoad' build/build.ninja 2>/dev/null; then
            echo "ERROR: Forced JNI_OnLoad remains in build.ninja."
            exit 1
          fi
          echo "PASS: no JNI_OnLoad in build.ninja."

          echo "=== 4. 验证 build.ninja 中没有实际链接 MediaNDK ==="
          if grep -E -- '-lmediandk\b|libmediandk\.so' build/build.ninja 2>/dev/null; then
            echo "ERROR: MediaNDK remains in build.ninja."
            exit 1
          fi
          echo "PASS: no MediaNDK in build.ninja."

      # ============================================================
      # 23. C++20 test
      # ============================================================
      - name: Verify CXX20 stop_token
        shell: bash
        run: |
          set -eux

          cat >/tmp/test_cpp20.cpp <<'EOF'
          #include <stop_token>
          #include <thread>

          int main() {
              std::stop_source source;
              std::stop_token token = source.get_token();
              std::stop_callback callback(token, []() {});
              (void)callback;
              return 0;
          }
          EOF

          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            --target=aarch64-none-linux-android34 \
            --sysroot="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
            -std=c++20 \
            -fexperimental-library \
            /tmp/test_cpp20.cpp \
            -o /tmp/test_cpp20

          file /tmp/test_cpp20

      # ============================================================
      # 24. Build
      # ============================================================
      - name: Build Eden CLI
        shell: bash
        run: |
          set -eux
          echo "============================================================"
          echo "Building eden-cli"
          echo "============================================================"
          ninja -C build -j"$(nproc)" yuzu-cmd

      # ============================================================
      # 25. ELF Validation
      # ============================================================
      - name: Verify Pure Bionic ELF
        shell: bash
        run: |
          set -eux
          BIN="build/bin/eden-cli"
          test -f "$BIN"
          file "$BIN"

          echo "=== Check main Symbol ==="
          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -C "$BIN" | grep -E '(^| )main$'

          echo "=== Check DT_NEEDED ==="
          readelf -d "$BIN"
          if readelf -d "$BIN" | grep -Ei 'OpenSLES|mediandk|android\.so|gui\.so'; then
            echo "ERROR: forbidden Android dynamic library detected."
            exit 1
          fi

          echo "=== Check Undefined Android Symbols ==="
          if "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -u "$BIN" | grep -Ei 'slCreateEngine|SL_IID_|ANativeWindow_|ASensorManager_|AAssetManager_|JNI_OnLoad|JavaVM'; then
            echo "ERROR: forbidden Android runtime symbol detected."
            exit 1
          fi
          echo "PASS: Pure Bionic ELF validation passed."

      # ============================================================
      # 26. Package
      # ============================================================
      - name: Package Eden Bionic ARM64
        shell: bash
        run: |
          set -eux
          rm -rf output_bin && mkdir -p output_bin
          cp build/bin/eden-cli output_bin/eden-cli

          LIBCXX="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          test -f "$LIBCXX"
          cp "$LIBCXX" output_bin/libc++_shared.so

          file output_bin/*
          tar -czf eden-bionic-arm64.tar.gz -C output_bin .
          ls -lh eden-bionic-arm64.tar.gz

      # ============================================================
      # 27. Upload
      # ============================================================
      - name: Upload Eden Bionic ARM64
        uses: actions/upload-artifact@v4
        with:
          name: eden-bionic-arm64
          path: eden-bionic-arm64.tar.gz
          if-no-files-found: error
