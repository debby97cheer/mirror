name: Diagnostic Bionic Architecture Dependencies

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-eden-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        shell: bash
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true

      - name: Checkout Eden
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Host Dependencies
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache glslang-tools nasm libtool python3 pkg-config file jq

      - name: Setup Android NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Export NDK
        run: echo "NDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Patch YUZU_CMD & YUZU_BIONIC_CLI option
        run: |
          sed -i 's/cmake_dependent_option(YUZU_CMD "Compile the yuzu-cmd executable" OFF "NOT ANDROID" OFF)/option(YUZU_CMD "Compile the eden-cli executable" ON)/g' CMakeLists.txt || true
          sed -i 's/cmake_dependent_option(YUZU_CMD "Compile the eden-cli executable" OFF "NOT ANDROID" OFF)/option(YUZU_CMD "Compile the eden-cli executable" ON)/g' CMakeLists.txt || true
          sed -i '/option(YUZU_CMD/a option(YUZU_BIONIC_CLI "Build standalone Android/Bionic CLI" OFF)\nif (YUZU_BIONIC_CLI)\nadd_compile_definitions(YUZU_BIONIC_CLI)\nendif()' CMakeLists.txt

      - name: Configure CMake (BUNDLED SDL3 OFF)
        run: |
          rm -rf build
          cmake -S . -B build -GNinja \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DYUZU_CMD=ON \
            -DYUZU_BIONIC_CLI=ON \
            -DYUZU_USE_BUNDLED_SDL3=OFF \
            -DENABLE_QT=OFF \
            -DENABLE_QT_TRANSLATION=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DENABLE_COMPATIBILITY_LIST_DOWNLOAD=OFF \
            -DENABLE_LIBUSB=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_DOWNLOAD_ANDROID_VVL=OFF \
            -DSDL_AUDIO=OFF \
            -DSDL_OPENSLES=OFF \
            -DSDL_VIDEO_ANDROID=OFF \
            -DSDL_DUMMYVIDEO=ON

      - name: Run Architecture Dependency Probe
        run: |
          echo "========================================================"
          echo "[PROBE 1] 查找 mediandk 的确切链接来源"
          echo "========================================================"
          grep -Rni "mediandk" src CMakeLists.txt externals CMakeModules || true

          echo "========================================================"
          echo "[PROBE 2] 查找 -landroid 的确切链接来源"
          echo "========================================================"
          grep -RniE 'target_link_libraries.*android|target_link_libraries.*mediandk' src CMakeLists.txt externals CMakeModules || true

          echo "========================================================"
          echo "[PROBE 3] 查找 fs_android 等 Android 专属源码的挂载点"
          echo "========================================================"
          grep -Rni "fs_android.cpp" src CMakeLists.txt || true
          grep -Rni "software_keyboard.cpp" src CMakeLists.txt || true

          echo "========================================================"
          echo "[PROBE 4] 检查 SDL3 的实际来源 (必须是 SOURCE_DIR，不能是 libSDL3.a)"
          echo "========================================================"
          grep -Rni 'SDL3::SDL3\|SDL3_SOURCE_DIR\|SDL3_BINARY_DIR' build CMakeCache.txt || true
          
          echo "========================================================"
          echo "[PROBE 5] 扫描本地 CPM 缓存中是否仍然拉取了预编译的 libSDL3.a"
          echo "========================================================"
          find .cache/cpm/sdl3 -maxdepth 4 -type f \( -name 'libSDL3.a' -o -name 'CMakeCache.txt' \) -print || true

          if find .cache/cpm/sdl3 -type f -name 'libSDL3.a' | grep -q "libSDL3.a"; then
              echo "CRITICAL ERROR: CMake is still pulling prebuilt Android libSDL3.a!"
              exit 1
          fi
          echo "PASS: No prebuilt libSDL3.a detected in CPM cache."
