name: Build Eden Bionic Native CLI ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-eden-bionic-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        shell: bash
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true

      - name: Checkout Eden
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Host Dependencies
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache glslang-tools nasm libtool python3 pkg-config file jq

      - name: Setup Android NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Export NDK
        run: echo "NDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Patch CMake & Architecture Isolation
        shell: bash
        run: |
          set -eux
          python3 <<'PY'
          from pathlib import Path
          import re

          # 1. 根目录 CMakeLists.txt: 暴露 YUZU_CMD 并定义 YUZU_BIONIC_CLI
          p_root = Path("CMakeLists.txt")
          text = p_root.read_text()
          text = re.sub(r'cmake_dependent_option\s*\(\s*YUZU_CMD[^\)]*?\)', 'option(YUZU_CMD "Compile CLI" ON)', text, flags=re.MULTILINE|re.DOTALL)
          if "YUZU_BIONIC_CLI" not in text:
              text = text.replace(
                  'option(YUZU_CMD "Compile CLI" ON)',
                  'option(YUZU_CMD "Compile CLI" ON)\noption(YUZU_BIONIC_CLI "Build standalone Android/Bionic CLI" ON)\nif (YUZU_BIONIC_CLI)\n    add_compile_definitions(YUZU_BIONIC_CLI)\nendif()'
              )
          p_root.write_text(text)
          print("Patched root CMakeLists.txt")

          # 2. 统一将各模块中的 if (ANDROID) 条件隔离，避免破坏 target_sources 语法
          targets_to_guard = [
              Path("src/CMakeLists.txt"),
              Path("src/common/CMakeLists.txt"),
              Path("src/input_common/CMakeLists.txt"),
              Path("src/core/CMakeLists.txt"),
          ]

          for cmake in targets_to_guard:
              if cmake.exists():
                  content = cmake.read_text()
                  # 仅将顶层的 if (ANDROID) 改造为 if (ANDROID AND NOT YUZU_BIONIC_CLI)
                  content = re.sub(r'if\s*\(\s*ANDROID\s*\)', 'if (ANDROID AND NOT YUZU_BIONIC_CLI)', content)
                  cmake.write_text(content)
                  print(f"Guarded ANDROID blocks in: {cmake}")

          # 3. 保证 src/CMakeLists.txt 正确调用 yuzu_cmd
          p_src = Path("src/CMakeLists.txt")
          content = p_src.read_text()
          content = re.sub(r'if\s*\(\s*YUZU_CMD\s*\)', 'if (YUZU_CMD OR YUZU_BIONIC_CLI)', content, count=1)
          p_src.write_text(content)

          # 4. src/yuzu_cmd/CMakeLists.txt: 注入 android_settings.cpp 数据源并链接 log
          p_cmd = Path("src/yuzu_cmd/CMakeLists.txt")
          content = p_cmd.read_text()
          if "android_settings.cpp" not in content:
              content = content.replace(
                  "add_executable(yuzu-cmd\n",
                  "add_executable(yuzu-cmd\n    ../android/app/src/main/jni/android_settings.cpp\n",
                  1
              )
          if "target_link_libraries(yuzu-cmd PRIVATE log)" not in content:
              content += "\nif (ANDROID AND YUZU_BIONIC_CLI)\n    target_link_libraries(yuzu-cmd PRIVATE log)\nendif()\n"
          p_cmd.write_text(content)
          print("Injected android_settings.cpp into yuzu-cmd")

          # 5. 设备电量与输入子系统的条件宏保护
          p_pwr = Path("src/common/device_power_state.cpp")
          if p_pwr.exists():
              p_pwr.write_text(re.sub(r'#elif\s+defined\(__ANDROID__\)', '#elif defined(__ANDROID__) && !defined(YUZU_BIONIC_CLI)', p_pwr.read_text()))

          for header in [Path("src/input_common/main.cpp"), Path("src/input_common/main.h")]:
              if header.exists():
                  header.write_text(re.sub(r'#if(def\s+__ANDROID__|defined\(__ANDROID__\))', '#if defined(__ANDROID__) && !defined(YUZU_BIONIC_CLI)', header.read_text()))

          # 6. cpmfile.json: 剔除预编译归档，迫使 SDL3 从源码编译
          import json
          cpm = Path("cpmfile.json")
          if cpm.exists():
              data = json.loads(cpm.read_text())
              pkg = data.get("sdl3")
              if pkg:
                  for k in ["url", "binaries", "download_only", "custom_package_url"]:
                      if k in pkg:
                          del pkg[k]
                  cpm.write_text(json.dumps(data, indent=2) + "\n")
                  print("Purged prebuilt definitions from cpmfile.json")

          # 7. 确保 C++20 stop_token 包含完整
          for hdr_path in ["src/common/thread_worker.h", "src/common/polyfill_thread.h", "src/common/thread.h"]:
              p_hdr = Path(hdr_path)
              if p_hdr.exists():
                  txt = p_hdr.read_text()
                  if "#include <stop_token>" not in txt:
                      p_hdr.write_text("#include <stop_token>\n" + txt)
          PY
          rm -rf .cache/cpm/sdl3 || true

      - name: Setup Headless Window & C++ Interface
        shell: bash
        run: |
          set -eux
          python3 <<'PY'
          from pathlib import Path
          import re

          # 1. 规范化 Null Window 实现
          p_null = Path("src/yuzu_cmd/emu_window/emu_window_sdl3_null.cpp")
          p_null.write_text(
              "// SPDX-FileCopyrightText: 2026 Eden Emulator Project\n"
              "// SPDX-License-Identifier: GPL-3.0-or-later\n\n"
              "#include <iostream>\n"
              "#include <memory>\n\n"
              "#include \"yuzu_cmd/emu_window/emu_window_sdl3_null.h\"\n\n"
              "EmuWindow_SDL3_Null::EmuWindow_SDL3_Null(\n"
              "    InputCommon::InputSubsystem* input_subsystem,\n"
              "    Core::System& system,\n"
              "    bool fullscreen)\n"
              "    : EmuWindow_SDL3{input_subsystem, system} {\n"
              "    (void)fullscreen;\n"
              "    is_open = true;\n"
              "    std::cout << \"[BIONIC] EmuWindow_SDL3_Null: initialized\" << std::endl;\n"
              "}\n\n"
              "EmuWindow_SDL3_Null::~EmuWindow_SDL3_Null() = default;\n\n"
              "std::unique_ptr<Core::Frontend::GraphicsContext>\n"
              "EmuWindow_SDL3_Null::CreateSharedContext() const {\n"
              "    return std::make_unique<DummyContext>();\n"
              "}\n"
          )
          print("Null Window implementation deployed.")

          # 2. 基类跳过物理 SDL 窗口创建 (通过切片拼接，不使用包含 \\1 的替换字符串)
          p_base = Path("src/yuzu_cmd/emu_window/emu_window_sdl3.cpp")
          text = p_base.read_text()
          if "#include <iostream>" not in text:
              text = "#include <iostream>\n" + text

          pattern = re.compile(r'input_subsystem->Initialize\(\)\s*;\s*\n')
          if "#ifdef YUZU_BIONIC_CLI" not in text:
              match = pattern.search(text)
              if not match:
                  raise SystemExit("ERROR: could not locate input_subsystem->Initialize() in emu_window_sdl3.cpp")
              headless_block = (
                  match.group(0)
                  + "#ifdef YUZU_BIONIC_CLI\n"
                  + "    std::cout << \"[BIONIC] Headless mode - no physical window\" << std::endl;\n"
                  + "    is_open = true;\n"
                  + "    render_window = nullptr;\n"
                  + "    return;\n"
                  + "#endif\n"
              )
              text = text[:match.start()] + headless_block + text[match.end():]

          text = text.replace(
              "EmuWindow_SDL3::~EmuWindow_SDL3() {",
              "EmuWindow_SDL3::~EmuWindow_SDL3() {\n    if (!render_window) return;"
          )
          p_base.write_text(text)
          print("Base SDL3 window patched cleanly without control characters.")

          # 3. yuzu.cpp 遥测日志注入
          p_yuzu = Path("src/yuzu_cmd/yuzu.cpp")
          yuzu_text = p_yuzu.read_text()
          yuzu_text = yuzu_text.replace("state->system.Initialize();", 'std::cout << "[BIONIC] Step 1: Init System Core..." << std::endl;\n    state->system.Initialize();')
          yuzu_text = yuzu_text.replace("state->system.ApplySettings();", 'std::cout << "[BIONIC] Step 2: Settings Applied..." << std::endl;\n    state->system.ApplySettings();')
          yuzu_text = yuzu_text.replace("state->system.SetContentProvider", 'std::cout << "[BIONIC] Step 3: Filesystem Ready!" << std::endl;\n    state->system.SetContentProvider')
          yuzu_text = yuzu_text.replace("const Core::SystemResultStatus load_result = state->system.Load(", 'std::cout << "[BIONIC] Step 4: Loading Target ROM..." << std::endl;\n    const Core::SystemResultStatus load_result = state->system.Load(')
          p_yuzu.write_text(yuzu_text)
          PY

      - name: Verify Patched Sources Before Build
        shell: bash
        run: |
          set -eux
          echo "=== Check U+0001/control character ==="
          if LC_ALL=C grep -RIl $'\001' src/yuzu_cmd/emu_window src/yuzu_cmd/yuzu.cpp; then
              echo "CRITICAL ERROR: control character 0x01 detected."
              exit 1
          fi
          echo "PASS: No control characters detected."

          echo "=== Verify Headless Guard ==="
          grep -n -A7 "YUZU_BIONIC_CLI" src/yuzu_cmd/emu_window/emu_window_sdl3.cpp

          echo "=== Verify stop_token Include ==="
          grep -n "stop_token" src/common/thread_worker.h

      - name: Configure CMake
        run: |
          rm -rf build
          cmake -S . -B build -GNinja \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DYUZU_CMD=ON \
            -DYUZU_BIONIC_CLI=ON \
            -DYUZU_USE_BUNDLED_SDL3=OFF \
            -DENABLE_QT=OFF \
            -DENABLE_QT_TRANSLATION=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DENABLE_COMPATIBILITY_LIST_DOWNLOAD=OFF \
            -DENABLE_LIBUSB=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_DOWNLOAD_ANDROID_VVL=OFF \
            -DSDL_AUDIO=OFF \
            -DSDL_DUMMYVIDEO=ON \
            -DCMAKE_CXX_FLAGS="-fexperimental-library" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -Wl,--as-needed" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld -Wl,--as-needed"

      - name: Build Eden CLI Target
        run: |
          echo "============================================================"
          echo "Building target: yuzu-cmd (Output: eden-cli)"
          echo "============================================================"
          ninja -C build -j"$(nproc)" yuzu-cmd

      - name: Verify Clean Bionic ELF
        run: |
          BIN="build/bin/eden-cli"
          test -f "$BIN"

          echo "============================================================"
          echo "LAYER 1: DT_NEEDED DYNAMIC DEPENDENCIES"
          echo "============================================================"
          readelf -d "$BIN"

          for BANNED in OpenSLES mediandk android.so gui.so; do
            if readelf -d "$BIN" | grep -i "$BANNED"; then
              echo "CRITICAL ERROR: Banned dynamic library $BANNED detected!"
              exit 1
            fi
          done

          echo "============================================================"
          echo "LAYER 2: UNDEFINED SYMBOLS SCAN"
          echo "============================================================"
          UNDEF_ANDROID=$("$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -u "$BIN" | grep -E 'ANativeWindow|ASensor|ALooper|AAsset|slCreateEngine|SL_IID' || true)
          if [ -n "$UNDEF_ANDROID" ]; then
            echo "CRITICAL ERROR: Undefined Android Framework symbols detected:"
            echo "$UNDEF_ANDROID"
            exit 1
          fi

          echo "PASS: 100% PURE Native Bionic ELF with ZERO stubs!"

      - name: Package Eden Bionic ARM64
        run: |
          rm -rf output_bin && mkdir -p output_bin
          cp build/bin/eden-cli output_bin/eden-cli
          cp "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" output_bin/libc++_shared.so
          tar -czf eden-bionic-arm64.tar.gz -C output_bin .

      - name: Upload Eden Bionic ARM64
        uses: actions/upload-artifact@v4
        with:
          name: eden-bionic-arm64
          path: eden-bionic-arm64.tar.gz
