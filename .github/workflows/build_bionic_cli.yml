name: Build Eden Bionic Native CLI ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-eden-bionic-arm64:
    runs-on: ubuntu-latest

    env:
      SDL_SOURCE_DIR: ${{ github.workspace }}/third_party/SDL
      SDL_VERSION: release-3.4.8

    steps:

      # ============================================================
      # 1. 清理 Runner
      # ============================================================
      - name: Free Disk Space
        shell: bash
        run: |
          set -eux

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true

          df -h

      # ============================================================
      # 2. Checkout Eden
      # ============================================================
      - name: Checkout Eden
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # 3. Host Dependencies
      # ============================================================
      - name: Install Host Dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            ccache \
            glslang-tools \
            nasm \
            libtool \
            python3 \
            pkg-config \
            file

          cmake --version
          ninja --version
          python3 --version

      # ============================================================
      # 4. Android NDK r27c
      # ============================================================
      - name: Setup Android NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Export NDK
        shell: bash
        run: |
          set -eux

          echo "NDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      # ============================================================
      # 5. Checkout SDL3 3.4.8
      # ============================================================
      - name: Checkout SDL3 Source
        shell: bash
        run: |
          set -eux

          rm -rf third_party
          mkdir -p third_party

          git clone \
            --depth 1 \
            --branch "$SDL_VERSION" \
            https://github.com/libsdl-org/SDL.git \
            "$SDL_SOURCE_DIR"

          test -f "$SDL_SOURCE_DIR/CMakeLists.txt"

          echo "SDL3 commit:"
          git -C "$SDL_SOURCE_DIR" rev-parse HEAD

      # ============================================================
      # 6. Patch SDL3
      #
      # 核心修复：
      #
      # SDL 3.4.8 Android backend 默认会：
      #
      #   src/video/android/*
      #   -landroid
      #
      # 这里引入：
      #
      #   SDL_BIONIC_NO_ANDROID_VIDEO
      #
      # 并彻底关闭 Android Video backend。
      #
      # 保留：
      #
      #   SDL_VIDEO=ON
      #   SDL_DUMMYVIDEO=ON
      #
      # 因此 Eden 仍然可以初始化 SDL Video subsystem，
      # 但不再依赖 libandroid.so。
      # ============================================================
      - name: Patch SDL3 for Pure Bionic
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path

          path = Path("third_party/SDL/CMakeLists.txt")
          text = path.read_text()

          # --------------------------------------------------------
          # 6.1 添加 SDL_BIONIC_NO_ANDROID_VIDEO option
          # --------------------------------------------------------

          option_block = r'''
          option(
              SDL_BIONIC_NO_ANDROID_VIDEO
              "Disable SDL Android Video backend for standalone Bionic builds"
              OFF
          )
          '''

          if "SDL_BIONIC_NO_ANDROID_VIDEO" not in text:
              marker = "project(SDL3"
              pos = text.find(marker)

              if pos < 0:
                  raise SystemExit(
                      "ERROR: Cannot locate SDL project() declaration."
                  )

              line_end = text.find("\n", pos)

              text = (
                  text[:line_end + 1]
                  + option_block
                  + "\n"
                  + text[line_end + 1:]
              )

              print(
                  "Added SDL_BIONIC_NO_ANDROID_VIDEO option."
              )
          else:
              print(
                  "SDL_BIONIC_NO_ANDROID_VIDEO already exists."
              )

          # --------------------------------------------------------
          # 6.2 精确定位 Android platform block
          # --------------------------------------------------------

          android_begin = text.find("if(ANDROID)")

          if android_begin < 0:
              raise SystemExit(
                  "ERROR: Cannot locate `if(ANDROID)` in SDL CMakeLists.txt."
              )

          android_video_begin = text.find(
              "  if(SDL_VIDEO)",
              android_begin
          )

          if android_video_begin < 0:
              raise SystemExit(
                  "ERROR: Cannot locate Android SDL_VIDEO block."
              )

          android_video_end = text.find(
              "  endif()",
              android_video_begin
          )

          if android_video_end < 0:
              raise SystemExit(
                  "ERROR: Cannot locate first endif() of Android SDL_VIDEO block."
              )

          # --------------------------------------------------------
          # 6.3 更稳妥地找到真正结束位置
          #
          # 当前 SDL 3.4.8 Android Video block 结构：
          #
          #   if(SDL_VIDEO)
          #       ...
          #       if(SDL_OPENGLES)
          #           ...
          #       endif()
          #
          #       if(SDL_VULKAN)
          #           ...
          #           if(VULKAN_PASSED_ANDROID_CHECKS)
          #               ...
          #               if(SDL_RENDER_VULKAN)
          #                   ...
          #               endif()
          #           endif()
          #       endif()
          #
          #       ...
          #   endif()
          #
          # 因此这里使用括号深度解析，而不是简单 find().
          # --------------------------------------------------------

          i = android_video_begin
          depth = 0
          end_pos = None

          while i < len(text):
              line_end = text.find("\n", i)

              if line_end < 0:
                  line_end = len(text)

              line = text[i:line_end].strip()

              # 忽略注释
              if not line.startswith("#"):
                  if line.startswith("if("):
                      depth += 1

                  elif line.startswith("if ("):
                      depth += 1

                  elif line.startswith("endif"):
                      depth -= 1

                      if depth == 0:
                          end_pos = line_end + 1
                          break

              i = line_end + 1

          if end_pos is None:
              raise SystemExit(
                  "ERROR: Failed to locate end of SDL Android Video block."
              )

          original_block = text[
              android_video_begin:end_pos
          ]

          print("=== Original SDL Android Video block ===")
          print(original_block)

          # --------------------------------------------------------
          # 6.4 只在这个 Android Video block 上增加 Bionic guard
          # --------------------------------------------------------

          patched_block = original_block

          first_if = "  if(SDL_VIDEO)"

          if first_if not in patched_block:
              raise SystemExit(
                  "ERROR: Expected SDL Android Video opening if(SDL_VIDEO) missing."
              )

          patched_block = patched_block.replace(
              first_if,
              "  if(SDL_VIDEO AND NOT SDL_BIONIC_NO_ANDROID_VIDEO)",
              1,
          )

          text = (
              text[:android_video_begin]
              + patched_block
              + text[end_pos:]
          )

          # --------------------------------------------------------
          # 6.5 Bionic 下彻底取消 SDL 强制 JNI_OnLoad
          # --------------------------------------------------------

          text = text.replace(
              '''
            target_link_options(SDL3-static INTERFACE "-Wl,-u,JNI_OnLoad")
          ''',
              '''
            if(NOT SDL_BIONIC_NO_ANDROID_VIDEO)
              target_link_options(SDL3-static INTERFACE "-Wl,-u,JNI_OnLoad")
            endif()
          '''
          )

          path.write_text(text)

          print(
              "SDL3 CMake patched successfully."
          )
          PY

          echo "============================================================"
          echo "SDL3 Android Video dependency audit"
          echo "============================================================"

          grep -n \
            -A8 \
            -B4 \
            "SDL_BIONIC_NO_ANDROID_VIDEO" \
            "$SDL_SOURCE_DIR/CMakeLists.txt" || true

          echo
          echo "Checking SDL Android Video backend source references..."

          grep -n \
            -A12 \
            -B5 \
            "src/video/android" \
            "$SDL_SOURCE_DIR/CMakeLists.txt" || true

      # ============================================================
      # 7. 清除 cpmfile.json 中 SDL3 预编译包定义
      # ============================================================
      - name: Sanitize CPM SDL3 Configuration
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          import json
          from pathlib import Path

          cpm = Path("cpmfile.json")

          if cpm.exists():
              data = json.loads(cpm.read_text())

              if "sdl3" in data:
                  del data["sdl3"]

                  cpm.write_text(
                      json.dumps(data, indent=2) + "\n"
                  )

                  print(
                      "Deleted 'sdl3' entry from cpmfile.json."
                  )
              else:
                  print(
                      "No 'sdl3' entry found in cpmfile.json."
                  )
          else:
              print(
                  "cpmfile.json not found."
              )
          PY

            # ============================================================
      # 8. Patch Root CMake
      #
      # 注册 YUZU_BIONIC_CLI，并在所有目标创建完成后，
      # 从整棵 target 树的 LINK / INTERFACE_LINK
      # 依赖里剥掉 android / -landroid / libandroid.so。
      #
      # 这一步用于根除最终 build.ninja 里残留的 -landroid。
      # ============================================================
      - name: Patch Root CMake
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("CMakeLists.txt")
          text = path.read_text()

          # --------------------------------------------------------
          # 1. YUZU_CMD
          # --------------------------------------------------------

          pattern = re.compile(
              r'cmake_dependent_option\s*\(\s*YUZU_CMD\b.*?\)',
              re.DOTALL | re.MULTILINE,
          )

          replacement = (
              'option(YUZU_CMD "Compile the eden-cli executable" ON)'
          )

          text, count = pattern.subn(
              replacement,
              text,
              count=1,
          )

          if count:
              print("[BIONIC] YUZU_CMD restriction removed.")
          elif replacement in text:
              print("[BIONIC] YUZU_CMD already patched.")
          else:
              raise SystemExit(
                  "ERROR: YUZU_CMD declaration not found."
              )

          # --------------------------------------------------------
          # 2. YUZU_BIONIC_CLI
          # --------------------------------------------------------

          if "option(YUZU_BIONIC_CLI" not in text:
              marker = (
                  'option(YUZU_CMD "Compile the eden-cli executable" ON)'
              )

              block = (
                  marker + "\n"
                  'option(YUZU_BIONIC_CLI "Build standalone Android/Bionic CLI" OFF)\n'
                  "if (YUZU_BIONIC_CLI)\n"
                  "    add_compile_definitions(YUZU_BIONIC_CLI)\n"
                  "endif()\n"
              )

              text = text.replace(
                  marker,
                  block,
                  1,
              )

              print("[BIONIC] YUZU_BIONIC_CLI added.")
          else:
              print("[BIONIC] YUZU_BIONIC_CLI already present.")

          # --------------------------------------------------------
          # 3. 保留原有 FFmpeg imported target 清理
          #    （只做 mediandk，避免改动原有行为）
          # --------------------------------------------------------

          ffmpeg_filter_block = "\n".join(
              [
                  "",
                  "# =========================================================================",
                  "# Bionic CLI: Strip Android-only imported dependencies",
                  "# =========================================================================",
                  "if (YUZU_BIONIC_CLI)",
                  "",
                  "    function(bionic_strip_imported_target _target)",
                  "",
                  "        if (TARGET ${_target})",
                  "",
                  "            get_target_property(_aliased ${_target} ALIASED_TARGET)",
                  "",
                  "            if (_aliased AND NOT _aliased MATCHES \"-NOTFOUND$\")",
                  "                set(_real_target \"${_aliased}\")",
                  "            else()",
                  "                set(_real_target \"${_target}\")",
                  "            endif()",
                  "",
                  "            get_target_property(_is_imported ${_real_target} IMPORTED)",
                  "",
                  "            set(_props_to_check INTERFACE_LINK_LIBRARIES)",
                  "",
                  "            if (NOT _is_imported)",
                  "                list(APPEND _props_to_check LINK_LIBRARIES)",
                  "            endif()",
                  "",
                  "            foreach(_prop ${_props_to_check})",
                  "",
                  "                get_target_property(_libs ${_real_target} ${_prop})",
                  "",
                  "                if (_libs AND NOT _libs MATCHES \"-NOTFOUND$\")",
                  "",
                  "                    set(_filtered_libs \"\")",
                  "",
                  "                    foreach(_lib ${_libs})",
                  "",
                  "                        if (NOT _lib MATCHES \"mediandk\")",
                  "                            list(APPEND _filtered_libs \"${_lib}\")",
                  "                        else()",
                  "                            message(STATUS \"[BIONIC] Stripped ${_lib} from ${_real_target}\")",
                  "                        endif()",
                  "",
                  "                    endforeach()",
                  "",
                  "                    set_target_properties(",
                  "                        ${_real_target}",
                  "                        PROPERTIES",
                  "                        ${_prop}",
                  "                        \"${_filtered_libs}\"",
                  "                    )",
                  "",
                  "                endif()",
                  "",
                  "            endforeach()",
                  "",
                  "        endif()",
                  "",
                  "    endfunction()",
                  "",
                  "    bionic_strip_imported_target(FFmpeg::FFmpeg)",
                  "",
                  "    foreach(_comp",
                  "        avcodec",
                  "        avfilter",
                  "        avformat",
                  "        avutil",
                  "        swresample",
                  "        swscale",
                  "    )",
                  "        bionic_strip_imported_target(FFmpeg::${_comp})",
                  "    endforeach()",
                  "",
                  "    bionic_strip_imported_target(yuzu-cmd)",
                  "    bionic_strip_imported_target(core)",
                  "    bionic_strip_imported_target(common)",
                  "    bionic_strip_imported_target(input_common)",
                  "    bionic_strip_imported_target(video_core)",
                  "",
                  "endif()",
                  "",
              ]
          )

          # 防止重复追加
          if "Bionic CLI: Strip Android-only imported dependencies" not in text:
              text += ffmpeg_filter_block

          # --------------------------------------------------------
          # 4. 关键新增：延迟清理 android/-landroid
          #
          # 依赖 CMake 3.19+ 的 cmake_language(DEFER CALL)
          #
          # 在所有 CMakeLists.txt 处理完之后，
          # 遍历整棵 target 树，从 LINK_LIBRARIES /
          # INTERFACE_LINK_LIBRARIES 中移除：
          #
          #     android
          #     -landroid
          #     libandroid.so
          #     $<LINK_ONLY:android>
          # --------------------------------------------------------

          bionic_defer_block = "\n".join(
              [
                  "",
                  "# ===========================================================================",
                  "# BIONIC CLI: final deferred Android dependency sanitizer",
                  "# ===========================================================================",
                  "if (YUZU_BIONIC_CLI)",
                  "",
                  "    function(_bionic_strip_android_from_target _target)",
                  "",
                  "        if (NOT TARGET ${_target})",
                  "            return()",
                  "        endif()",
                  "",
                  "        foreach(_prop LINK_LIBRARIES INTERFACE_LINK_LIBRARIES)",
                  "",
                  "            get_target_property(_libs ${_target} ${_prop})",
                  "",
                  "            if (NOT _libs)",
                  "                continue()",
                  "            endif()",
                  "",
                  "            if (\"${_libs}\" STREQUAL \"${_prop}-NOTFOUND\")",
                  "                continue()",
                  "            endif()",
                  "",
                  "            set(_filtered \"\")",
                  "",
                  "            foreach(_lib IN LISTS _libs)",
                  "",
                  "                set(_strip FALSE)",
                  "",
                  "                if (_lib STREQUAL \"android\" OR _lib STREQUAL \"-landroid\")",
                  "                    set(_strip TRUE)",
                  "                endif()",
                  "",
                  "                if (_lib MATCHES \"libandroid\\\\.so\")",
                  "                    set(_strip TRUE)",
                  "                endif()",
                  "",
                  "                if (_lib MATCHES \"^\\\\$<LINK_ONLY:android>$\")",
                  "                    set(_strip TRUE)",
                  "                endif()",
                  "",
                  "                if (_strip)",
                  "                    message(STATUS \"[BIONIC] DEFER strip '${_lib}' from ${_target} ${_prop}\")",
                  "                else()",
                  "                    list(APPEND _filtered \"${_lib}\")",
                  "                endif()",
                  "",
                  "            endforeach()",
                  "",
                  "            set_target_properties(",
                  "                ${_target}",
                  "                PROPERTIES",
                  "                ${_prop}",
                  "                \"${_filtered}\"",
                  "            )",
                  "",
                  "        endforeach()",
                  "",
                  "    endfunction()",
                  "",
                  "    function(_bionic_strip_android_from_dir _dir)",
                  "",
                  "        if (NOT _dir)",
                  "            return()",
                  "        endif()",
                  "",
                  "        get_property(_targets DIRECTORY \"${_dir}\" PROPERTY BUILDSYSTEM_TARGETS)",
                  "",
                  "        foreach(_t IN LISTS _targets)",
                  "            _bionic_strip_android_from_target(${_t})",
                  "        endforeach()",
                  "",
                  "        get_property(_subdirs DIRECTORY \"${_dir}\" PROPERTY SUBDIRECTORIES)",
                  "",
                  "        foreach(_sub IN LISTS _subdirs)",
                  "            _bionic_strip_android_from_dir(\"${_sub}\")",
                  "        endforeach()",
                  "",
                  "    endfunction()",
                  "",
                  "    cmake_language(",
                  "        DEFER",
                  "        DIRECTORY \"${CMAKE_SOURCE_DIR}\"",
                  "        CALL _bionic_strip_android_from_dir",
                  "        \"${CMAKE_SOURCE_DIR}\"",
                  "    )",
                  "",
                  "endif()",
                  "",
              ]
          )

          if "final deferred Android dependency sanitizer" not in text:
              text += bionic_defer_block

          path.write_text(text)

          print("[BIONIC] Root CMake patched (deferred android sanitizer installed).")
          PY

      # ============================================================
      # 9. 修改 externals/CMakeLists.txt
      #
      # 强制使用本地 SDL3 源码。
      # ============================================================
      - name: Patch SDL3 Dependency Routing
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path

          path = Path("externals/CMakeLists.txt")
          text = path.read_text()

          start_marker = "if (NOT YUZU_USE_BUNDLED_SDL3)"
          end_marker = "# Normalize SDL3 link target across package variants."

          start = text.find(start_marker)
          end = text.find(end_marker)

          if start < 0 or end < 0 or end <= start:
              raise SystemExit(
                  "ERROR: Invalid SDL3 dependency block boundaries."
              )

          new_block = "\n".join(
              [
                  'message(STATUS "Using EXCLUSIVE local source SDL3 for Bionic CLI")',

                  'set(SDL_AUDIO OFF CACHE BOOL "" FORCE)',
                  'set(SDL_VIDEO ON CACHE BOOL "" FORCE)',

                  'set(SDL_SHARED OFF CACHE BOOL "" FORCE)',
                  'set(SDL_STATIC ON CACHE BOOL "" FORCE)',

                  'set(SDL_JOYSTICK OFF CACHE BOOL "" FORCE)',
                  'set(SDL_HAPTIC OFF CACHE BOOL "" FORCE)',
                  'set(SDL_HIDAPI OFF CACHE BOOL "" FORCE)',
                  'set(SDL_SENSOR OFF CACHE BOOL "" FORCE)',
                  'set(SDL_CAMERA OFF CACHE BOOL "" FORCE)',
                  'set(SDL_POWER OFF CACHE BOOL "" FORCE)',
                  'set(SDL_DIALOG OFF CACHE BOOL "" FORCE)',
                  'set(SDL_TRAY OFF CACHE BOOL "" FORCE)',
                  'set(SDL_NOTIFICATION OFF CACHE BOOL "" FORCE)',

                  'set(SDL_OPENGL OFF CACHE BOOL "" FORCE)',
                  'set(SDL_OPENGLES OFF CACHE BOOL "" FORCE)',

                  # --------------------------------------------------
                  # 保留 SDL Video subsystem，
                  # 但只需要 Dummy/Offscreen。
                  # --------------------------------------------------

                  'set(SDL_DUMMYVIDEO ON CACHE BOOL "" FORCE)',

                  # SDL Vulkan API 保持开启。
                  #
                  # 注意：
                  # SDL Android Video backend 本身会被
                  # SDL_BIONIC_NO_ANDROID_VIDEO 禁用。
                  #

                  'set(SDL_VULKAN ON CACHE BOOL "" FORCE)',

                  # Android Java package 不需要。
                  'set(SDL_ANDROID_JAR OFF CACHE BOOL "" FORCE)',

                  # 关键：
                  'set(SDL_BIONIC_NO_ANDROID_VIDEO ON CACHE BOOL "" FORCE)',

                  'add_subdirectory('
                  '"${EDEN_BIONIC_SDL3_SOURCE}" '
                  '"${CMAKE_BINARY_DIR}/eden_sdl3" '
                  'EXCLUDE_FROM_ALL'
                  ')',

                  'if (NOT TARGET SDL3::SDL3)',
                  '    add_library(SDL3::SDL3 ALIAS SDL3-static)',
                  'endif()',

                  '',
              ]
          )

          text = (
              text[:start]
              + new_block
              + text[end:]
          )

          path.write_text(text)

          print(
              "SDL3 dependency routing patched."
          )
          PY

      # ============================================================
      # 10. 修改 common/CMakeLists.txt
      #      + Bionic FS source
      # ============================================================
      - name: Patch Common Android Dependencies and FS
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/common/CMakeLists.txt")
          text = path.read_text()

          text = re.sub(
              r'if\s*\(\s*ANDROID\s*\)(?=[\s\S]*?fs/fs_android\.cpp)',
              'if(ANDROID AND NOT YUZU_BIONIC_CLI)',
              text,
              count=1,
          )

          if "fs_android_bionic.cpp" not in text:
              text += (
                  "\n"
                  "if (YUZU_BIONIC_CLI)\n"
                  "    target_sources(common PRIVATE fs/fs_android_bionic.cpp)\n"
                  "endif()\n"
              )

          path.write_text(text)

          stub_path = Path(
              "src/common/fs/fs_android_bionic.cpp"
          )

          stub_path.write_text(
              "// SPDX-FileCopyrightText: 2026 Eden Emulator Project\n"
              "// SPDX-License-Identifier: GPL-3.0-or-later\n\n"

              "#include <string>\n"

              "#include \"common/common_types.h\"\n"
              "#include \"common/fs/fs_android.h\"\n\n"

              "namespace Common::FS::Android {\n\n"

              "bool IsContentUri(const std::string& path) {\n"
              "    (void)path;\n"
              "    return false;\n"
              "}\n\n"

              "std::string GetFilename(const std::string& path) {\n"
              "    (void)path;\n"
              "    return {};\n"
              "}\n\n"

              "std::string GetParentDirectory(const std::string& path) {\n"
              "    (void)path;\n"
              "    return {};\n"
              "}\n\n"

              "bool Exists(const std::string& path) {\n"
              "    (void)path;\n"
              "    return false;\n"
              "}\n\n"

              "bool IsDirectory(const std::string& path) {\n"
              "    (void)path;\n"
              "    return false;\n"
              "}\n\n"

              "u64 GetSize(const std::string& path) {\n"
              "    (void)path;\n"
              "    return 0;\n"
              "}\n\n"

              "int OpenContentUri("
              "const std::string& filepath, "
              "OpenMode open_mode) {\n"
              "    (void)filepath;\n"
              "    (void)open_mode;\n"
              "    return -1;\n"
              "}\n\n"

              "} // namespace Common::FS::Android\n"
          )

          print(
              "Common Bionic FS implementation ready."
          )
          PY

      # ============================================================
      # 11. Input Android driver
      # ============================================================
      - name: Patch Input Android Driver
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "src/input_common/CMakeLists.txt"
          )

          text = path.read_text()

          if "if (ANDROID AND NOT YUZU_BIONIC_CLI)" in text:
              print(
                  "Input Android block already patched."
              )
          else:
              pattern = re.compile(
                  r'if\s*\(\s*ANDROID\s*\)'
                  r'(?=[\s\S]*?drivers/android\.cpp)',
                  re.MULTILINE,
              )

              text, count = pattern.subn(
                  "if (ANDROID AND NOT YUZU_BIONIC_CLI)",
                  text,
                  count=1,
              )

              if count == 0:
                  raise SystemExit(
                      "ERROR: Could not locate Android input block."
                  )

              print(
                  "Android input driver disabled."
              )

          path.write_text(text)
          PY

      # ============================================================
      # 12. src/CMakeLists.txt
